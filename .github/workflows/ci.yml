name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  green-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      # fetch-depth: 0 (full history) so the changelog-entry check below can
      # resolve HEAD~1 — the previous commit's plugin.json version — on both
      # push and pull_request events.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Stdlib-only — no pip install step by design.
      - name: Manifest version coherence
        run: python scripts/check_versions.py
      - name: Version-gate tests
        run: python scripts/test_check_versions.py
      # A plugin.json version bump must ship with a matching CHANGELOG.md
      # entry, or it merges silently undocumented. Mirrors requirement-manager's
      # gate (adopted 2026-07-06).
      - name: Version bump has a matching CHANGELOG entry
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && ! git diff --quiet HEAD~1 -- consilium/.claude-plugin/plugin.json; then
            VERSION=$(python -c "import json; print(json.load(open('consilium/.claude-plugin/plugin.json'))['version'])")
            # Same reader as the release job, so a bump that passes here always has notes.
            if ! python scripts/changelog_notes.py "$VERSION" >/dev/null; then
              echo "::error::plugin.json version bumped to $VERSION but CHANGELOG.md has no non-empty '## [$VERSION]' section — add one before merging."
              exit 1
            fi
          fi
      - name: ROUND2 smoke tests
        run: python scripts/test_round2.py
      - name: Feedback HTML round-trip tests
        run: python scripts/test_feedback_html.py
      - name: Trias lens-bias contract tests
        run: python scripts/test_lens_bias.py
      - name: Step-7 implement-pipeline (red-green) tests
        run: python scripts/test_implement_pipeline.py
      - name: implement sub-agent output validator tests
        run: python scripts/test_validate_implement_output.py
      - name: probe_change path-decode (security-gate) tests
        run: python scripts/test_probe_change.py
      - name: Version-provenance tests
        run: python scripts/test_version.py
      - name: Build-report assembly tests
        run: python scripts/test_build_report.py
      - name: Confidence-derivation tests
        run: python scripts/test_confidence.py
      - name: Priors signal-computation tests
        run: python scripts/test_priors.py
      - name: Log-feedback pure-function tests
        run: python scripts/test_log_feedback.py
      - name: Strip-context projection tests
        run: python scripts/test_strip_context.py
      - name: Utils pure-function tests
        run: python scripts/test_utils.py
      - name: Scope-gate decision tests
        run: python scripts/test_scope_gate.py
      - name: Pre-dispatch consent-gate tests
        run: python scripts/test_consent_gate.py
      - name: Regression scenarios (run_evals)
        run: python scripts/run_evals.py
      - name: Implement-mode routing gate tests
        run: python scripts/test_implement_mode.py
      - name: Vote degeneracy tests
        run: python scripts/test_vote_degeneracy.py
      - name: Trias model schema tests
        run: python scripts/test_trias_model_schema.py
      - name: Skeptic validation-gate tests
        run: python scripts/test_skeptic.py
      - name: Trias skeptic-lever (6->4) contract tests
        run: python scripts/test_trias_skeptic_lever.py
      - name: Confidence-calibration gate tests
        run: python scripts/test_confidence_calibration.py
      - name: Unit tests (public-leak guard RED path)
        run: python scripts/test_public_leak.py
      - name: Implementation-preview renderer tests
        run: python scripts/test_render_impl_preview.py
      - name: Plugin folder ships only the runtime (allow-list)
        run: python scripts/test_plugin_folder.py
      - name: Release-notes reader tests
        run: python scripts/test_changelog_notes.py
      - name: Doc-drift invariant unit tests
        run: python scripts/test_check_doc_drift.py
      - name: Mode-doc drift invariants (check_doc_drift)
        run: python scripts/check_doc_drift.py
      - name: Architecture explainer build is in sync
        run: python docs/architecture/build.py --check
      - name: No private-repo / local-path leaks (public-leak guard)
        run: python scripts/check_public_leak.py
      # engine >= 8.0.0: gate also checks map freshness (the `map` command was removed)
      - name: Requirement map gate + freshness (reqmap, strict)
        run: python -X utf8 scripts/reqmap.py gate --strict
        env:
          REQMAP_REPO: alxmax/Consilium

  # Cut a GitHub release when the plugin's version has no release yet. plugin.json
  # is the single source of truth (check_versions.py keeps marketplace.json equal
  # to it), so the release tracks the version a `/plugin update` installs.
  # Runs only on pushes to main, after green-gate passes. Idempotent: a push that
  # does not bump the version finds the release already present and exits 0, so
  # only a version-bumping merge produces a tag. Notes come from the matching
  # CHANGELOG.md section (scripts/changelog_notes.py), the same reader the
  # version-bump step above uses. Mirrors requirement-manager's release job.
  release:
    needs: green-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag + GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release plugin.json version if untagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('consilium/.claude-plugin/plugin.json'))['version'])")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to cut."
            exit 0
          fi
          python -X utf8 scripts/changelog_notes.py "$VERSION" > RELEASE_NOTES.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE_NOTES.md
          echo "cut release $TAG" >> "$GITHUB_STEP_SUMMARY"
