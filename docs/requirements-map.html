 already carries its cases."},{"rule":"over-scoped","severity":"advisory","basis":"count","where":"Description","quote":"","question":"This requirement carries 15 clauses and 9 cases (advisory limits 10 and 7). Which of them is a separate requirement?","suggest":"Split the ones that could change for a different reason."}]},{"id":"CONSILIUM-MARK-OUTCOME-001","layer":"feature","level":"code","status":"draft","area":"CONSILIUM","title":"mark_outcome","intent":"Corrects a logged FEEDBACK.html outcome in place once production reality is known.","contract":["`mark_outcome.py` closes the feedback loop opened by `log_feedback.py`, allowing an outcome recorded at deliberation time to be corrected based on what happened in production.","The script rewrites the matched FEEDBACK.html row in place, updating the outcome cell and annotating the note with `[confirmed]`.","Rows are located via a fingerprint sidecar map (`--run-path`) or by a direct `--date` + `--chosen` pair.","When no match is found, a fallback diagnostic lists the five most recent entries.","`--dry-run` allows inspection of which rows would be updated without modifying any file.","Overwrites `.consilium/FEEDBACK.html` atomically with updated outcome and annotated note for each matched row; the parse, the update and the write run under `feedback_lock`, so a concurrent append is not lost.","stdout carries per-matched-row lines of the form `matched [i]: date | chosen | old_outcome -> new_outcome`.","stdout carries `skip [i]: ...` lines when a row is already at the target outcome, or when PEND_HEADLESS is applied to a non-PEND row.","stdout prints `(dry-run; no write)` when `--dry-run` is active.","Exit code 0 on success or when no rows needed updating; exit code 1 on missing feedback file, bad argument combinations, or no match found.","When matching by `--date` and `--chosen`, all rows that satisfy the predicate are updated, not only the first; each matched row produces a `matched [i]: ...` stdout line.","`[confirmed]` annotation is idempotent: `_annotate_note` checks for its presence before appending, so repeated calls never accumulate duplicate tokens.","`outcome_reason=` is similarly replaced (old stripped, new inserted) rather than accumulated.","`--outcome PEND_HEADLESS` enforces a source-state guard: if the matched row's current outcome is not `PEND`, the row is skipped with a stderr diagnostic and exit 0 (not an error).","Only rows already at `PEND` are converted by `--outcome PEND_HEADLESS`."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a valid `--run-path` pointing to a logged run, when `mark_outcome.py` runs, then the corresponding FEEDBACK.html row's outcome field is updated to the specified value and the note gains `[confirmed]` (or `outcome_reason=...` if `--reason` is provided).\n- **CASE-2** — Given `--dry-run`, when the script runs, then no file is written and stdout reports the matched rows with their pending transition.\n- **CASE-3** — Given `--outcome PEND_HEADLESS` without `--benchmark`, when the script runs, then it exits 1 with a descriptive error and does not modify FEEDBACK.html.\n- **CASE-4** — Given neither `--run-path` nor both `--date` and `--chosen` are supplied, when the script runs, then it exits 1 with a usage error.\n- **CASE-5** — Given a query that matches no rows, when the script runs, then it exits 1 and prints the last 5 rows to stderr as disambiguation candidates.","input":"","output":"","desc":"","depends_on":["CONSILIUM-FEEDBACK-001","CONSILIUM-RENDER-FEEDBACK-HTML-001","CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-LEARNING-001"],"satisfies":["ARCH-CONSILIUM-LEARNING-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/mark_outcome.py:36"},{"role":"tested-by","loc":"scripts/test_feedback_html.py:8"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"10 clause(s) have no case: there are 15 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-MEMORY-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"memory","intent":"Unified read API over Consilium's three memory tiers (short / medium / long).","contract":["`memory.py` provides a unified read API over Consilium's three memory tiers, through a single CLI and importable surface: short (current session, stub only), medium (per-run episodic JSON files in `runs/`), and long (aggregate FEEDBACK.html parsed via `feedback.py`).","`memory.py` exists so an orchestrating agent can ask \"what does Consilium remember about X\" without knowing which tier holds the relevant data.","The `--query` flag applies a substring filter uniformly across medium and long tiers.","The short tier is represented by a descriptive stub, because its content (the deliberation bundle being assembled) is only accessible inside the active agent context window.","Confirmed-outcome rows (those carrying `[confirmed]` in their note, written by `mark_outcome.py`) are flagged in long-tier output so callers can apply higher trust weights to them.","JSON is emitted to stdout: for a single tier, a dict with `tier`, `entries`, and `total` keys; for `--tier all`, a dict with `short`, `medium`, and `long` sub-objects.","Exit code is 0 always (no error paths beyond missing files, which return empty entry lists).","The short tier stub is permanently fixed: `read_short()` is a hardcoded function returning `{\"tier\": \"short\", \"note\": \"...\", \"entries\": []}` with no file-based population path. There is no session-file mechanism and no design provision for one.","Case-insensitivity is guaranteed for both tiers via `_matches(text, q) -> q.lower() in text.lower()`.","The long-tier query filter searches `context`, `chosen`, and `note`.","`--n` applies independently per tier: `read_all` passes `n` to both `read_medium` and `read_long` separately, so `--tier all --n N` can return up to `2N` entries (short always returns 0 entries).","There is no global cap on entries returned."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given `--tier medium`, when `memory.py` runs, then it returns a JSON object whose `entries` array contains at most `--n` items, each with `run`, `date`, `success_criterion`, `chosen`, and `confidence` fields drawn from `runs/*.json` files.\n- **CASE-2** — Given `--tier long --query <term>`, when `memory.py` runs, then it returns only rows whose `context`, `chosen`, or `note` contains the query term (case-insensitive), each entry including a `confirmed` boolean reflecting presence of `[confirmed]` in the note.\n- **CASE-3** — Given `--tier short`, when `memory.py` runs, then it returns a stub dict with `entries: []` and a descriptive `note` explaining session-local scope.\n- **CASE-4** — Given `--tier all`, when `memory.py` runs, then it returns a dict with exactly three keys (`short`, `medium`, `long`), each containing valid tier output.\n- **CASE-5** — Given `--feedback-file` and `--runs-dir` are passed, when `memory.py` runs, then it overrides the default `.consilium/` paths so the script can operate on arbitrary copies of the data.","input":"","output":"","desc":"","depends_on":["CONSILIUM-FEEDBACK-001","CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-LEARNING-001"],"satisfies":["ARCH-CONSILIUM-LEARNING-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/memory.py:35"},{"role":"tested-by","loc":"scripts/test_feedback_html.py:9"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"7 clause(s) have no case: there are 12 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."},{"rule":"no-failure-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"What happens on the failure path -- missing input, invalid value, nothing to do?","suggest":"Add one case for the way this can go wrong; it is the case implementations skip."}]},{"id":"CONSILIUM-MODE-DIALECTIC-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"dialectic mode","intent":"WHY: Add a focused post-hoc challenge on the chosen approach for code changes — Sequential deliberation plus code-context injection, followed unconditionally by a Skeptic sub-agent regardless of confidence band.","contract":["The mode injects code-specific context (`language`, `framework`, `build_command`, `files_touched[]`, `test_files[]`, `ci_gate`) into voice inputs (not into prompt files) before running the standard Sequential deliberation (Generator → Conservator → Control).","After Sequential produces `chosen`, the mode unconditionally dispatches 1 Skeptic sub-agent (`skeptic_on_chosen`) on the result — not gated on confidence band and not skipped when Sequential short-circuits via `scale_down`.","In Dialectic, the Skeptic is always unconditional. The `confidence ∈ [0.0, 0.70)` auto-trigger conditions in `skeptic_on_chosen.md` apply only to `skeptic_on_chosen` as a composable flag over other base modes, not to Dialectic's hardwired Skeptic step. Dialectic defines a fixed pipeline where the Skeptic is mandatory regardless of confidence band.","The total cost is 1.33× Sequential (1× Sequential + 1 Skeptic sub-agent); telemetry records `mode: \"dialectic\"` and, when the Skeptic catches a constraint, `skeptic_caught_constraint: true` in the report.","The Skeptic's verdict is advisory by default and can override `chosen` only when `--skeptic-can-override` is active and Skeptic produces `addressable: requires_redesign`.","When dispatched on a `scale_down` trivial-direct chosen, the Skeptic receives only `chosen + success_criterion + code context` (same input shape as any Skeptic dispatch) — not the full voice bundle; Gen+Ctrl outputs are absent because they were skipped.","The `1.33× Sequential` cost multiplier is an informational estimate, not a contractual bound; it is not enforced by any gate.","When `--skeptic-can-override` is active and Skeptic produces `addressable: requires_redesign`, override means the orchestrator presents the report's existing alternatives to the user and asks whether to change the choice.","`chosen` is not automatically replaced, and no re-deliberation is triggered."],"verify":["None - all questions resolved."],"notes":["The old Dialectic (Pass1+Pass2) has been removed; the merge script and `*_pass2.md` prompts were deleted (see git history)."],"current_impl":["modes/dialectic.md"],"accept":"AC-1\n  Given a deliberation request in dialectic mode with language/framework/files_touched provided\n  When  the mode runs\n  Then  Sequential completes with code-context fields present, followed by exactly 1 Skeptic sub-agent dispatch, and the report records `mode: \"dialectic\"`\n\nAC-2\n  Given a deliberation where Sequential short-circuits via `scale_down`\n  When  the mode runs\n  Then  the Skeptic sub-agent is still dispatched on the trivial-direct chosen\n\nAC-3\n  Given a Skeptic output with `can_object: true`, `concrete_concerns` ≥ 2, and `--skeptic-can-override` is NOT active\n  When  the mode finalizes the report\n  Then  `chosen` is unchanged from the Sequential result, `skeptic_caught_constraint: true` is set, and the objection is visible as advisory","input":"","output":"","desc":"","depends_on":["CONSILIUM-MODE-SEQUENTIAL-001","CONSILIUM-VOICE-SKEPTIC-001"],"used_by":["ARCH-CONSILIUM-MODES-001","CONSILIUM-MODE-LENS-001"],"satisfies":["ARCH-CONSILIUM-MODES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/modes/dialectic.md:57"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"6 clause(s) have no case: there are 9 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."},{"rule":"no-failure-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"What happens on the failure path -- missing input, invalid value, nothing to do?","suggest":"Add one case for the way this can go wrong; it is the case implementations skip."}]},{"id":"CONSILIUM-MODE-LENS-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"opt-in personality-lens ladder (`--lens`)","intent":"WHY: lets a caller graduate the cheaper modes toward Trias's lens structure without paying the cost on every run. Off by default so the default path's cost is unchanged (lens text adds ~18% per-voice prompt tokens); lens value over lens-free deliberation is empirically unproven (Trias 0/6 on a saturated corpus), so default-on is withheld pending a discriminator pilot. Shipped opt-in over two 2026-07-07 internal design-review rounds (verdict MODIFY).","contract":["The `--lens <name>` flag is composable over Sequential and Dialectic, and is **OFF by default**.","A run without `--lens` applies no lens; its cost is unchanged.","On **Sequential**, `--lens essentialist` prepends `prompts/voices/essentialist_lens.md` over Generator → Conservator → Control.","On **Dialectic**, `--lens essentialist` puts the Essentialist lens on the decider (the Sequential voices) and **tints the Skeptic with the Verifier lens** via the Verifier lens's Skeptic carve-out — complementary roles, not a vote. No new prompt file is introduced (the \"B / tint\" mechanism); the two lenses differ (`decider != skeptic`).","A lensed run records `telemetry.lens_applied` as `{decider: <name>, skeptic?: <name>}`; a default (no-lens) run omits the field.","`validate_report.py` rejects a report whose `telemetry.lens_applied` is malformed, names a lens that is not a known personality, or (Dialectic) has `decider == skeptic`.","The mechanism does not change any voice's return schema, the sub-agent dispatch count, or the `cost_multiplier` of either mode."],"verify":["None — default-on is intentionally out of scope until a discriminator pilot (n≥10–20, non-saturated oracle-validated corpus) shows a win."],"notes":[],"current_impl":["modes/sequential.md","modes/dialectic.md","prompts/voices/verifier_lens.md","consilium/scripts/validate_report.py","scripts/test_lens_bias.py"],"accept":"AC-1\n  Given  a Dialectic report whose telemetry.lens_applied has decider == skeptic (e.g. both \"verifier\")\n  When   validate_report._validate_telemetry runs\n  Then   it returns a problem stating decider and skeptic must differ\n\nAC-2\n  Given  prompts/voices/verifier_lens.md\n  When   scripts/test_lens_bias.py runs\n  Then   it asserts the \"skeptic carve-out\" keyword is present (the Verifier lens is coherent when tinted onto the Skeptic voice)\n\nAC-3\n  Given  a telemetry.lens_applied naming a lens that is not a known personality (e.g. \"essentailist\")\n  When   validate_report._validate_telemetry runs\n  Then   it returns a problem naming the valid personality lenses","input":"","output":"","desc":"","depends_on":["CONSILIUM-LENS-ESSENTIALIST-001","CONSILIUM-LENS-VERIFIER-001","CONSILIUM-MODE-SEQUENTIAL-001","CONSILIUM-MODE-DIALECTIC-001","CONSILIUM-VALIDATE-REPORT-001"],"used_by":["ARCH-CONSILIUM-MODES-001"],"satisfies":["ARCH-CONSILIUM-MODES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/modes/dialectic.md:60"},{"role":"implements","loc":"consilium/modes/sequential.md:90"},{"role":"implements","loc":"consilium/prompts/voices/verifier_lens.md:53"},{"role":"implements","loc":"consilium/scripts/validate_report.py:871"},{"role":"tested-by","loc":"scripts/test_lens_bias.py:230"}],"test_exempt":null,"milestone":"v1.8","priority":"","risks":[],"clauses":3,"covered":3,"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"4 clause(s) have no case: there are 7 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."},{"rule":"no-failure-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"What happens on the failure path -- missing input, invalid value, nothing to do?","suggest":"Add one case for the way this can go wrong; it is the case implementations skip."}]},{"id":"CONSILIUM-MODE-SEQUENTIAL-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"sequential mode","intent":"WHY: Run Generator, Conservator, and Control in a single shared context window — the cheapest deliberation path, used by default when no higher mode is warranted.","contract":["The mode dispatches exactly three voices — Generator, then Conservator, then Control — in that fixed order within a single context window, with no external sub-agent dispatch (0 sub-agents, 1× baseline cost). Generator runs first, blind to risk framing (anti-anchoring), and self-scales its depth from the change's blast radius.","The irreversibility consent gate runs **pre-dispatch** (Step 1.6), before Generator, keyed on `scope_gate.consent_required` (a sensitive/irreversible path or an undeterminable change; fail-safe — uncertainty requires consent). Conservator's `irreversibility_flag` is the backstop for what a path/text pre-check cannot see.","Before each voice runs (Steps 2–4), the prior voice's prompt is stripped from context via `strip_context.py`; model in-context memory is not cleared — this is a known deliberate limitation documented in the mode spec.","The aggregator applies an 8-component veto cascade (`aggregate_sequential()`) producing one of seven routing outcomes: BLOCK (irreversibility), BLOCK (glossary_fail), REWORK, SHORT-CIRCUIT (scale_down — skips Control only, Generator already ran), ADAPT_EXTENDED (scale_up), ESCALATE, or AGGREGATE; the resulting report carries a `confidence` value derived from the veto outcome.","When Conservator emits `magnitude: critical` AND `reversibility: irreversible`, the orchestrator surfaces an **advisory** recommendation to upgrade to Trias (never auto-triggered — the user selects it explicitly). The former auto-parallel cross-check and 1-in-20 silent parallel audit were removed with Parallel mode (PR #454, 2026-06-26).","The `confidence_floor: 0.70` in mode metadata is advisory — it represents the threshold below which Sequential mode confidence is flagged as \"WEAK\" in the `check_mode_floor` output. It is NOT a hard gate blocking report emission; a below-floor result still produces a complete report, with the floor surfaced in the confidence field's `outcome_hint`."],"verify":["None - all questions resolved."],"notes":["Role separation in Sequential is prompt-based, not architectural: `strip_context.py` removes the prior prompt but does not clear the model's in-context memory. True voice isolation requires independent sub-agent contexts (Trias personalities).","The veto-budget for `meta_recommendation` (scale_up/scale_down) is 5 activations per month; on exhaustion the gate becomes a soft warning only. This budget is **not implemented** — no script tracks activations or resets at month boundaries. It is aspirational policy documented in SKILL.md only.","The `confidence_floor: 0.70` and the `log_feedback.py` `--outcome OK` confidence gate are the same numeric threshold applied at two distinct points: the floor is checked at Step 5b by `check_mode_floor()` (advisory, flags run as WEAK) while the log_feedback gate is enforced at Step 6 (hard gate on `--outcome OK`, requires `--force-override` to bypass). A below-floor Sequential run does not block report emission but does require `--force-override` to log it as OK.","Historical note: the auto-parallel cross-check and the 1-in-20 silent parallel audit (formerly driven by `scripts/audit_counter.py` + `.consilium/audit_state.json`) were removed with Parallel mode in PR #454; neither script nor state file exists anymore."],"current_impl":["modes/sequential.md"],"accept":"AC-1\n  Given a deliberation request with no explicit mode flag and no critical/irreversible trigger\n  When  the mode runs\n  Then  exactly three voices are invoked in the order Generator → Conservator → Control in a single context window, no sub-agents are dispatched, and the report carries a `confidence` value and a routing outcome from the veto cascade\n\nAC-2\n  Given a deliberation request where Conservator (running second) emits `meta_recommendation: scale_down`\n  When  the mode runs\n  Then  Control is skipped (Generator has already run), the report contains `chosen_approach: \"trivial-direct\"`, `confidence: 0.85`, and `pipeline_executed: false`\n\nAC-3\n  Given a deliberation request where Control emits `glossary_fail: true`\n  When  the aggregator runs\n  Then  the routing outcome is BLOCK (glossary_fail) and the user is asked to reformulate with operational terms before any chosen approach is emitted\n\nAC-4\n  Given a completed Sequential deliberation where `confidence < 0.6`\n  When  the orchestrator checks confidence at Step 5b\n  Then  no automatic re-run fires; the Step 5d retry and the Step 6 override prompt (which suggests `--mode dialectic` / `--skeptic-on-chosen`) are the only low-confidence responses\n\nAC-5\n  Given a deliberation request whose diff touches a sensitive/irreversible path (scope_gate `consent_required: true`)\n  When  the mode runs in an interactive (non-headless) context\n  Then  the orchestrator requests explicit user consent BEFORE dispatching Generator; no voice output exists in context when consent is requested (the consent gate is pre-dispatch, not post-generation)","input":"","output":"","desc":"","depends_on":["CONSILIUM-VOICE-GENERATOR-001","CONSILIUM-VOICE-CONTROL-001","CONSILIUM-VOICE-CONSERVATOR-001","CONSILIUM-AGGREGATOR-001"],"used_by":["ARCH-CONSILIUM-MODES-001","CONSILIUM-MODE-DIALECTIC-001","CONSILIUM-MODE-LENS-001","CONSILIUM-MODE-TRIAS-001","CONSILIUM-SUBAGENT-001"],"satisfies":["ARCH-CONSILIUM-MODES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/modes/sequential.md:87"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"1 clause(s) have no case: there are 6 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-MODE-SKEPTIC-ON-CHOSEN-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"skeptic_on_chosen flag","intent":"WHY: Compose a focused post-hoc Skeptic challenge on the chosen approach over any base mode — catching implicit constraints and high-concern discrepancies that the base deliberation may have missed.","contract":["The flag dispatches exactly 1 Skeptic sub-agent (using `prompts/voices/skeptic.md`) after the base mode produces `chosen` and `confidence`; the flag is composable over any base mode (Sequential, Dialectic, Trias) and adds +1 sub-agent to whichever base was used.","The flag auto-triggers when any of the following are true: `Conservator.net_concern > 0.7` on the chosen (`trigger_reason: \"high_concern\"`); `chosen_approach` matches a BAD outcome from FEEDBACK.html in the last 30 days (`trigger_reason: \"similar_to_recent_bad\"`); or `irreversibility_flag: true` (`trigger_reason: \"irreversibility_gate\"`). It may also be activated manually via `--skeptic-on-chosen`. Confidence alone never triggers it: on `[confirmed]` outcomes confidence does not predict success.","The Skeptic sub-agent receives only `chosen` (id, summary, sketch, rationale), `success_criterion`, and `verification`; it does not receive other candidates, scores, or deliberation logs.","An objection counts only when it passes the validation gate owned by [[CONSILIUM-VALIDATE-SKEPTIC-001]]; a rejected objection is dropped, and the original chosen ships unchanged.","The Skeptic's verdict is advisory by default (`chosen` is not replaced); `chosen` is replaced only when `--skeptic-can-override` is active AND the Skeptic produces `addressable: requires_redesign`.","The result is logged in `deliberation_log` with step `\"skeptic_on_chosen\"` and `skeptic_caught_constraint: true|false` set in the report."],"verify":["None — doc is unambiguous."],"notes":["The legacy fixed modes `parallel_skeptic` and `dialectic_skeptic` were collapsed into this composable flag on 2026-05-17; the legacy names remain accepted via `validate_report.py`'s `_LEGACY_MODE_ALIASES` map for backward-compat with historical runs (there is no MODE enum; `telemetry.mode` is not enum-validated).","Empirical origin (n=1, P3 problem): the equivalent `chosen_confirmation_pass` reached 4/7 catch-rate in real reruns; generalizability to other problems is unconfirmed until ≥3 distinct problems are tested."],"current_impl":["modes/skeptic_on_chosen.md"],"accept":"AC-1\n  Given a deliberation in Sequential mode where the base mode produces `confidence: 0.65`\n  When  the flag auto-triggers\n  Then  exactly 1 Skeptic sub-agent is dispatched with only `chosen`, `success_criterion`, and `verification` in its input; the report records `skeptic_caught_constraint: true|false` and `chosen` remains the Sequential result (advisory)\n\nAC-2\n  Given a deliberation where the Skeptic produces `can_object: true` with no `concrete_concerns` and no `quoted_scenario`\n  When  the flag validates the Skeptic output\n  Then  the objection is rejected as a schema fail, the original chosen is shipped unchanged, and the rejection is recorded in `deliberation_log`\n\nAC-3\n  Given a deliberation with `--skeptic-can-override` active and the Skeptic produces `addressable: requires_redesign`\n  When  the flag applies override semantics\n  Then  the orchestrator presents the report's alternatives to the user and asks whether to change the choice, rather than shipping the original chosen","input":"","output":"","desc":"","depends_on":["CONSILIUM-VOICE-SKEPTIC-001"],"used_by":["ARCH-CONSILIUM-MODES-001","CONSILIUM-MODE-TRIAS-001"],"satisfies":["ARCH-CONSILIUM-MODES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/modes/skeptic_on_chosen.md:70"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"3 clause(s) have no case: there are 6 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-MODE-TRIAS-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"trias mode","intent":"WHY: Apply three divergent personality lenses (Essentialist/Verifier/Sentinel) each running a full dialectic deliberation, then resolve by democratic majority vote — providing genuine multi-perspective scrutiny for high-stakes, irreversible, or architecturally complex decisions.","contract":["The mode classifies magnitude via `scope_gate.py` on the original unstripped context, before any context stripping.","When lazy routing is enabled (default), the mode downgrades to Sequential (low/medium magnitude) or Dialectic (high magnitude), and emits a structured `trias_lazy_routed` notification.","Full Trias (4 sub-agents nominal — 3 personalities + 1 post-vote Skeptic, ≈2.67× Sequential) runs only on `critical` magnitude, or when the user explicitly requests it.","When full Trias runs, the mode dispatches 3 personality sub-agents (Essentialist, Verifier, Sentinel) **in parallel**, each running a complete Sequential deliberation (Generator → Conservator → Control) internally with the personality lens prepended; each sub-agent receives context truncated to ≈15 000 tokens before dispatch. There is **no pre-vote Skeptic** — the 2026-06-19 skeptic-lever redesign removed the 3 per-personality pre-vote Skeptics; the 3 returned `chosen_approach` values proceed directly to the vote.","After a decisive vote yields a winning `chosen_approach`, the mode dispatches exactly **one** Skeptic sub-agent (`skeptic_on_chosen`, per `prompts/voices/skeptic.md`) to challenge that winner **post-vote**. The Skeptic sub-agent receives the runner-up personality's rationale as a counter-hypothesis to attack — the coverage compensation for no longer challenging the losing candidates directly.","The post-vote Skeptic is **advisory by default**: the vote stands, and any objection is recorded as a caveat.","Under `--skeptic-can-override`, a *demolishing* objection — `can_object: true` and either `addressable == \"requires_redesign\"` or a falsifier that defeats the `success_criterion` — triggers a re-vote over the remaining `chosen_approach` values, excluding the demolished winner.","The re-vote's new winner is itself challenged by one further `skeptic_on_chosen`; the result is PEND if that winner is also demolished (no loop).","Telemetry records `skeptic_challenges_count` and `post_vote_skeptic_used`.","This post-vote Skeptic does **not** fire on a winner already resolved by the B2 deadlock cascade, because the cascade's tiebreaker Skeptic already challenged it.","Default policy is unconditional (Variant A); the confidence-gated Variant C (`--trias-skeptic-gate`, firing only when `confidence ∈ [0.0, 0.70)`) is off by default.","The mode aggregates the 3 `chosen_approach` values via `aggregator.py --scheme team_vote`. When all 3 are unanimous (`vote_pattern: 3-0`), the team_vote step is skipped and `vote_skipped: true` is set. Confidence is derived from the vote pattern (3-0 → 0.95, 2-1 → 0.75, 2-0 → 0.70).","When the vote pattern is 1-1-1 or 0-0-0, the B2 deadlock cascade fires: Round 2 re-dispatches all 3 personalities with peer context. If still deadlocked, a Skeptic tiebreaker sub-agent is dispatched; if unresolved, the result is PEND. Maximum cost is 7 sub-agents (3 + 3 + 1).","`0-0-0` means all 3 personalities returned `chose: null`, because each personality's internal Sequential ran `conservative_override` and vetoed every candidate.","`0-0-0` is distinct from 1-1-1 (three different non-null choices), and is achievable without abstention: it occurs when every candidate exceeds the conservator veto threshold inside each sub-agent.","When lazy routing downgrades to Dialectic or Sequential, the `trias_lazy_routed: true` notification is emitted by the Trias orchestrator before the downgraded mode runs; the notification is not carried into the final persisted report produced by the downgraded mode's own pipeline. The persisted report reflects the actual mode that ran (`dialectic` or `sequential`), not `trias`.","Context truncation for Trias sub-agents is a hard first-N-characters limit: `strip_context.py --truncate-text 15000` takes the first `15000 × 4 = 60 000` characters of the raw context and appends a `[... context truncated ...]` marker when the budget is exceeded. The 15 000 token figure is a hard ceiling (not a target), using the approximation 1 token ≈ 4 chars.","The 3 personality sub-agents are dispatched in parallel; the runtime audit tracks divergence between parallel and serial results."],"verify":["None - all questions resolved."],"notes":["Serial dispatch is an accepted implementation artifact that does not affect correctness; the silent parallel audit is the observability mechanism.","`trias_split` is removed; `validate_report.py` no longer aliases it to `trias`, and historical `trias_split` runs validate as an open-string mode without the per-voice telemetry check.","Aggregated Trias is approximately −18% Conservator weight relative to single-context; avoid when strict conservatism is required."],"current_impl":["modes/trias.md"],"accept":"AC-1\n  Given a deliberation request in trias mode with `magnitude: critical` (blocklist hit)\n  When  the mode runs\n  Then  3 personality sub-agents are dispatched in parallel (Essentialist, Verifier, Sentinel), each producing a `chosen_approach`; the 3 chosens are aggregated via `team_vote` with no pre-vote Skeptic; then exactly one post-vote Skeptic (`skeptic_on_chosen`) challenges the winning candidate; and the report contains `vote_pattern`, `confidence`, `personalities[]` with each personality's `chose`, plus `skeptic_challenges_count` and `post_vote_skeptic_used`\n\nAC-2\n  Given a deliberation request in trias mode with `magnitude: high` and lazy routing enabled\n  When  the mode runs\n  Then  the mode downgrades to Dialectic, emits a `trias_lazy_routed: true` notification with `routed_to: \"dialectic\"`, and no Trias sub-agents are dispatched\n\nAC-3\n  Given a full Trias run where all 3 personalities return different `chosen_approach` values (1-1-1 vote)\n  When  the B2 cascade fires\n  Then  Round 2 re-dispatches 3 sub-agents with peer context; if still 1-1-1, a Skeptic tiebreaker is dispatched; if unresolved, the report is marked PEND with `cascade_incomplete: true`","input":"","output":"","desc":"","depends_on":["CONSILIUM-MODE-SEQUENTIAL-001","CONSILIUM-MODE-SKEPTIC-ON-CHOSEN-001","CONSILIUM-LENS-ESSENTIALIST-001","CONSILIUM-LENS-VERIFIER-001","CONSILIUM-LENS-SENTINEL-001","CONSILIUM-PERSONALITIES-001"],"used_by":["ARCH-CONSILIUM-MODES-001","CONSILIUM-TRIAS-MODEL-SCHEMA-001"],"satisfies":["ARCH-CONSILIUM-MODES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/modes/trias.md:196"},{"role":"tested-by","loc":"scripts/test_trias_skeptic_lever.py:11"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"15 clause(s) have no case: there are 18 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-PERSONALITIES-001","layer":"bus","level":"code","status":"confirmed","area":"CONSILIUM","title":"personalities","intent":"Canonical registry of the three fixed Trias personalities (Essentialist/Verifier/Sentinel) and their voice weights.","contract":["`personalities.py` is the canonical registry of the three fixed Trias-mode personalities (Essentialist, Verifier, Sentinel), each defined by a named set of voice-weighting coefficients and a path to a lens prompt file.","`personalities.py` replaces the old random-sampling Ensemble approach (legacy `personalities.py <N>`) with deterministic, named characters, so Trias deliberations are reproducible and auditable.","Each personality biases the weighted aggregation of Generator, Control, and Conservator scores differently:","Essentialist: `generator 0.49 / control 0.30 / conservator 0.21` — first-principles minimalism, generator-heavy.","Verifier: `generator 0.30 / control 0.40 / conservator 0.30` — operational/testable clarity, balances around Control.","Sentinel: `generator 0.30 / control 0.30 / conservator 0.40` — stress / silent-failure / counterparty, conservator-heavy.","Each personality dict carries a `name`, the `weights` dict, and a `lens` path; all three weight vectors sum to 1.0 and differ meaningfully across personalities.","The script is also imported as a library by the Trias orchestration layer via `get_by_name()`.","`get_by_name()` uses `copy.deepcopy()` to return a deep copy of the personality dict, preventing mutation of the module-level `PERSONALITIES` list at runtime — this guards against nested-dict mutation, not just reference aliasing, so runtime mutations never affect subsequent calls.","With no `--name` flag, a JSON array of all three personality dicts is emitted to stdout; with `--name`, a JSON object for the single matching personality is emitted.","Exit code is 0 on success, and 2 when a legacy positional N argument is detected, with a human-readable migration message on stderr naming the three valid personality names."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given no CLI arguments, when `personalities.py` runs, then it emits a JSON array of exactly 3 objects, each containing `name`, `weights` (keys `generator`, `control`, `conservator` summing to 1.0), and `lens` (a path string).\n- **CASE-2** — Given `--name essentialist`, when `personalities.py` runs, then it emits a single JSON object matching the Essentialist entry, and the returned dict is a deep copy whose mutations do not affect subsequent calls.\n- **CASE-3** — Given a positional integer argument, when `personalities.py` runs, then it exits with code 2 and prints a migration message referencing the three valid personality names.\n- **CASE-4** — Given `get_by_name('unknown')`, when it is called, then it raises `KeyError` with a message listing valid names.\n- **CASE-5** — Given the three personalities' weights, when checked, then `generator + control + conservator == 1.0` for each (within floating-point tolerance).","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-VOICES-001","CONSILIUM-LENS-ESSENTIALIST-001","CONSILIUM-LENS-SENTINEL-001","CONSILIUM-LENS-VERIFIER-001","CONSILIUM-MODE-TRIAS-001","CONSILIUM-TRIAS-MODEL-SCHEMA-001","CONSILIUM-VALIDATE-REPORT-001"],"satisfies":["ARCH-CONSILIUM-VOICES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/personalities.py:20"},{"role":"tested-by","loc":"scripts/test_lens_bias.py:31"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"6 clause(s) have no case: there are 11 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-PLUGIN-FOLDER-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"plugin_folder","intent":"The plugin ships from `consilium/`, and that folder holds only what the skill runs.","contract":["An install (the Claude plugin directory, the marketplace or `apm install alxmax/Consilium/consilium`) receives only `consilium/`, the folder holding `.claude-plugin/plugin.json`.","`consilium/` holds only `.claude-plugin/plugin.json`, `.claude-plugin/icon.png`, `SKILL.md`, `README.md`, `LICENSE` and the `agents/`, `prompts/`, `modes/`, `scripts/` and `docs/` directories.","`consilium/scripts/` holds only Python files, and none is a test (`test_*.py`).","No file in `consilium/` is larger than 256 KiB.","No text file in `consilium/` runs `git push` or `git commit`, loads a remote `<script src>`, or carries an invisible format character (Unicode category Cf); such a character is written as an escape, e.g. `\"\\ufeff\"`.","No agent in `consilium/agents/` changes directory into `$CONSILIUM_PATH`: sub-agents call scripts by full path from the project directory, where the scripts keep their state.","Tests, gates and repo tooling stay in `scripts/`; they reach the plugin through `scripts/plugin_paths.py`.","`scripts/plugin_paths.py` exposes `REPO_ROOT`, `PLUGIN_DIR`, `PLUGIN_SCRIPTS`; importing it puts `PLUGIN_SCRIPTS` on `sys.path`.","`scripts/test_plugin_folder.py` enforces these rules over the files git tracks in `consilium/`; it runs in CI and in the run-consilium driver."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given the tracked files under `consilium/`, when the allow-list is checked, then every path is one of the allowed files or lies in an allowed directory.\n- **CASE-2** — Given `consilium/scripts/`, when its files are listed, then each is a `.py` file and none is named `test_*.py`.\n- **CASE-3** — Given every tracked file under `consilium/`, when its size is read, then none exceeds 256 KiB.\n- **CASE-4** — Given every text file under `consilium/`, when it is scanned, then none contains `git push`, `git commit` or a remote `<script src>`.\n- **CASE-5** — Given every text file under `consilium/`, when it is scanned, then none contains a Unicode format (Cf) character.\n- **CASE-6** — Given the agent files under `consilium/agents/`, when they are scanned, then none contains `cd \"$CONSILIUM_PATH\"`.\n- **CASE-7** — Given the tracked files under `consilium/`, when they are listed, then `.claude-plugin/plugin.json`, `.claude-plugin/icon.png`, `SKILL.md`, `README.md` and `LICENSE` are present.","input":"","output":"","desc":"","depends_on":[],"used_by":[],"satisfies":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"scripts/plugin_paths.py:15"},{"role":"tested-by","loc":"scripts/test_plugin_folder.py:12"}],"test_exempt":null,"milestone":"v1.14.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"2 clause(s) have no case: there are 9 clauses and 7 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-PRIORS-001","layer":"feature","level":"code","status":"draft","area":"CONSILIUM","title":"priors","intent":"Describes observed behavior, verified against consilium/scripts/priors.py source.","contract":["`priors.py` computes advisory soft-prior signals from past deliberation history and emits them as a JSON object to stdout.","The signal block is pasted into the deliberation at step 0 so voices can calibrate toward patterns that have caused past problems.","Signals are advisory only; prompts in `prompts/*.md` remain authoritative.","`priors.py` reads `.consilium/FEEDBACK.html` (the usage journal, parsed via `feedback.py`) and `.consilium/runs/*.json` (past deliberation reports).","CLI flags control the read: `--n N` sets the recent-slice size (default 10); `--no-runs` skips the runs/ directory; `--feedback-file` overrides the FEEDBACK.html path; `--runs-dir` overrides the runs/ directory path.","`recent` holds the last N FEEDBACK entries, newest first.","`counts` tallies outcomes (OK / BAD / OVR / PEND) over the recent slice.","`bad_rate` is a risk indicator derived from the `[confirmed]` rows of the recent slice (also surfaced to Conservator via `--memory-summary`); `unconfirmed_count` counts the OK/BAD/OVR rows left out.","Rates count only rows whose note carries `[confirmed]`, so `rated_count == confirmed_count`. Outcomes assigned at log time without evidence do not move the rates.","With `--label`, `prior_deliberation_match` is the newest in-window `OK` row whose context contains the label AND whose note carries `[confirmed]`; an unconfirmed `OK` never matches, because the match lets the caller skip re-deliberation. A confirmed `BAD` or `OVR` newer than the `OK` retires it: there is no match and the newer row is reported as `prior_contradiction`. When runs are consulted (no `--no-runs`), the `OK` row also needs a run on disk with the same date and `chosen_approach`; an unresolved row is skipped.","Headless mode is set only by explicit signals (`--headless`, `CONSILIUM_HEADLESS=1`, `CLAUDE_HEADLESS=1`); a non-tty stdin does not imply headless.","`stale_pendings` lists FEEDBACK rows still PEND and older than `STALE_PEND_DAYS`. `STALE_PEND_DAYS = 2` is hardcoded, reduced from 7, and not CLI-configurable; entries older than 2 days surface at step 0 for retrospective close.","`missing_feedback_runs` lists `runs/` files with no matching FEEDBACK row. A sidecar (`.run_path_map.json`) entry counts as a match only when a FEEDBACK row that hashes to its fingerprint exists, so an entry left by an interrupted log does not hide the run.","Exit code is non-zero on a parse error."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a valid `FEEDBACK.html` and `runs/` directory, when `python consilium/scripts/priors.py` runs, then it completes without error.\n- **CASE-2** — Given the `--no-runs` flag, when `priors.py` runs, then `missing_feedback_runs` is suppressed from the output.\n- **CASE-3** — Given FEEDBACK entries with outcome PEND older than `STALE_PEND_DAYS`, when `priors.py` runs, then those entries appear in `stale_pendings`.\n- **CASE-4** — Given `runs/` files with no matching FEEDBACK row, when `priors.py` runs, then those files appear in `missing_feedback_runs`.","input":"","output":"","desc":"","depends_on":["CONSILIUM-FEEDBACK-001","CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-LEARNING-001"],"satisfies":["ARCH-CONSILIUM-LEARNING-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/priors.py:28"},{"role":"tested-by","loc":"scripts/test_priors.py:10"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"10 clause(s) have no case: there are 14 clauses and 4 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-RENDER-FEEDBACK-HTML-001","layer":"bus","level":"code","status":"confirmed","area":"CONSILIUM","title":"render_feedback_html","intent":"Pure rendering engine: a list of Entry records -> one self-contained dark-themed FEEDBACK.html.","contract":["`render_feedback_html.py` converts a list of Entry records into one self-contained, dark-themed HTML file with inline CSS and JavaScript, and no external assets.","`render_feedback_html.py` exists as a separate bus-layer module so that both `log_feedback.py` and `mark_outcome.py` can rewrite FEEDBACK.html without duplicating HTML generation logic.","The primary input is a list of `Entry` dataclass instances passed programmatically; a path to the `runs/` directory is passed to `render()` so linked run JSON files can be loaded for drill-down panels.","Invoked as a CLI script, it reads a JSON object with an `entries` array from stdin, and accepts `--runs-dir` as an optional override for the `runs/` directory path.","For each entry, telemetry (`tokens_in`, `tokens_out`) and `deliberation_log` (Generator candidates, Control verdicts, Conservator risk scores) are loaded from the linked `.consilium/runs/*.json` file when one exists.","`render()` generates one `<tr class=\"entry\">` row and one `<tr class=\"drill\">` row for each Entry.","Each entry row shows date, context, chosen approach, outcome badge, token count, note, and vote pattern.","Each entry's drill-down panel loads Generator candidates, Control verdicts, and Conservator risk scores from the linked run file.","Token counts show the measured `tokens_in + tokens_out` total when telemetry is present.","Token counts fall back to a `(calc)` estimate when telemetry is absent. The estimate is the lower-median of per-candidate samples across peer entries in the same render invocation.","Legacy entries with no run data show an em-dash in the token count cell.","The VETOED badge in the Conservator panel is sourced from the aggregate step's `vetoed` list, not re-derived from a risk threshold, to avoid lying about candidates in the `[0.7, 0.8]` band.","`render()` returns the complete `<!doctype html>` string as its primary output; callers write it to disk.","Invoked as CLI, the HTML string is written to stdout.","Exit code is 0 always.","The output contains no `<link>`, `<script src>`, or `<img src>` references to external URLs."],"verify":["None - `(calc)` peer runs are all entries in the current `render()` call that have measured telemetry (non-zero `tokens_in + tokens_out`); no filtering by mode or date. The median is the lower-median of the sorted per-candidate samples (`samples[len // 2]`). Reproducibility is therefore scoped to a single render invocation.","None - when the run was produced by the `sequential` scheme (no `vetoed` list in the aggregate step), `vetoed_ids` resolves to an empty set; the Conservator drill-down panel is shown normally but no VETOED badges appear. Under-showing is preferred over fabricating badges.","None - the self-contained property is stated as an Acceptance criterion but is not covered by any assertion in `scripts/test_feedback_html.py`; it remains a stated-only contract."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a list of Entry records, when `render()` runs, then it returns a string beginning with `<!doctype html>` containing one `<tr class=\"entry\">` row and one `<tr class=\"drill\">` row per Entry.\n- **CASE-2** — Given an Entry whose `run_path` points to an existing `runs/*.json` file with telemetry data, when the page renders, then the tokens cell shows the measured sum of `tokens_in + tokens_out` across all voices, formatted compactly (e.g. `14k`).\n- **CASE-3** — Given an Entry whose `run_path` points to a run file with a `vetoed` list in the aggregate step, when the Conservator drill-down panel renders, then it shows a VETOED badge only for candidates whose id appears in that list, never for a candidate exceeding a hard-coded risk threshold.\n- **CASE-4** — Given an Entry with no linked run file (`run_path` is `None`), when the drill-down cell renders, then it contains the legacy stub message and no Generator/Control/Conservator panels.\n- **CASE-5** — Given the rendered HTML output, when it is inspected, then it contains no `<link>`, `<script src>`, or `<img src>` tags referencing external URLs.","input":"","output":"","desc":"","depends_on":["CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-LEARNING-001","CONSILIUM-LOG-FEEDBACK-001","CONSILIUM-MARK-OUTCOME-001"],"satisfies":["ARCH-CONSILIUM-LEARNING-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/render_feedback_html.py:12"},{"role":"tested-by","loc":"scripts/test_feedback_html.py:6"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"11 clause(s) have no case: there are 16 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-RENDER-IMPL-PREVIEW-001","layer":"bus","level":"code","status":"confirmed","area":"CONSILIUM","title":"render_impl_preview","intent":"Opt-in Step 7 companion: deliberation report (+ optional unified diff) -> one self-contained static HTML review page for pre-commit handoff.","contract":["`render_impl_preview.py` renders a completed deliberation report together with an optional multi-file unified diff into a single self-contained HTML page.","Rendered report fields: success criterion, chosen approach with voice scores, alternatives with why_not, verification command, confidence, and mode.","`render_impl_preview.py` exists for handoff review outside the live CLI session: unlike session-bound Artifact URLs or ephemeral Plan Mode, the page is a plain file on disk that survives the session and can be attached to the run report it renders.","The script is never part of the Step 7 dispatch control flow; invocation is always explicit. Deliberation `runs/2026-07-03_1443_html-preview-impl-step.json` decided this, rejecting a prose-enforced pipeline checkpoint as the self-enforced-guard anti-pattern.","The script never dispatches, blocks, or gates any Step 7 stage; it only reads its inputs and writes one HTML file.","`--input` (required) is a path to a `runs/<file>.json` deliberation report, read with `utf-8-sig` so BOM-stamped files parse.","`--diff-file` (optional) is unified diff text to render; `-` reads stdin, e.g. piped from `git diff`. When omitted, the page is spec-only.","`--output` (optional) sets the output HTML path; the default is `.consilium/preview/<input-stem>.html`.","`--title` (optional) overrides the page title.","`render_preview_html(report, diff_text, title)` and `split_diff_sections(diff_text)` are pure functions exposed as a programmatic surface with no I/O.","Diff text is split into per-file sections on `diff --git` headers; headerless input falls back to a single `(diff)` section.","Every line of report and diff content passes through `html.escape` before it reaches the page; hostile input (`<\/script>`, inline event handlers) never appears unescaped in the output.","The page follows the viewer's light/dark preference (`prefers-color-scheme`) and includes an inline theme-toggle button (`id=\"theme-toggle\"`) that overrides it, persisting the choice in `localStorage`.","The output is a self-contained page: no `<link>`, `<script src>`, or `<img src>` references to external URLs.","The HTML file is written atomically via `utils.atomic_write_text` to `--output` or the default preview path.","Each `diff --git` section of the supplied diff renders as its own titled block; with no diff supplied, a spec-only placeholder renders instead and the script still exits 0.","On success, stdout prints `preview: <path>`.","Exit code is 0 on success; 1 on unreadable input or a missing required report field (one of: `success_criterion`, `chosen_approach`, `verification`); 2 on malformed JSON."],"verify":["None - the default output directory `.consilium/preview/` inherits the gitignore on `.consilium/`, so preview pages cannot enter the tree; no separate ignore rule is asserted by tests.","None - `--diff-file -` consumes stdin exactly once; combining it with a stdin-based report is unsupported by construction (the report always comes from `--input`)."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a report plus a two-file unified diff, when the page renders, then it contains the success criterion, the chosen id, and one section per `diff --git` header (`scripts/test_render_impl_preview.py`).\n- **CASE-2** — Given a diff containing `<\/script><script>alert(1)<\/script>` and `<img onerror=...>`, when the page renders, then the raw sequences are absent and the escaped forms are present.\n- **CASE-3** — Given no `--diff-file`, when the page renders, then it contains the placeholder and no diff blocks, and the CLI exits 0.\n- **CASE-4** — Given a report missing `chosen_approach`, malformed JSON input, or an absent report path, when the CLI runs, then it exits 1 naming the field on stderr, exits 2, or exits 1, respectively.\n- **CASE-5** — Given the rendered page, when it is inspected, then it contains the `theme-toggle` button element.","input":"","output":"","desc":"","depends_on":["CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-IMPLEMENT-001"],"satisfies":["ARCH-CONSILIUM-IMPLEMENT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/render_impl_preview.py:31"},{"role":"tested-by","loc":"scripts/test_render_impl_preview.py:12"}],"test_exempt":null,"milestone":"v1.2","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"13 clause(s) have no case: there are 18 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-RUN-EVALS-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"run_evals","intent":"Subprocess-based regression harness over evals/scenarios.json; CI gate.","contract":["`run_evals.py` is the regression harness for all deterministic scripts in the Consilium pipeline.","`run_evals.py` reads a `scenarios.json` corpus: `evals/scenarios.json` by default, or the path given by `--scenarios`.","`--filter <substring>` optionally restricts execution to scenarios whose name matches the substring.","For each scenario, `run_evals.py` spawns the scenario's named tool as a subprocess. The scenario's `stdin_json` field is serialised and piped to the subprocess; the scenario's `env` field is merged into the subprocess environment.","`run_evals.py` verifies each subprocess's exit code against the scenario's declared expectation.","`run_evals.py` verifies stdout against the scenario's declared expectation, as either a JSON subset-match or a plain-text substring match.","`run_evals.py` verifies stderr against the scenario's declared substring expectations.","A pre-flight linter (`lint_validate_report_fixtures`) runs before any scenario. The linter checks every `validate_report` fixture for the required `pipeline_executed` field, and ensures bypass-chosen fixtures set it to `false`.","A corpus violation found by the pre-flight linter exits 2 before any scenario runs.","PASS/FAIL lines print to stderr for each scenario.","A summary line `<N> passed, <M> failed` prints to stderr.","Exit code is 0 when all scenarios pass, 1 when any fail, and 2 on load or corpus errors."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given the committed `evals/scenarios.json`, when `python scripts/run_evals.py` runs, then it exits 0 with every scenario reporting PASS.\n- **CASE-2** — Given a scenario with `expect_exit=0` but no `pipeline_executed` in `stdin_json`, when the pre-flight linter runs, then it exits 2 with a descriptive corpus error before any scenario runs.\n- **CASE-3** — Given a scenario with a bypass-chosen `chosen_approach` and `pipeline_executed=true`, when the pre-flight linter runs, then it exits 2.\n- **CASE-4** — Given the `--filter` flag, when it is applied, then execution is restricted to matching scenario names; an empty match set exits 2 with `no scenarios matched`.\n- **CASE-5** — Given a scenario that fails its `expect_stdout_subset` check, when it runs, then a human-readable mismatch message prints to stderr and the harness exits 1.","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfies":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"scripts/run_evals.py:23"}],"test_exempt":"subprocess-based eval harness — acceptance gated by run_evals.py itself in CI","milestone":"v1.1","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"7 clause(s) have no case: there are 12 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-SCOPE-GATE-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"scope_gate","intent":"Decides whether a change is small enough to bypass full deliberation (fails open), and whether it needs explicit consent before any voice runs (fails safe).","contract":["`scope_gate.py` decides whether a change is small enough to bypass full deliberation.","`scope_gate.py` collects diff signals from git via `probe_change.py`. The default is `HEAD`; `--ref <ref>..HEAD` and `--range <A>..<B>` are alternative diff selectors.","Alternatively, when `--signals-stdin` is set, `scope_gate.py` reads pre-computed signals as stdin JSON (`{files_changed, lines_added, lines_removed, paths}`) instead of running git.","`--files` optionally restricts the git diff to a path.","`--config` optionally points to a `scope_gate.json` overriding `max_files`, `max_lines`, and `blocklist`.","`CONSILIUM_FORCE_FULL=1` forces `should_skip=false` and `magnitude='critical'` without reading the diff.","`scope_gate.py` checks file and line counts against the configured thresholds, and scans changed paths against a sensitive-path blocklist.","`scope_gate.py` classifies the change's magnitude as one of `low`, `medium`, `high`, `critical`.","`scope_gate.py` derives a `mode_ceiling` — the maximum deliberation mode the magnitude allows.","`scope_gate.py` outputs a JSON decision the orchestrator uses to short-circuit or proceed.","The gate fails open on the cost check: probe failures, missing git repos, and config load errors all produce `should_skip=false`, so an uncertain situation always triggers deliberation rather than silently skipping it.","Any path matching a blocklist entry forces `should_skip=false`, `magnitude='critical'`, and `mode_ceiling='trias'`, regardless of file or line counts.","The same probe derives `consent_required` — a pre-dispatch irreversibility consent gate.","Because the Generator voice now runs first, `consent_required` lets the orchestrator request explicit user consent before any voice runs, so generation effort is never spent on a change the user might abort.","`consent_required` is `true` for sensitive/irreversible (blocklist) paths, and `false` for an ordinary non-sensitive change.","Unlike `should_skip`, `consent_required` fails safe: an undeterminable change returns `consent_required=true` rather than silently bypassing consent.","Output is a JSON object to stdout with keys `should_skip`, `consent_required`, `magnitude`, `mode_ceiling`, `reason`, `signals`, `config_used`.","Exit code is always 0; errors are reported inside the JSON, not via a non-zero exit."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a single-file, single-line change with no blocklist hits and default config, when the gate runs, then it returns `should_skip=true` and `magnitude='low'`.\n- **CASE-2** — Given a path matching a blocklist pattern, when the gate runs, then it returns `should_skip=false`, `magnitude='critical'`, and `mode_ceiling='trias'` regardless of file/line counts.\n- **CASE-3** — Given `CONSILIUM_FORCE_FULL=1`, when the gate runs, then it returns `should_skip=false` and `magnitude='critical'` without reading the diff.\n- **CASE-4** — Given `--signals-stdin` with a pre-computed payload, when the gate runs, then it bypasses git and classifies magnitude purely from the payload values.\n- **CASE-5** — Given a probe failure (e.g. not a git repo), when the gate runs, then it returns `should_skip=false` with the error text in the `reason` field and exits 0.\n- **CASE-6** — Given a blocklist (sensitive/irreversible) path, an ordinary non-sensitive change, and a probe failure, when the gate evaluates `consent_required`, then it returns `true`, `false`, and `true` respectively — the probe failure fails safe, the opposite direction from `should_skip` (`scripts/test_consent_gate.py`).","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-REPORT-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/probe_change.py:214"},{"role":"implements","loc":"consilium/scripts/scope_gate.py:75"},{"role":"tested-by","loc":"scripts/test_consent_gate.py:18"},{"role":"tested-by","loc":"scripts/test_probe_change.py:76"},{"role":"tested-by","loc":"scripts/test_scope_gate.py:11"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"vague-term","severity":"advisory","basis":"wording","where":"clause 1","quote":"`scope_gate.py` decides whether a change is small enough to bypass full deliberation.","question":"What is the measurable threshold behind \"small\"?","suggest":"Replace it with a number and a unit, or with the observable condition it stands for."},{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"12 clause(s) have no case: there are 18 clauses and 6 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-STRIP-CONTEXT-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"strip_context","intent":"Projects each voice's output down to the minimum fields the next voice needs (anti-contamination).","contract":["`strip_context.py` reduces cross-voice context contamination in the sequential deliberation pipeline by projecting each voice's output down to the minimum fields the next voice needs.","Input is stdin by default, or `--input <file>`; it expects JSON for `--for control` / `--for conservator` modes, and plain text for `--truncate-text` mode.","`--for control` expects Generator output JSON with a `candidates` array. It strips candidates to `id`, `summary`, and `sketch` only, removing rationale fields that would rhetorically bias Control's technical validation.","`--for conservator` expects combined JSON with `candidates` (Generator) and `verdicts` (Control) arrays. It intersects valid Control verdicts with Generator candidates, dropping candidates with no valid Control verdict.","`--for conservator` output contains only `id`, `summary`, and `sketch`; Control's `issues` and `notes` fields are excluded so they cannot bias Conservator's risk scoring.","`--truncate-text <MAX_TOKENS>` caps raw text to a token budget (an integer), approximated as 4 chars/token.","`--truncate-text` is used by Trias orchestration to cap raw conversation context sent to each personality sub-agent.","`--truncate-text` truncates text to `MAX_TOKENS x 4` characters and appends the truncation marker `_TRUNCATION_MARKER` when the text is cut; text under budget is returned unchanged.","Output for `--for control` / `--for conservator` is a JSON object to stdout: the stripped candidate or verdict list.","Output for `--truncate-text` is plain text to stdout: the possibly truncated text with the optional marker appended.","Exit code is 0 on success; non-zero on argument or JSON parse errors."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a Generator output JSON, when `--for control` runs, then the `rationale` field is stripped from all candidates and only `id`, `summary`, and `sketch` remain.\n- **CASE-2** — Given a candidate whose matching Control verdict has `valid=false` or has no matching Control verdict, when `--for conservator` runs, then that candidate is dropped (excluded, not an error).\n- **CASE-3** — Given a Control verdict with `issues` and `notes` fields, when `--for conservator` runs, then those fields are excluded from the output.\n- **CASE-4** — Given text shorter than 60000 characters, when `--truncate-text 15000` runs, then the text is returned unchanged with no marker.\n- **CASE-5** — Given text exceeding 60000 characters, when `--truncate-text 15000` runs, then the text is truncated at 60000 characters and the marker `\"\\n\\n[... context truncated to ~{tokens} tokens for Trias sub-agent ...]\"` (`_TRUNCATION_MARKER`, defined in `strip_context.py`, not shared with other scripts) is appended.","input":"","output":"","desc":"","depends_on":["CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-REPORT-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/strip_context.py:47"},{"role":"tested-by","loc":"scripts/test_strip_context.py:10"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"6 clause(s) have no case: there are 11 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-SUBAGENT-001","layer":"bus","level":"code","status":"confirmed","area":"CONSILIUM","title":"consilium-subagent","intent":"WHY: Isolated-context deliberation wrapper that lets any orchestrator (Trias, Dialectic, Step 7) spawn a fresh Consilium run without polluting its own context with intermediate voice output. Sequential-only — no recursive Agent calls.","contract":["The system provides a `consilium-subagent` agent that runs the full Sequential deliberation workflow (Steps 0–6 from SKILL.md) in an isolated context and returns a canonical `.consilium/runs/<ts>_<slug>.json` report as its final assistant message (no prose, no fences — raw JSON only).","The subagent operates in Sequential mode only; if the dispatch input includes a `mode: parallel|dialectic` hint, the subagent logs it as ignored in `subagent_notes` and proceeds with Sequential.","The subagent never prompts the user (non-interactive): stale PENDs are passed through as `subagent_notes.stale_pendings`; clarity branches are emitted as Generator candidates with `interp_a_*`/`interp_b_*` id prefixes; blocking gates produce `chosen_approach: null` with `subagent_notes.blocked_reason`.","Final message contract: after `validate_report.py` exits 0 on the persisted report, the subagent emits exactly that file's contents as its final assistant message.","Tool allowlist: `Read, Write, Bash, Grep, Glob`. No `Edit`, no `Agent` (nested dispatch is prohibited by rule)."],"verify":["None — all questions resolved."],"notes":[],"current_impl":["agents/consilium-subagent.md"],"accept":"AC-1\n  Given a dispatch prompt with a diff and a success_criterion\n  When  the subagent runs\n  Then  the final message parses as valid JSON, `python consilium/scripts/validate_report.py < <output>` exits 0, and exactly one new file appears under `.consilium/runs/`\n\nAC-2\n  Given a dispatch with `mode: dialectic` hint in the prompt\n  When  the subagent processes the input\n  Then  it logs the mode hint as ignored in `subagent_notes` and completes as Sequential\n\nAC-3\n  Given a low-confidence deliberation (3+ close candidates)\n  When  the subagent completes\n  Then  it does not stall — completes within a bounded turn count with outcome=PEND in FEEDBACK.html","input":"","output":"","desc":"","depends_on":["CONSILIUM-MODE-SEQUENTIAL-001"],"used_by":["ARCH-CONSILIUM-MODES-001","CONSILIUM-IMPLEMENT-SUBAGENT-001"],"satisfies":["ARCH-CONSILIUM-MODES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/agents/consilium-subagent.md:126"}],"test_exempt":"agent spec document — behavioral contract validated by consilium-subagent smoke tests and Trias/Dialectic integration runs","milestone":"v1.1","priority":"","risks":[],"clarify":[{"rule":"ambiguous-actor","severity":"advisory","basis":"wording","where":"clause 1","quote":"The system provides a `consilium-subagent` agent that runs the full Sequential deliberation workflow (Steps 0–6 from SKILL.md) in an isolated context and returns a canonical `.consilium/runs/<ts>_<slug>.json` report as its final assistant message (no prose, no fences — raw JSON only).","question":"Who performs this -- which command or component?","suggest":"Name the subject the title names, so the clause reads on its own."},{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"2 clause(s) have no case: there are 5 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."},{"rule":"no-failure-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"What happens on the failure path -- missing input, invalid value, nothing to do?","suggest":"Add one case for the way this can go wrong; it is the case implementations skip."}]},{"id":"CONSILIUM-TRIAS-MODEL-SCHEMA-001","layer":"bus","level":"code","status":"confirmed","area":"CONSILIUM","title":"trias-model-assignment","intent":"Trias uniform model assignment: all 3 personalities (essentialist, verifier, sentinel) use sonnet. No per-personality schema workarounds needed.","contract":["`consilium/scripts/personalities.py` exposes a `PERSONALITIES` list where every entry carries a `model` field whose value controls which Claude model tier the Trias orchestrator dispatches for that sub-agent.","Model assignments are uniform: essentialist → `sonnet`, verifier → `sonnet`, sentinel → `sonnet`.","No personality entry carries `schema_less: True`; all personalities use standard StructuredOutput dispatch.","The `personalities.py` CLI emits a valid JSON array of exactly 3 objects, each with at minimum a `model` field, for use by the Trias orchestrator at runtime."],"verify":["None — all questions resolved."],"notes":[],"current_impl":[],"accept":"- All three personalities emit a `model` field (test_model_fields_present).\n- All assignments are sonnet (test_model_assignments, test_all_models_sonnet).\n- No personality carries `schema_less` (test_no_schema_less_any_personality).\n- CLI emits valid JSON array with `model` field on each entry (test_cli_output_valid_json).","input":"","output":"","desc":"","depends_on":["CONSILIUM-PERSONALITIES-001","CONSILIUM-MODE-TRIAS-001"],"used_by":["ARCH-CONSILIUM-MODES-001"],"satisfies":["ARCH-CONSILIUM-MODES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/personalities.py:21"},{"role":"tested-by","loc":"scripts/test_trias_model_schema.py:12"}],"test_exempt":null,"milestone":"v1.1","priority":"","risks":[],"clarify":[]},{"id":"CONSILIUM-UTILS-001","layer":"bus","level":"code","status":"draft","area":"CONSILIUM","title":"utils","intent":"Shared stdlib-only utilities: canonical paths, atomic writes, stdin JSON, headless detection.","contract":["`consilium/scripts/utils.py` provides shared stdlib-only utilities that every other Consilium script imports instead of defining its own copies.","`DATA_DIR` resolves to `$CONSILIUM_DATA_DIR` (made absolute) when that variable is set to a non-blank value, and otherwise to `.consilium/` under the current working directory, which is the project the orchestrator writes its reports to.","`RUNS_DIR` resolves to `runs/` under `DATA_DIR`.","`FEEDBACK_PATH` resolves to `FEEDBACK.html` under `DATA_DIR`.","`DATA_DIR` never depends on where `consilium/scripts/utils.py` is installed: a plugin cache or an APM-deployed skill folder is replaced on every update, so state kept there would reset each version.","`atomic_write_text(path, content)` writes the given string content to `path` atomically, through a sibling `.tmp` file with fsync and rename.","A read-only parent directory makes `atomic_write_text` raise `OSError`, which propagates to the caller.","`atomic_write_text` deletes the temp file on any error path, so no stale `.tmp` file persists across crashes.","`feedback_lock(feedback_path, timeout=30.0)` is a context manager holding an exclusive cross-process lock on `<feedback_path>.lock` (`msvcrt` on Windows, `fcntl` elsewhere). A second holder waits and raises `TimeoutError` after `timeout` seconds; the OS releases the lock when its holder dies, so a killed process never leaves it stuck.","`load_json_stdin` reads and parses JSON from stdin.","`load_json_stdin` exits code 2 on empty stdin or a parse failure.","`issue_penalty(severity)` returns a float score penalty for an issue dict's severity: `0.05` for `low`, `0.15` for `medium` or a missing severity, `0.30` for `high`.","`validate_keys(data, keys)` checks a data dict against a required-keys list and raises `ValueError` on a schema violation; callers map that to exit 1 or 2.","`is_headless()` reads the `CLAUDE_HEADLESS` environment variable and returns `True` only when it equals the string `'1'`; any other value, including `'true'`, `'0'`, or empty, returns `False`.","`force_utf8_streams` guards script stdout/stderr against Windows cp1252 encoding errors."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given `CONSILIUM_DATA_DIR` is unset or blank, when a script imports `DATA_DIR`, `RUNS_DIR`, or `FEEDBACK_PATH`, then they point to `.consilium/`, `.consilium/runs/`, and `.consilium/FEEDBACK.html` under the current working directory; given it names a directory, then they point to that directory, its `runs/`, and its `FEEDBACK.html`.\n- **CASE-2** — Given `atomic_write_text` is interrupted mid-write, when the write fails, then the original file is left intact and no truncated or stale `.tmp` file persists.\n- **CASE-3** — Given `CLAUDE_HEADLESS` is unset or holds any value other than `'1'` (including `'true'` or `'0'`), when `is_headless` runs, then it returns `False`; given it equals `'1'`, then it returns `True`.\n- **CASE-4** — Given empty stdin or invalid JSON, when `load_json_stdin` runs, then it prints a diagnostic message to stderr and exits code 2.\n- **CASE-5** — Given a severity of `low`, `medium`, a missing severity, or `high`, when `issue_penalty` runs, then it returns `0.05`, `0.15`, `0.15`, or `0.30` respectively.","input":"","outpu
