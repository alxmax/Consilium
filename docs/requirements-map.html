t":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-REPORT-001","CONSILIUM-AGGREGATOR-001","CONSILIUM-AUDIT-COUNTER-001","CONSILIUM-AUDIT-FEEDBACK-001","CONSILIUM-BUILD-REPORT-001","CONSILIUM-CONFIDENCE-001","CONSILIUM-FEEDBACK-001","CONSILIUM-IMPLEMENT-PIPELINE-001","CONSILIUM-INFER-PIPELINE-001","CONSILIUM-LOG-FEEDBACK-001","CONSILIUM-MARK-OUTCOME-001","CONSILIUM-MEMORY-001","CONSILIUM-PRIORS-001","CONSILIUM-RENDER-FEEDBACK-HTML-001","CONSILIUM-RENDER-IMPL-PREVIEW-001","CONSILIUM-STRIP-CONTEXT-001","CONSILIUM-VALIDATE-REPORT-001","CONSILIUM-VALIDATE-SKEPTIC-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/utils.py:6"},{"role":"tested-by","loc":"scripts/test_utils.py:10"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"10 clause(s) have no case: there are 15 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-VALIDATE-REPORT-001","layer":"bus","level":"code","status":"draft","area":"CONSILIUM","title":"validate_report","intent":"Describes observed behavior, verified against consilium/scripts/validate_report.py source.","contract":["`validate_report.py` reads a deliberation report JSON from stdin, produced by `build_report.py`.","`validate_report.py` validates report *shape*, not deliberation *substance* — confirming required fields exist and are well-formed. This is the Constitution Principle #4 gate.","`success_criterion` and `verification` are required to be non-empty strings.","`chosen_approach` is present and is either a non-empty string or JSON null.","A missing `chosen_approach` field is an error; an explicit null is accepted.","Explicit null occurs on a conservative-override veto or on a Trias null-vote pattern; the gate makes no distinction between an intentional and an unintentional null.","`skipped: true` requires `skip_reason` to be a non-empty string.","`deliberation_log` contains an aggregate step whose `result` is a dict, not a string narrative.","For non-bypassed reports, `deliberation_log` also requires the `generator` and `control` steps to be present.","`deliberation_log`'s `conservator` step presence is not enforced, except when `--strict-round2` is set.","For a pipeline-executed, non-Trias, non-passthrough report whose aggregate result carries an `admissibility` block, the chosen candidate must be admissible by the report's own log: a `valid: true` Control verdict and (for the `sequential` scheme) `net_concern` not above 0.8. A chosen candidate that is not is an error unless the aggregate result's `admissibility.waived` names it with a non-empty `reason`. Reports without the block (older runs) are not judged.","`telemetry` is present for non-skipped reports and carries a non-empty `mode` string.","Telemetry count fields (`tokens_in`, `tokens_out`, `latency_ms`) are non-negative ints, checked strictly via `isinstance(v, int)`; a float value such as `1500.0` is rejected.","Each telemetry count field is optional per voice.","Reports assembled manually outside `build_report.py` are rejected by this gate, which catches shape drift such as `aggregate.result` written as a narrative string.","Exit 0 means the report is valid; exit 1 means validation failed, with each problem printed to stderr; exit 2 means the JSON input is malformed."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a valid report from `.consilium/runs/*.json`, when `validate_report.py` runs, then it exits 0.\n- **CASE-2** — Given a report missing `success_criterion`, when `validate_report.py` runs, then it exits 1 with a message naming the field.\n- **CASE-3** — Given `skipped: true` without `skip_reason`, when `validate_report.py` runs, then it exits 1.\n- **CASE-4** — Given a non-skipped report missing `telemetry.mode`, when `validate_report.py` runs, then it exits 1.\n- **CASE-5** — Given malformed JSON input, when `validate_report.py` runs, then it exits 2.","input":"","output":"","desc":"","depends_on":["CONSILIUM-PERSONALITIES-001","CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-REPORT-001","CONSILIUM-MODE-LENS-001","SKILL-RUN-CONSILIUM-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/validate_report.py:55"},{"role":"tested-by","loc":"scripts/test_round2.py:8"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"11 clause(s) have no case: there are 16 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-VALIDATE-SKEPTIC-001","layer":"bus","level":"code","status":"confirmed","area":"CONSILIUM","title":"validate_skeptic","intent":"Describes observed behavior, verified against consilium/scripts/validate_skeptic.py source.","contract":["`validate_skeptic.py` reads a Skeptic voice output JSON from stdin, produced by the Skeptic voice per `prompts/voices/skeptic.md`.","`validate_skeptic.py` is a structural validation gate for Skeptic output, enforcing the machine-checkable subset of the gate described in `prompts/voices/skeptic.md` and `modes/skeptic_on_chosen.md` — shape and evidence rules only, not semantic correctness.","A verdict that fails this gate is discarded, and the original `chosen` candidate ships unchallenged.","`can_object` is validated as a bool; the gate exits 1 if it is missing or non-bool.","`can_object=false` requires `objection` to be null or absent; a non-null `objection` is an error.","`can_object=true` requires `objection` to be an object with `concrete_concerns` (a list of strings) and `quoted_scenario` (a string or null).","The evidence gate rejects the verdict unless it has at least 2 non-empty `concrete_concerns`, or a non-empty `quoted_scenario`.","`failure_mode` is validated against the allowed set `{correctness, goal_fit, verification_inadequate, meta_scope_mismatch}`.","`addressable` is validated against the allowed set `{in_place, requires_redesign, unaddressable}`.","`failure_mode=goal_fit` requires at least one `concrete_concern` to reference the substring `\"success_criterion\"`.","Exit 0 means the verdict is well-formed and the orchestrator may apply it; exit 1 means the verdict is invalid, with each problem printed to stderr and the orchestrator shipping the original `chosen`; exit 2 means the JSON input is malformed."],"verify":["None — all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given `can_object=false` with a null `objection`, when `validate_skeptic.py` runs, then it exits 0.\n- **CASE-2** — Given `can_object=true` with 2 or more `concrete_concerns`, when `validate_skeptic.py` runs, then it exits 0.\n- **CASE-3** — Given `can_object=true` with only a non-empty `quoted_scenario`, when `validate_skeptic.py` runs, then it exits 0.\n- **CASE-4** — Given `can_object=true` with 0 `concrete_concerns` and a null `quoted_scenario`, when `validate_skeptic.py` runs, then it exits 1 (evidence gate).\n- **CASE-5** — Given `failure_mode=goal_fit` without `\"success_criterion\"` referenced in any concern, when `validate_skeptic.py` runs, then it exits 1.\n- **CASE-6** — Given an unknown `failure_mode` value, when `validate_skeptic.py` runs, then it exits 1.\n- **CASE-7** — Given malformed JSON input, when `validate_skeptic.py` runs, then it exits 2.","input":"","output":"","desc":"","depends_on":["CONSILIUM-VOICE-SKEPTIC-001","CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-REPORT-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/validate_skeptic.py:49"},{"role":"tested-by","loc":"scripts/test_skeptic.py:11"}],"test_exempt":null,"milestone":"v1.1","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"4 clause(s) have no case: there are 11 clauses and 7 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-VERSION-001","layer":"bus","level":"code","status":"confirmed","area":"CONSILIUM","title":"version","intent":"Repo version provenance: git-describe display stamp, resolvable committed-HEAD ref, and a guarded prompt-drift counter — the primitives every report producer stamps into telemetry.","contract":["`consilium/scripts/version.py` is the single home for version provenance, separated from report assembly (`build_report.py`, which only consumes these values).","`consilium_version()` returns the human display stamp from `git describe --tags --always --dirty`, and fails open to `\"unknown\"` when git is absent or errors — it never raises.","`consilium_ref()` returns the resolvable diff operand: the committed HEAD sha on a clean tree.","`consilium_ref()` returns `\"\"` on a dirty or unknown tree — by contract, never a `<sha>-dirty` string — so a recorded ref is always `git checkout`-able.","`ref_resolves(ref)` returns a bool, short-circuiting `\"\"` and `\"unknown\"` to `False` without a git call.","`prompts_changed_since(ref)` counts prompt/mode files changed since a prior ref and never raises: it returns 0 on `\"\"`, `\"unknown\"`, or an unreachable ref.","`prompts_changed_since` lets the Step-0 `prompt_drift` advisory call it unconditionally.","The CLI supports `--version` (default), `--ref`, and `--drift <ref>` flags, and prints the requested value to stdout with exit 0.","This split was retagged out of `CONSILIUM-BUILD-REPORT-001` on 2026-07-03 (review backlog-disposition audit, item b) because impact analysis on the report assembler was pulling in unrelated provenance code; origin: review 2026-05-31_200016 (versioning-provenance-design)."],"verify":["None - the report-stamping obligation (every producer writes these two fields into telemetry) belongs to CONSILIUM-BUILD-REPORT-001 and the two hand-built SKILL.md templates; this requirement covers only the provenance primitives themselves."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given `_git` stubbed to fail, when `consilium_version()`, `consilium_ref()`, `ref_resolves(\"abc\")`, and `prompts_changed_since(\"abc\")` run, then they return `\"unknown\"`, `\"\"`, `False`, and `0` respectively (`scripts/test_version.py`).\n- **CASE-2** — Given a dirty-tree stub, when `consilium_ref()` runs, then it returns `\"\"`; given a clean-tree stub, then it returns the HEAD sha.\n- **CASE-3** — Given `ref_resolves(\"\")` and `ref_resolves(\"unknown\")`, when they run, then both return `False` without a git call.\n- **CASE-4** — Given a real repo, when `consilium_version()` runs, then it returns a non-empty string.","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-REPORT-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/version.py:141"},{"role":"tested-by","loc":"scripts/test_version.py:103"}],"test_exempt":null,"milestone":"v1.2","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"5 clause(s) have no case: there are 9 clauses and 4 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-VOCABULARY-MAP-001","layer":"bus","level":"code","status":"confirmed","area":"CONSILIUM","title":"vocabulary_map","intent":"Single source of truth for field-value translations and the per-voice token budget table.","contract":["`consilium/scripts/vocabulary_map.py` is the single source of truth for all user-facing natural-language translations of structured deliberation field values, and for the per-voice token budget table.","`VOCABULARY_MAP` maps categories (`reversibility`, `magnitude`, `meta_recommendation`, `verdict`) to their human-readable labels, used by the renderer and aggregator to produce consistent output strings.","`translate` falls back silently: an unknown category or value returns `str(value)`, with no logging; callers cannot assume a human-readable label is always returned.","All `VOCABULARY_MAP` labels are hardcoded Romanian strings, except `meta_recommendation` values, which are English; no i18n hook exists or is planned.","`compute_tokens_budget` derives a per-voice token allocation from the Conservator's Q1 (`magnitude`) and Q2 (`reversibility`) outputs, scaling down to 300 for trivial questions.","`compute_tokens_budget` applies `meta_recommendation` modifiers: `scale_down` sets the budget to 300, `scale_up` multiplies it by 1.5 and caps it at 4000.","With `meta='scale_up'`, the base value is `TOKENS_BUDGET.get((magnitude, reversibility), 800)`; the 4000 cap binds only for `(\"critical\", \"irreversible\")` (base 4000 → 4000 after cap); every other pair produces an uncapped result (for example, base 2000 → 3000, base 800 → 1200).","`vocabulary_map.py` is bus-layer because it carries no pipeline logic: it is a pure lookup table consumed by feature scripts.","The CLI takes a positional category (e.g. `reversibility`, `magnitude`, `verdict`) and optional value (e.g. `complete`, `critical`), and prints the translated human-readable string to stdout with exit code 0 always.","`compute_tokens_budget` returns a dict with `generator` and `control` keys."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given `translate('reversibility', 'complete')`, when it runs, then it returns the Romanian string `ușor de anulat`.\n- **CASE-2** — Given `translate('verdict', 'GO')`, when it runs, then it returns `aprobat de majoritate`.\n- **CASE-3** — Given `compute_tokens_budget('critical', 'irreversible')`, when it runs, then it returns `{'generator': 4000, 'control': 4000}`.\n- **CASE-4** — Given `compute_tokens_budget` with `meta='scale_down'`, when it runs, then it always returns `{'generator': 300, 'control': 300}` regardless of magnitude or reversibility.\n- **CASE-5** — Given `translate` for an unknown category or value, when it runs, then it returns `str(value)` without raising.","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-REPORT-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/vocabulary_map.py:11"},{"role":"tested-by","loc":"scripts/test_round2.py:9"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"5 clause(s) have no case: there are 10 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-VOICE-CONSERVATOR-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"conservator voice","intent":"WHY: The Conservator runs second, after Generator, scoring the risk of each candidate Generator produced and calibrating the token budget that Control will use.","contract":["The voice emits a `scores` array where each entry preserves the `id` field verbatim from the input.","Each `scores` entry carries the following fields: `regression_risk` (`reversibility`, `magnitude`, `net_concern`), `counterparty_risks`, `bias_check`, `meta_recommendation`, `tokens_budget` (`generator`, `control`).","The voice computes `net_concern` using the defined formula (`mean` of the four component scores, with `reversibility_score > 0.7` floored to `max(net_concern, reversibility_score)`), and documents any unanchored score components in `notes`.","The voice sets `irreversibility_flag: true` for any candidate where `reversibility = irreversible` and explicit user consent is not documented in the input, signaling the aggregator to BLOCK before finalizing. This is the backstop behind the pre-dispatch consent gate (`scope_gate.consent_required`, Step 1.6) — it catches irreversible commitments visible only in the candidates, which a path/text pre-check cannot see.","For any candidate with `net_concern >= 0.3`, the voice emits either a `rollback_recipe` (2–5 concrete human-executable steps) or, when rollback is structurally impossible, replaces it with `mitigation_steps` and sets `irreversible: true` at the candidate level.","The mitigation cap (max two mitigations, total ≤ −0.20, second mitigation capped at −0.05 remaining budget) is discipline-based with no automated schema enforcement. Compliance is audited through `notes` documentation of applied mitigation values.","When `meta_recommendation: \"scale_down\"` is set, the token budget is unconditionally overridden to 300 regardless of magnitude×reversibility. The Conservator's runtime judgment overrides pre-computed classifications; no floor exists for high/critical magnitude by design."],"verify":["None - all questions resolved."],"notes":["The three irreversibility-related fields (`irreversibility_flag`, `irreversible`, `regression_risk.reversibility`) can coexist on the same candidate and carry different semantics; the prompt documents the distinction, but the overlap is a persistent source of confusion for readers and voice models alike."],"current_impl":["prompts/voices/conservator.md"],"accept":"AC-1\n  Given a proposed change where `reversibility = irreversible` and no explicit user consent appears in the input\n  When  the Conservator voice runs\n  Then  the candidate's score entry has `irreversibility_flag: true`, and the aggregator-facing signal causes a BLOCK before finalizing (backstop behind the pre-dispatch consent gate)\n\nAC-2\n  Given a candidate scored with `net_concern >= 0.3` and a structurally possible rollback\n  When  the Conservator voice runs\n  Then  the candidate's score entry contains a `rollback_recipe` array with 2–5 non-abstract, human-executable steps; `irreversible` is absent or `false`\n\nAC-3\n  Given a candidate scored with `meta_recommendation: \"scale_down\"`\n  When  the Conservator voice runs\n  Then  `tokens_budget.generator` and `tokens_budget.control` are both 300, regardless of the magnitude×reversibility table value","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-VOICES-001","CONSILIUM-MODE-SEQUENTIAL-001"],"satisfies":["ARCH-CONSILIUM-VOICES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/prompts/voices/conservator.md:218"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"4 clause(s) have no case: there are 7 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-VOICE-CONTROL-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"control voice","intent":"WHY: The Control voice analytically validates every Generator candidate for correctness, type safety, and goal-fit, and surfaces hidden assumptions and glossary gaps that could cause the deliberation to produce a wrong answer.","contract":["The voice emits a `glossary` object with 2–5 operationally-defined terms specific to the current deliberation; if it cannot define a key term after 3 attempts, it sets `glossary_fail: true` and documents all 3 attempts in `glossary_attempts`, which signals the aggregator to BLOCK and request reformulation.","The voice emits a `verdicts` array containing one entry per candidate; each verdict includes `id`, `valid` (boolean), `confidence_in_verdict` (`high` | `medium` | `low`), `issues` (with `category`, `detail`, `severity` per entry), and `tests_to_write` (1–4 concrete test stubs for every `valid: true` candidate that is not `do_nothing`).","The voice checks goal-fit first and, if the candidate does not address `success_criterion`, marks `valid: false` with `category: \"logic\"` and skips all remaining checks for that candidate.","The voice emits a `disagreements` array classifying any substantive conflict between voices as `substantial` (different answer → REWORK) or `terminological` (same answer, different words → note and continue).","The voice cannot always verify a signature without reading a file; when file access fails in that situation, the `unverifiable — file not accessible` marker in the verdict is the intended degradation signal.","This degradation is transparent: the marker is recorded in verdicts visible to the aggregator and the report, and no harder signal is required.","The 3-entry cap on `hidden_assumptions` and the self-assessed selection criterion are by design. Control is a deliberative voice, not a formal verifier; the design intentionally trusts the voice to surface the most consequential assumptions."],"verify":["None - all questions resolved."],"notes":["`confidence_in_verdict: low` is advisory only — the aggregator does not automatically discount verdicts marked `low`, so a technically `valid: true` / `low` verdict can influence the final recommendation without the reader realizing the validation was speculative. This is intentional: `low` is a transparency signal prompting the reader to treat the verdict as speculative, not a veto mechanism. The design choice is to surface speculation honestly rather than suppress it.","In Sequential mode all three voices (Generator → Conservator → Control) produce their outputs before the aggregator evaluates them. A `glossary_fail` is therefore detected post-hoc by the aggregator; Control always runs last (after Generator and Conservator) with access to Generator's candidates. (The irreversibility consent BLOCK, by contrast, fires pre-dispatch at Step 1.6, before Generator.) AC-2 reflects this correctly.","No retrospective signal exists to detect cases where the 3-entry cap on `hidden_assumptions` caused a critical assumption to be dropped. This is a known, accepted gap."],"current_impl":["prompts/voices/control.md"],"accept":"AC-1\n  Given a Generator candidate whose `sketch` does not address the stated `success_criterion`\n  When  the Control voice runs\n  Then  the verdict for that candidate has `valid: false`, `issues` contains exactly one entry with `category: \"logic\"`, and no `tests_to_write` entries are present for that candidate\n\nAC-2\n  Given a deliberation where a key term cannot be operationally defined within 3 attempts\n  When  the Control voice runs\n  Then  the output has `glossary_fail: true`, `glossary_attempts` is an array of exactly 3 entries, and no other mandatory processing is skipped (verdicts are still emitted)\n\nAC-3\n  Given a valid, non-`do_nothing` candidate that passes all checks\n  When  the Control voice runs\n  Then  the verdict has `valid: true`, `confidence_in_verdict` is one of `high|medium|low`, and `tests_to_write` contains at least 1 entry with both `name` and `assert` fields populated","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-VOICES-001","CONSILIUM-MODE-SEQUENTIAL-001"],"satisfies":["ARCH-CONSILIUM-VOICES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/prompts/voices/control.md:131"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"4 clause(s) have no case: there are 7 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-VOICE-GENERATOR-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"generator voice","intent":"WHY: The Generator produces a structured set of candidate approaches for the deliberation, running first in the pipeline — blind to risk framing (anti-anchoring) and self-scaling its depth from the change's blast radius.","contract":["The voice emits a JSON object containing a `candidates` array of 3–5 entries, each with the fields `id`, `summary`, `sketch`, `rationale`, and `downside_estimate`; it always includes a candidate with `id: \"do_nothing\"`.","The voice includes a candidate named `adversarial_<short_id>` when the change touches shared/core code or a function with more than 3 external callers, or emits `adversarial_skipped` with a reason when that condition is not met.","The voice emits `challenge_upward.triggered: true` (with a one-line reason) when the input itself carries heavy risk markers — specifically when it contains 3+ risk terms (e.g. \"irreversible\", \"permanent\", \"drop\", \"migration\") or when the fallback scenario implies more than 10% of capital or more than 1 month of recovery while reading as routine. The flag is forwarded into Conservator's input (Conservator runs next) to raise its scrutiny — a one-way signal forward, not a re-run.","The voice emits `fallback_scenario` and `coverage_check`; if no fallback can be articulated after 2 attempts, it emits `abstain.triggered: true` with `reason: \"goal_undefined\"`.","The `unconventional_*` candidate is included unless `adversarial_*` varies on a non-scope axis, or the change is mechanically trivial.","A non-scope axis is one of: mechanism, timing, abstraction level.","Scope overlap alone does NOT justify omitting `unconventional_*`; this rule prevents silent candidate duplication and is normative.","The voice-score handicap (0.5) applied to `adversarial_*` and `do_nothing` candidates is applied downstream by `build_report.py`. The Generator does not self-verify this handicap; the cross-component dependency is documented here to make the contract explicit to future editors. The Generator output schema has no per-candidate score field, so a Generator output cannot override this handicap.","The external-caller threshold (>3 callers) is a heuristic self-assessment from the input context; the Generator has no file access and cannot perform static analysis. The 3-caller rule is a prompt-level instruction, not a mechanically enforced count.","\"Mechanically trivial\" (the `unconventional_*` omission condition) is intentionally undefined; the Generator exercises discretion, with a one-line doc fix as the canonical example. It does not overlap with Conservator's `meta_recommendation: scale_down` — the Generator does not receive `meta_recommendation` as input."],"verify":["None - all questions resolved."],"notes":["The voice self-scales its output from the change's blast radius (diff size, sensitive paths) — there is no upstream `tokens_budget` (Generator runs first). It has no mechanical way to enforce depth — over-generation is a real risk on large/sensitive inputs where the model may over-produce."],"current_impl":["prompts/voices/generator.md"],"accept":"AC-1\n  Given a proposed change that touches shared/core code\n  When  the Generator voice runs\n  Then  the output `candidates` array contains exactly one entry whose `id` starts with `adversarial_`, OR `adversarial_skipped` is present with a non-empty reason string\n\nAC-2\n  Given a proposed change where no fallback can be articulated\n  When  the Generator voice runs\n  Then  the output contains `abstain.triggered: true` and `abstain.reason` is `\"goal_undefined\"` or a description of the domain-data gap; the `candidates` array may still be present\n\nAC-3\n  Given a proposed change whose input carries 3+ risk terms (or whose stated fallback implies > 10% capital loss) while reading as routine\n  When  the Generator voice runs\n  Then  the output contains `challenge_upward.triggered: true` with a non-null `reason` string","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-VOICES-001","CONSILIUM-MODE-SEQUENTIAL-001"],"satisfies":["ARCH-CONSILIUM-VOICES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/prompts/voices/generator.md:147"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"7 clause(s) have no case: there are 10 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."},{"rule":"case-monoculture","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"Every case starts from the same kind of input (\"proposed\"). What is the other kind a caller would supply?","suggest":"Add one case written from the caller's side, not the implementation's."}]},{"id":"CONSILIUM-VOICE-SKEPTIC-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"skeptic voice","intent":"WHY: The Skeptic performs a focused post-selection challenge on the single chosen candidate, providing the last line of defense against a correct-looking but concretely-flawed winner before it ships.","contract":["The voice emits either `can_object: true`, with a populated `objection` object, or `can_object: false`, with `objection: null` and a one-sentence `notes` explaining the absence of objection.","The machine-checkable shape of the output is owned by [[CONSILIUM-VALIDATE-SKEPTIC-001]]: required fields, minimum evidence, allowed values. This requirement does not restate it.","The voice never fabricates a concern that does not appear in `success_criterion` or stated context.","The voice picks exactly one `failure_mode`, the one that names why the chosen candidate fails.","The voice uses `addressable: unaddressable` only when no redesign can resolve the concern.","Output that the validation gate rejects is discarded silently: the chosen candidate ships unchanged, no warning is emitted, and the base deliberation result stands as if the Skeptic had not run. This is a deliberate conservative fallback.","`meta_scope_mismatch` is a self-assessed heuristic gate with no external oracle; all three conditions (correct answer, trivially-human-resolvable, cost exceeds decision value) are necessarily evaluated by the voice itself because they require contextual judgment that no deterministic external check can provide."],"verify":["None - all questions resolved. Silent discard is completely invisible: no log, no telemetry, no pipeline report entry (covered by Contract: \"no warning is emitted\"). `meta_scope_mismatch` uses `addressable: unaddressable` because the concern is not fixable by redesigning the candidate — the deliberation tool was wrong for the problem, not the answer; `unaddressable` refers to the tool-application level, not the human's ability to resolve the original question directly."],"notes":["The validation gate is enforced by the orchestrator after the fact, not by the voice itself — a skeptic that emits invalid output does not know it was rejected."],"current_impl":["prompts/voices/skeptic.md"],"accept":"AC-1\n  Given the Skeptic receives a chosen candidate and can identify 2 specific, named concerns grounded in `success_criterion` or stated context\n  When  the Skeptic voice runs\n  Then  the output has `can_object: true`, `objection.concrete_concerns` contains at least 2 entries, and `objection.failure_mode` is one of the four enumerated labels\n\nAC-2\n  Given the Skeptic receives a chosen candidate with no concrete verifiable flaw\n  When  the Skeptic voice runs\n  Then  the output has `can_object: false`, `objection` is null, and `notes` contains a non-empty sentence explaining the absence of objection\n\nAC-3\n  Given the chosen candidate is technically correct but the problem is resolvable in under 10 seconds by a human without deliberation tooling\n  When  the Skeptic voice runs\n  Then  the output has `failure_mode: \"meta_scope_mismatch\"`, `addressable: \"unaddressable\"`, and `concrete_concerns` contains at least 2 entries describing the cost/benefit inversion","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-VOICES-001","CONSILIUM-MODE-DIALECTIC-001","CONSILIUM-MODE-SKEPTIC-ON-CHOSEN-001","CONSILIUM-VALIDATE-SKEPTIC-001"],"satisfies":["ARCH-CONSILIUM-VOICES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/prompts/voices/skeptic.md:139"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"4 clause(s) have no case: there are 7 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-VOTE-DEGENERACY-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"Trias vote degeneracy measurement","intent":"Empirically measures whether the Trias \"democratic vote\" carries signal by computing the 3-0 unanimity rate across Trias runs in the corpus — testing the hypothesis that 3 personality lenses on the same model are correlated and always agree (design audit 2026-05-26).","contract":["`vote_degeneracy.py` scans `.consilium/runs/*.json` for genuine Trias runs (mode field = `\"trias\"` or `\"trias_split\"` exactly) and tallies vote-pattern distribution.","`vote_degeneracy.py` reports `vote_degenerate: true` if the 3-0 unanimity rate exceeds the threshold (default 0.85) and n ≥ min-n (default 20); `\"insufficient\"` when n < min-n; `false` otherwise.","A 2-0 pattern (one personality all-vetoed) is counted as `veto_rate`, not folded into unanimity.","`vote_degeneracy.py` is read-only: it performs no modification to runs, prompts, or pipeline.","With `--json`, `vote_degeneracy.py` emits machine-readable output.","`--runs-dir` overrides the default corpus directory; `--min-n` and `--degenerate-threshold` are configurable.","The default threshold of 0.85 is calibration-provisional; it is revisited once n ≥ min-n genuine Trias runs exist. The `insufficient` verdict already defers judgment until that corpus exists."],"verify":["None — contract matches script docstring and design audit 2026-05-26 intent exactly."],"notes":[],"current_impl":["consilium/scripts/vote_degeneracy.py"],"accept":"- Given 20+ Trias runs all with 3-0, `vote_degenerate: true` is returned.\n- Given 20+ Trias runs with 50% 3-0, `vote_degenerate: false`.\n- Given fewer than min-n Trias runs, result is `\"insufficient\"`.\n- Given `--json`, output parses as valid JSON with `vote_degenerate`, `three_zero_rate`, `n` fields.\n- Non-Trias runs are excluded even if they reference `vote_pattern` in their body.","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-MODES-001"],"satisfies":["ARCH-CONSILIUM-MODES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/vote_degeneracy.py:34"},{"role":"tested-by","loc":"scripts/test_vote_degeneracy.py:11"}],"test_exempt":null,"milestone":null,"priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"2 clause(s) have no case: there are 7 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."},{"rule":"no-failure-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"What happens on the failure path -- missing input, invalid value, nothing to do?","suggest":"Add one case for the way this can go wrong; it is the case implementations skip."}]},{"id":"SKILL-RUN-CONSILIUM-001","layer":"feature","level":"code","status":"confirmed","area":"SKILL","title":"run-consilium driver","intent":"Single entry point exercising Consilium's deterministic LLM-free surface (smoke / pipeline / shot).","contract":["`driver.py` is the single entry point exercising Consilium's entire deterministic, LLM-free surface, in one command; the script exists because Consilium has no single runnable app, and this driver replaces \"run the app\" for a skill-based deliberation system.","In `smoke` mode, `driver.py` runs all the `scripts/test_*.py` unit suites, the `check_doc_drift.py` invariant gate, and the `docs/architecture` build `--check`.","In `smoke` mode, `driver.py` also runs the full bundle → build_report → validate_report pipeline, reporting PASS/FAIL per step.","`smoke` mode exits non-zero only when failures exceed a documented baseline.","In `pipeline` mode, `driver.py` demos the aggregator → confidence → build_report → validate_report chain with inline synthetic input, printing each stage's JSON to stdout so the developer can see the data flowing through the pipeline; it exits 0.","In `shot` mode, `driver.py` screenshots `docs/architecture.html` using headless Chrome or Edge, writing the PNG to `.consilium/shots/architecture.png` by default, or to the caller-supplied path.","`shot` mode reads `docs/architecture.html` and checks for Chrome or Edge at known Windows paths.","`smoke` and `pipeline` modes read `bundle_smoke_tests.json` from the repo root.","`driver.py` injects `PYTHONUTF8=1` and `PYTHONIOENCODING=utf-8` into all child process environments.","Stdout carries per-step PASS/FAIL lines with exit codes and failure
