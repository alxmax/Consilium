count":1,"first":"2026-05-16","last":"2026-05-16","versions":["v1.0.0"],"landmark":"v1.0.0","headline":"Initial public release, after a public-readiness pass (2026-05): closed a","entries":[{"version":"v1.0.0","date":"2026-05-16","headline":"Initial public release, after a public-readiness pass (2026-05): closed a","body":"Initial public release, after a public-readiness pass (2026-05): closed a\nbenchmark answer-leak, hardened `.gitignore`, fixed three core-script bugs,\ncorrected benchmark doc-drift, made the architecture explainer's Trias dispatch\nclaim honest (parallel by spec mandate, serial in practice), added a README\nusage example, scrubbed personal paths/artifacts, and added a stdlib CI\ngreen-gate. Each change deliberated via `/consilium`.\n\n### Deliberation engine\n- Three adversarial voices — **Conservator** (risk/reversibility), **Generator**\n  (alternatives, incl. `do_nothing`), **Control** (correctness + acceptance tests)\n  — merged by an 8-component veto cascade (`scripts/aggregator.py`) into one\n  canonical, validated report.\n- Confidence scoring with per-mode floors (`scripts/confidence.py`); soft priors\n  from a file-based feedback loop (`scripts/priors.py` + `.consilium/`).\n- Scope gate (`scripts/scope_gate.py`) auto-skips trivial diffs; silent parallel\n  cross-check audit (`scripts/audit_counter.py`).\n\n### Modes\n- **Sequential** (default, 1×), **Dialectic** (1.33×), **Trias** (3×, three\n  personality lenses + democratic vote), and the composable\n  **`skeptic_on_chosen`** flag.\n\n### Tooling & docs\n- Benchmark harness (`benchmark/`) comparing each mode to bare-model baselines\n  against an external hidden oracle.\n- Interactive architecture explainer (`docs/architecture.html`; React source\n  under `docs/architecture/`, built by `build.py`).\n- `run-consilium` companion skill (build / test / smoke / screenshot).\n- Deterministic regression suite (`evals/`), mode-doc drift gate\n  (`scripts/check_doc_drift.py`), and a stdlib-only CI green-gate.\n\n### License\n- Business Source License 1.1 © 2026 Schipor Alexandru; converts to Apache-2.0\n  on 2030-05-16.","first_commit":"2026-05-16","last_commit":"2026-05-16"}]},{"month":"2026-07","count":8,"first":"2026-07-06","last":"2026-07-07","versions":["v1.4.0","v1.4.1","v1.4.2","v1.4.3","v1.5.0","v1.6.0","v1.7.0","v1.8.0"],"landmark":"v1.8.0","headline":"Provenance — shipped OFF-by-default over a MODIFY verdict, documented per the audit's own condition","entries":[{"version":"v1.8.0","date":"2026-07-07","headline":"Provenance — shipped OFF-by-default over a MODIFY verdict, documented per the audit's own condition","body":"### Added\n- **Opt-in personality-lens ladder (`--lens <name>`, default OFF).** Sequential can prepend one lens (`--lens essentialist`) to Generator→Conservator→Control; Dialectic's rung (`--lens essentialist`) puts **Essentialist on the decider** and **tints the Skeptic with the Verifier lens** (complementary roles, not a vote — `decider != skeptic`). No new sub-agent dispatch; lens text costs ~18% per-voice prompt tokens, so it is **off by default**, keeping the default path's cost unchanged.\n- **Verifier lens Skeptic carve-out** (`prompts/voices/verifier_lens.md`): the Verifier lens is now coherent when tinted onto the Skeptic voice (previously it only described Generator/Control/Conservator roles). This is the \"tint, no new file\" mechanism — no separate skeptic-lens prompt is added. Locked by a new keyword assertion in `scripts/test_lens_bias.py`.\n- **`telemetry.lens_applied`** (`{decider, skeptic?}`), validated by `scripts/validate_report.py`: present only on an opt-in `--lens` run, absent on default runs; for Dialectic the decider and skeptic lenses must differ (runtime `decider != skeptic` enforcement).\n\n**Provenance — shipped OFF-by-default over a MODIFY verdict, documented per the audit's own condition.** Two same-day internal design reviews (2026-07-07, MODIFY; and a pinned refinement, MODIFY) returned MODIFY, not GO. The dominant, twice-repeated condition — ship **opt-in / default OFF** rather than a mode default — is honored here (this satisfies the user's hard cost constraint literally: 0 token delta unless the flag is set). The A-vs-B fork for \"Verifier as skeptic\" was resolved to **B (tint)** with the required coherence carve-out; pure-A (a new prompt file) was rejected by the audit as violating \"no new files / cost unchanged.\" **Lens value remains empirically unproven** (Trias is 0/6 vs baseline on the only valid instrument — a saturated corpus, i.e. an absent test, not a failed one; `experiments/trias-discriminating-tasks-design.md`). Default-on is therefore **not** shipped and is gated on a future discriminator pilot (n≥10–20 on a non-saturated, oracle-validated code-deliberation corpus). This entry is the deliberate, traceable record of that override, per the design review's own condition.","first_commit":"2026-07-07","last_commit":"2026-07-07"},{"version":"v1.7.0","date":"2026-07-07","headline":"Provenance — shipped over a same-day MODIFY verdict, by explicit user override","body":"### Changed\n- **Sequential's deliberation now runs as one dispatched sub-agent** (`subagents: 0 → 1`), mirroring the atomic unit Trias already uses per personality: Generator → Conservator → Control still run in a single shared context (unchanged internally — `strip_context.py` and Generator's turn-1 blindness still apply), but that context is now the sub-agent's own, not the orchestrator's. The sub-agent returns the three raw voice outputs (`generator_out`, `control_out`, `conservator_out`) **unmodified** — `aggregate_sequential()` is untouched. Dialectic inherits this automatically (`subagents: 1 → 2`, its own definition — \"Sequential + Skeptic\" — unchanged).\n- Real wall-clock instrumentation for Sequential's dispatch (`telemetry.voices.sequential_dispatch.latency_ms`), replacing the previously-hardcoded `0` for in-context voices.\n- `docs/architecture/src/modes.jsx` data fields updated to match (subagent counts, isolation description); the animated walkthrough step-by-step diagram for Sequential still depicts the pre-dispatch layout and has not been reworked to show a separate sub-agent box — tracked as a follow-up, not blocking.\n\n**Provenance — shipped over a same-day MODIFY verdict, by explicit user override.** An independent internal design review examined this exact change twice, same day, and returned MODIFY both times (DEEPLY_SPLIT in round 1, MODIFY in round 2 after focal cross-examination) — concerns: unmeasured benefit magnitude, a likely net cost increase from losing prompt-cache warmth in a freshly dispatched sub-agent, and an invalid citation of Trias's atomic-dispatch precedent (Trias isolates personalities to protect voting integrity; Sequential has no vote to protect). The user reviewed both verdicts and instructed an explicit override. Implementation then ran through Trias (3 personalities + post-vote Skeptic) for the *how*, not the *whether*: the Skeptic caught and this release fixes a real correctness gap the review had not named — an earlier draft would have had the sub-agent return only `{chosen_approach, rationale, confidence}`, which would have silently disabled `aggregate_sequential()`'s entire veto cascade (BLOCK/REWORK/SHORT-CIRCUIT/ESCALATE never firing for Sequential again). All accepted tradeoffs are documented in `modes/sequential.md` § Accepted tradeoffs, not silently absorbed.","first_commit":"2026-07-07","last_commit":"2026-07-07"},{"version":"v1.6.0","date":"2026-07-07","headline":"`2026-07-07_011914-consilium-falsifier-round2-control-voice`, MODIFY 0/8/1","body":"### Added\n- Declared falsifier on the chosen approach, **consumer-first** (design review\n  `2026-07-07_011914-consilium-falsifier-round2-control-voice`, MODIFY 0/8/1\n  — implement-now rejected; this ships the review-revised trim instead of the\n  original clause): (1) `build_report.py` now persists Control's\n  `strongest_objection` + `no_blocking_defect_attested` into the run JSON's\n  control step — previously emitted mid-deliberation but never persisted;\n  (2) `mark_outcome.py --auto-suggest` reads the declared falsifier\n  (`strongest_objection.reason`) from the run JSON as the default `--reason`\n  when scoring an outcome (explicit `--reason` wins; degrades gracefully on\n  pre-1.6.0 runs); (3) `prompts/voices/control.md` Q5 amendment: when\n  `no_blocking_defect_attested: true`, `strongest_objection.reason` must\n  carry a falsifiable exit-claim about the likely-chosen candidate — an\n  observable external to the verdict; verdict-restatement invalid.\n  Red→green tests in `test_build_report.py` and `test_feedback_html.py`.\n  **Measurement protocol (declared before landing):** 1.5.0 + 1.6.0 are one\n  bundled treatment for all benchmarking purposes; no separate attribution\n  of effects to either round. **Unvalidated for quality** — same discipline\n  as 1.5.0, no quality-improvement claim made.","first_commit":"2026-07-07","last_commit":"2026-07-07"},{"version":"v1.5.0","date":"2026-07-07","headline":"a Conservator silent-failure question (Q6), a merged Control rule requiring","body":"### Added\n- Prompt-only discipline transplant from an internal design-review framework\n  into the 3 core voices (`prompts/voices/generator.md`, `conservator.md`, `control.md`):\n  a Conservator silent-failure question (Q6), a merged Control rule requiring\n  `strongest_objection` to be a testable claim anchored to a declared\n  `hidden_assumptions` premise, a materiality/polite-retreat discipline on all\n  three voices, and a `## Limits` disjointness section per voice. No JSON\n  schema change, no new dispatches, no `aggregator.py`/`validate_report.py`\n  edits — purely additive prompt text. Per design review run\n  `2026-07-06_093007` (GO_WITH_CONDITIONS) and the trimmed spec from its\n  reviewers' cross-questioning (the final blocking condition). `test_lens_bias.py` (4/4), `test_vote_degeneracy.py` (4/4), and\n  `run_evals.py` (65/0) are identical before and after — zero verdict\n  inversions. Manually verified on one qualitative example (not part of the\n  scored corpus) that the new clauses produce the intended behavior: Q6 names\n  the silent-failure mode explicitly instead of it surfacing scattered/implicit\n  elsewhere, and `strongest_objection` cites a numbered premise instead of a\n  free-floating claim. **Unvalidated for quality** — n=1, manual, no claim of\n  improved deliberation quality is made or implied by this change.","first_commit":"2026-07-07","last_commit":"2026-07-07"},{"version":"v1.4.3","date":"2026-07-06","headline":"`ImplementSection`) never stated its own sub-agent count (3) or cost multiplier","body":"### Fixed\n- The \"Code integration pipeline\" explainer section (`docs/architecture/src/extras.jsx`\n  `ImplementSection`) never stated its own sub-agent count (3) or cost multiplier\n  (~1.1×) anywhere in its text, unlike every other mode/flag (Sequential,\n  Dialectic, Trias, `skeptic_on_chosen`), which all state cost + sub-agent count\n  explicitly. Added the missing stat to `GATE_ITEMS` and a new\n  `check_doc_drift.py` invariant (`check_implement_pipeline_spec_alignment`)\n  pinning it against `modes/implement_pipeline.md`'s frontmatter.","first_commit":"2026-07-06","last_commit":"2026-07-06"},{"version":"v1.4.2","date":"2026-07-06","headline":"`consilium_full` poster generator still named the retired Trias personality","body":"### Fixed\n- Architecture explainer, README, benchmark instructions, and the\n  `consilium_full` poster generator still named the retired Trias personality\n  team (Pioneer/Architect/Steward) after the v3 lens rename (PR\n  #482) replaced it with Essentialist/Verifier/Sentinel. Renamed everywhere\n  (with descriptions rewritten to match each personality's actual lens, not\n  just the label), regenerated both derived HTML artifacts, and added a new\n  `check_doc_drift.py` invariant (`check_trias_personality_name_parity`) so a\n  future personality-team change can't silently miss the explainer again.","first_commit":"2026-06-14","last_commit":"2026-07-06"},{"version":"v1.4.1","date":"2026-07-06","headline":"fallen behind `ci.yml` — PR #485's `check_versions.py` + CHANGELOG-entry gate","body":"### Fixed\n- Architecture explainer: the \"What the CI green-gate runs\" section had silently\n  fallen behind `ci.yml` — PR #485's `check_versions.py` + CHANGELOG-entry gate\n  had no matching `CI_CHECKS` card. Added the missing card and a new\n  `check_doc_drift.py` invariant (`check_ci_checks_completeness`) that fails CI\n  if a future gate ships with no matching card or explicit allowlist entry.\n  Found by a Trias self-audit (3-0, confidence 0.95); the post-vote Skeptic\n  caught and fixed an under-specified matching rule before it shipped.","first_commit":"2026-07-06","last_commit":"2026-07-06"},{"version":"v1.4.0","date":"2026-07-06","headline":"`plugin.json` and `marketplace.json` semver agree, and CI now requires that","body":"### Added\n- Plugin manifest version-coherence gate: `scripts/check_versions.py` asserts\n  `plugin.json` and `marketplace.json` semver agree, and CI now requires that\n  any `plugin.json` version bump ships with a matching CHANGELOG entry —\n  mirroring `requirement-manager`'s check. `marketplace.json` gained a\n  `version` field for the first time (previously absent, now tracking\n  `plugin.json`).","first_commit":"2026-05-17","last_commit":"2026-06-13"}]},{"month":"2026-09","count":10,"first":"2026-09-21","last":"2026-09-29","versions":["v1.8.1","v1.10.0","v1.11.0","v1.12.0","v1.8.2","v1.9.0","v1.12.1","v1.12.2","v1.12.3","v1.12.4"],"landmark":"v1.12.0","headline":"","entries":[{"version":"v1.12.4","date":"2026-09-29","headline":"","body":"### Added\n- `scripts/validate_implement_output.py`: a stdlib validator for the STRICT-JSON output of the implement Coder, Test Writer and the implement-subagent manifest (blocked/reason rules, disjoint paths, scope escapes, `fails_on_empty_impl`, red->green reporting). Exit 0 ok, 1 problems, 2 not JSON. The implement-subagent spec now runs it before trusting a role's output (same single retry as any schema-invalid output).\n- Tests for it (`test_validate_implement_output.py`) tie Coder AC-1..3 and Test Writer AC-1..2 to real checks, and assert the validator's key sets match the JSON examples in the three spec files so they cannot drift apart.\n\n### Changed\n- Those five cases no longer carry `verifiable by: inspection`. Test Writer AC-3 stays inspection: no spec pins the shape of `uncoverable[]` or how a test refers to it, so \"no test is emitted for it\" has nothing to check against.","first_commit":"2026-09-29","last_commit":"2026-09-29"},{"version":"v1.12.3","date":"2026-09-29","headline":"","body":"### Changed\n- Behavior-preserving refactor of the long functions, deep nesting, long parameter lists and module-state writes the design pass flagged (33 candidates -> 7): `aggregator.py`, `validate_report.py`, `log_feedback.py`, `mark_outcome.py`, `audit_feedback.py`, `feedback.py`, `check_doc_drift.py`, `check_versions.py`, `build_report.py`, `infer_pipeline.py`, `implement_pipeline.py`, `render_impl_preview.py`, `scope_gate.py`, `confidence_calibration.py` (now takes a `Thresholds` tuple), `memory.py`, `priors.py` and the run-consilium driver. Public names, CLI flags, exit codes and output are unchanged.\n- Not addressed on purpose: the five files over 500 lines and the two function-name-prefix families; splitting them would break the stdlib-only stand-alone-script convention.","first_commit":"2026-09-29","last_commit":"2026-09-29"},{"version":"v1.12.2","date":"2026-09-28","headline":"","body":"### Fixed\n- Acceptance-case traceability: every case of the implement pipeline, aggregator, validate-report, vocabulary-map and lens-ladder requirements is now tied to a `# verifies:` test (new tests for the pipeline CLI and gate edge cases, `team_vote`, `validate_report` exit codes and the lens_applied problem text). The Coder and Test Writer cases describe model output and are marked `verifiable by: inspection`.\n\n### Changed\n- Dropped four `test_exempt` exemptions that were stale (`feedback.py`, `check_public_leak.py`, `mark_outcome.py`, `memory.py`) by testing them; the other 17 stay because they cover model-run prompts, agent specs or integration harnesses.","first_commit":"2026-09-28","last_commit":"2026-09-28"},{"version":"v1.12.1","date":"2026-09-28","headline":"","body":"### Changed\n- Benchmark harness now targets Claude Sonnet 5.5 (`claude-sonnet-5-5`) by default and for the `sonnet_bare` pin and verifier judge; the Opus 5.5 batch runs with `--model claude-opus-5-5`.\n- Docs and the architecture explainer name Sonnet 5.5 for the voices and sub-agents (dispatch already tracks the `sonnet` alias).","first_commit":"2026-09-28","last_commit":"2026-09-28"},{"version":"v1.9.0","date":"2026-09-22","headline":"","body":"### Changed\n- **SKILL.md trimmed from 58,231 to 30,041 bytes** (Sequential load path — SKILL.md + `modes/sequential.md` + 3 voices — 13,082 → 9,450 words, −28%). The workflow and every runtime rule stay in SKILL.md; reference material the orchestrator does not need on every run (calibration caveats, the Step 6 interception contract, retroactive-outcome details, the Step 7 lookup table and pipeline benchmark, headless rationale, feedback storage details, skill maintenance, the script table) moved verbatim to the new `docs/skill-reference.md`, linked from the step that uses it. Per-mode sections collapsed into one Modes list under the mode table; the removed Parallel section is reduced to one line.\n\n### Added\n- **`skill_md_size` doc-drift invariant**: `check_doc_drift.py` fails when SKILL.md exceeds 32,000 bytes. Covered by `scripts/test_check_doc_drift.py`.","first_commit":"2026-09-22","last_commit":"2026-09-22"},{"version":"v1.8.2","date":"2026-09-22","headline":"","body":"### Fixed\n- **Stale Trias lens names in SKILL.md Step 0.** It still told the orchestrator to read `pioneer_lens.md` / `architect_lens.md` / `steward_lens.md`, which were replaced by `essentialist_lens.md` / `verifier_lens.md` / `sentinel_lens.md` in PR #482. New `referenced_contract_exists` invariant in `check_doc_drift.py`: every `prompts/voices/`, `modes/` and `agents/` `.md` path (and bare `<name>_lens.md`) referenced by a normative doc must exist. Covered by `scripts/test_check_doc_drift.py`.\n\n### Removed\n- **Retired meta-critic step (Step 5c).** `scripts/deprecated/meta_critic.py` (retired 2026-05-25), its suite `test_meta_critic_trim.py`, its CI step and driver entry, and its 4 `evals/scenarios.json` cases (run_evals 65 → 61). `build_report.py` still passes a legacy `deliberation_quality` block through so older bundles round-trip.","first_commit":"2026-09-22","last_commit":"2026-09-22"},{"version":"v1.12.0","date":"2026-09-22","headline":"","body":"### Removed\n- **Automatic Sequential → Dialectic re-run at confidence < 0.6.** It re-ran the whole pipeline in Dialectic with no confirmation, on a signal that does not predict outcomes: on `[confirmed]` FEEDBACK rows the OK-rate is 0.86 below 0.6 (n=21) against 0.93 / 0.92 above (n=30 / n=13) — about one or two extra failures, not significant — and no measurement showed the re-run improves results. Low confidence now gets the Step 5d retry and the Step 6 override prompt, which also suggests rerunning with `--mode dialectic` / `--skeptic-on-chosen`. `build_report.py` no longer passes `auto_escalated` through (historical runs keep the field; nothing requires or rejects it). SKILL.md, `modes/sequential.md`, README, the explainer and the poster no longer describe the re-run; the poster's confidence arrow is relabelled as the Step 5d retry it draws.\n\n### Fixed\n- README's worked example still said a low-confidence run auto-fires a Skeptic, which 1.11.0 removed.","first_commit":"2026-09-22","last_commit":"2026-09-22"},{"version":"v1.11.0","date":"2026-09-22","headline":"","body":"### Changed\n- **Confidence is advisory; it no longer auto-dispatches the Skeptic.** Measured on the 64 `[confirmed]` FEEDBACK outcomes, confidence does not predict success: Brier 0.163 against 0.085 for simply predicting the base rate, and an OK-rate of 0.92 at confidence ≥ 0.7 against 0.90 below (`scripts/confidence_calibration.py` on all 273 labelled rows already returned `FALLBACK_A`). The `confidence < 0.70` trigger of `skeptic_on_chosen` is removed; the flag is opt-in (`--skeptic-on-chosen`) plus its non-confidence triggers — high Conservator concern (`trigger_reason: \"high_concern\"`, formerly gated on confidence > 0.7), a similar recent BAD, irreversibility. The Step 5d retry, the Step 6 override prompt, the mode floors and the `< 0.6` Dialectic escalation keep their thresholds as heuristics. The three explainer drift invariants that pinned the `[0.0, 0.70)` band now forbid it and require `--skeptic-on-chosen`.\n- **Trias cost figure cited.** SKILL.md and `modes/trias.md` now state that the cost multipliers are sub-agent-count estimates and that Trias's 2.67× was token-checked only as a 4-vs-6 spawn ratio on n=2 problems (`experiments/trias-6to4-cost-2026-06-19.md`); its absolute cost against Sequential is unmeasured.\n\n### Removed\n- **`priors.py` outputs no consumer read:** `override_rate`, `conservator_veto_rate` (with `runs_seen` and the `_run_had_veto` / `_veto_rate` helpers) and `top_note_keywords` in the JSON. The Conservator's `--memory-summary` (counts, confirmed `bad_rate`, recurring keywords, prior match) is unchanged.","first_commit":"2026-09-22","last_commit":"2026-09-22"},{"version":"v1.10.0","date":"2026-09-22","headline":"","body":"### Changed\n- **A run is OK only on evidence.** Step 6 now logs every run as PEND: confidence measures agreement between voices, not whether the choice worked, yet 281 of 297 rated FEEDBACK rows were OK assigned from `confidence >= 0.7` alone (78 carry `[confirmed]`). A row becomes OK or BAD through `mark_outcome.py` once the report's `verification` passes or reality refutes it; `log_feedback.py --outcome OK` now requires `--confirmed` and adds the marker.\n- **`priors.py` rates only `[confirmed]` rows.** `override_rate` / `bad_rate` ignore self-assigned outcomes (`rated_count == confirmed_count`); a new `unconfirmed_count` reports how many were left out. `weighted_bad_rate` and its 2× weight are removed — with only confirmed rows counted, the weighting had nothing left to weigh.\n- **Headless detection is explicit.** `priors.py` no longer treats a non-tty stdin as headless — under Claude Code's Bash tool stdin is never a tty, so every interactive session silently suppressed `stale_pendings` and `missing_feedback_runs`. Headless is now `--headless`, `CONSILIUM_HEADLESS=1` or `CLAUDE_HEADLESS=1`.\n\n### Added\n- **`CLOSED_UNVERIFIED` outcome** (`mark_outcome.py`): closes a stale PEND with no evidence either way; excluded from every rate and never marked `[confirmed]`.\n- **`validate_report.py --all <runs_dir> [--quarantine]`**: sweeps every run (dot-files skipped), prints each failure and a `checked / ok / fail` summary; `--quarantine` moves failures to `<runs_dir>/_invalid/`, outside the glob `priors.py` reads.\n\n### Fixed\n- `feedback.parse_runs` read `.run_path_map.json` as if it were a run.","first_commit":"2026-09-22","last_commit":"2026-09-22"},{"version":"v1.8.1","date":"2026-09-21","headline":"","body":"### Removed\n- **`trias_split` legacy mode alias.** Its dated removal milestone (2026-08-21) had passed, which turned the `legacy_mode_milestone` doc-drift check red on `main`. `validate_report.py` no longer maps `trias_split` to `trias`; historical `trias_split` runs still validate, because `telemetry.mode` is an open string, but they skip the per-voice telemetry check. `vote_degeneracy.py` still counts them as Trias runs.","first_commit":"2026-09-21","last_commit":"2026-09-21"}]},{"month":"2026-10","count":13,"first":"2026-10-13","last":"2026-10-18","versions":["v1.13.0","v1.13.1","v1.14.0","v1.15.0","v1.15.1","v1.15.2","v1.15.3","v1.15.4","v1.15.5","v1.15.6","v1.15.7","v1.15.8","v1.15.9"],"landmark":"v1.15.0","headline":"","entries":[{"version":"v1.15.9","date":"2026-10-18","headline":"","body":"### Fixed\n- `build_report.py` now marks a non-skipped report `telemetry_incomplete: true` (with `telemetry_gaps`) when its telemetry has no integer `dispatch_count` or no measured latency, so a cost rollup can tell which reports to distrust. Marked, not rejected: older runs stay readable.\n- Published cost and variance figures overstated what was measured. The README mode table's \"Cost\" column is a nominal sub-agent ratio, not token or dollar cost, and Trias can reach 7 dispatches on a deadlock retry. The skill reference described a 40% categorical flip rate and a 0.12–0.18 score spread as findings; the experiment saw 2 flips in 5 paired runs and a 0.038 mean spread, in a region that excluded the 0.7–0.9 veto band.","first_commit":"2026-10-19","last_commit":"2026-10-19"},{"version":"v1.15.8","date":"2026-10-18","headline":"","body":"### Fixed\n- The confidence-calibration gate scored every OK/BAD/OVR row, including OK rows assigned at log time from confidence itself, and counted a user override (OVR) as a failure. It now uses only `[confirmed]` OK and BAD rows, never scores OVR, reports what it left out (`excluded`: unconfirmed, overridden, untagged, unresolved), and a corpus with no confirmed rows gives `INSUFFICIENT_DATA` with zero resolved.\n- `feedback.py`'s success rate counted the same unconfirmed rows; it is now computed over confirmed OK/BAD only and states how many were excluded.\n- The prior-deliberation match ignored later evidence: a confirmed BAD or OVR after the OK did not stop `priors.py --label` from offering the old approach, and an OK with no run on disk could still match. A newer confirmed BAD/OVR now retires the match and is reported as `prior_contradiction`; when runs are consulted, the OK row needs a run on disk with the same date and `chosen_approach`.","first_commit":"2026-10-19","last_commit":"2026-10-19"},{"version":"v1.15.7","date":"2026-10-18","headline":"","body":"### Fixed\n- `SKILL.md` and `modes/confidence.md` told the caller to log a below-floor run with `--outcome WEAK`, which `log_feedback.py` rejects, so the documented step failed with a CLI error. Added `log_feedback.py --weak`: it adds a `[weak]` note marker and leaves the row `PEND`, since WEAK is advisory quality metadata, not an observed outcome.\n- The README and `SKILL.md` called the three voices \"independent\". In Sequential they are roles in one shared context; only Trias isolates its passes in separate sub-agents. The wording now says so.","first_commit":"2026-10-19","last_commit":"2026-10-19"},{"version":"v1.15.6","date":"2026-10-18","headline":"","body":"### Fixed\n- An invalid, never-evaluated or vetoed candidate could become the normal recommendation. `conservative_override` (the Step 5 default) ranked a candidate Control had rejected (`valid: false` / control score 0) on its generator and safety scores alone; the `sequential` cascade aggregated the Generator's `preferred` without looking at Control's verdict or the Conservator's `net_concern`. Now `conservative_override` vetoes Control-rejected candidates (`reason: control_invalid`), and `sequential` returns REWORK (`preferred_inadmissible`) for an inadmissible `preferred` unless an explicit `waiver` `{id, reason}` is supplied, which is recorded in `admissibility.waived`. `validate_report.py` rejects a report whose chosen candidate its own log shows to be inadmissible, absent a recorded waiver; older runs without the `admissibility` block stay readable.","first_commit":"2026-10-19","last_commit":"2026-10-19"},{"version":"v1.15.5","date":"2026-10-18","headline":"","body":"### Fixed\n- `FEEDBACK.html` and its `runs/.run_path_map.json` sidecar were updated by read-modify-write cycles with no mutual exclusion: concurrent `log_feedback.py` appends, an outcome upgrade, `mark_outcome.py` and `audit_feedback.py --backfill` overwrote each other (9 concurrent writers kept 3 rows in a reproduction). All writers now run their whole parse -> write sequence under a new cross-process `feedback_lock`.\n- `log_feedback.py` saved the sidecar entry before the row, so a failure in between left a sidecar entry vouching for a row that did not exist, and `priors.py` then reported nothing missing. The row is now written first, a retry adopts a row left without its sidecar entry, and `priors.py` counts a sidecar entry only when a FEEDBACK row with that fingerprint exists.","first_commit":"2026-10-19","last_commit":"2026-10-19"},{"version":"v1.15.4","date":"2026-10-18","headline":"","body":"### Fixed\n- The red→green gate (`implement_pipeline.py --verify-gate`) wrote the stub bodies over the real target files and restored them in a `finally` block, so a SIGTERM or hard kill during the RED run left the sources stubbed. The RED run now happens in a temporary copy of the working directory and the originals are never written. Targets must be under the working directory.\n- The gate counted any non-zero exit as RED, so a syntax error, a collection error or an unavailable test tool could pass it, and the stub was always inserted at header indent + 4, which is an `IndentationError` on a 2-space or tab-indented file. The stub now sits at the body's own indent, an uncompilable stub is rejected before any run, and a RED needs the stub's exception in the suite output. The gate JSON gains `red_reason`.","first_commit":"2026-10-19","last_commit":"2026-10-19"},{"version":"v1.15.3","date":"2026-10-18","headline":"","body":"### Fixed\n- `priors.py --label` matched any recent `OK` row, including ones whose outcome was assigned at log time without evidence. Because a match lets the caller skip re-deliberation, it now requires the `[confirmed]` marker, the same filter the rates already use. An unconfirmed newer `OK` no longer shadows an older confirmed one.","first_commit":"2026-10-13","last_commit":"2026-10-18"},{"version":"v1.15.2","date":"2026-10-13","headline":"","body":"### Fixed\n- The two sub-agents ran scripts with `cd \"$CONSILIUM_PATH\" && python scripts/...`. Since 1.13.1 the scripts keep state in `.consilium/` under the current directory, so a deliberation or implementation dispatched as a sub-agent wrote its report and journal into the install directory (the plugin cache, replaced on every update), and `implement_pipeline.py --input` could not find a report given relative to the project. Both agents now stay in the project directory and call each script by its full path, `\"$CONSILIUM_PATH/scripts/<name>.py\"`.\n- `consilium-subagent` looked for the skill only in `~/.claude/skills/consilium`, so it failed for a plugin install. It now resolves the path like `consilium-implement-subagent`: an already-set `CONSILIUM_PATH`, the manual skill install, the newest plugin-cache version, then the current directory.\n\n### Changed\n- `SKILL.md` and the plugin README name the `CONSILIUM_DATA_DIR` environment variable in words rather than as `$CONSILIUM_DATA_DIR`, which an install-time scan read as the skill reading a credential from the installer's environment.\n\n### Added\n- `test_plugin_folder.py` fails if an agent `cd`s into `$CONSILIUM_PATH`.","first_commit":"2026-09-30","last_commit":"2026-10-13"},{"version":"v1.15.1","date":"2026-10-13","headline":"","body":"### Added\n- `consilium/.claude-plugin/icon.png` (1024 x 1024, 74 KiB): the three voices in their explainer colours (Generator amber, Control blue, Conservator red) converging on one decision, a check on a dark disc, on the explainer's paper background. A plugin-directory listing takes its icon from the first submission and does not change it afterwards, so it is committed before one.\n- `test_plugin_folder.py` allows the icon and skips binary images in its text scans.","first_commit":"2026-10-13","last_commit":"2026-10-13"},{"version":"v1.15.0","date":"2026-10-13","headline":"","body":"### Changed\n- License: Apache License 2.0 instead of the Business Source License 1.1, for the repository and the shipped plugin (`LICENSE`, `consilium/LICENSE`, `plugin.json`). Apache-2.0 was already the BSL's Change License; any organization may now use Consilium, commercially included. Versions up to 1.14.0 stay under BSL-1.1.\n\n### Added\n- `scripts/reqmap_engine/LICENSE`: the MIT license of the vendored requirement-map engine (from requirement-manager), kept next to the copied code.","first_commit":"2026-10-13","last_commit":"2026-10-13"},{"version":"v1.14.0","date":"2026-10-13","headline":"","body":"### Changed\n- The plugin now lives in `consilium/` (manifest, `SKILL.md`, agents, prompts, modes, the 25 runtime scripts and the three docs they cite, a plugin README and `LICENSE`). An install receives only this folder: about 50 files instead of the whole repository, with no tests, repo tooling, hooks, generated HTML or contributor guidance. The marketplace at the repo root points at it (`source: ./consilium`), so `/plugin marketplace add alxmax/Consilium` keeps working; with APM, install `alxmax/Consilium/consilium`.\n- Tests, gates and repo tooling stay in `scripts/` and reach the plugin through `scripts/plugin_paths.py`. `check_doc_drift.py` resolves each normative doc's references against its own location, so a repo-root doc that names a moved script fails instead of passing.\n- `version.py --drift` lists changed prompt and mode files relative to the plugin folder (`git diff --relative`).\n- Five runtime scripts wrote the byte-order mark they strip from stdin as a literal invisible character; it is now the escape `\"﻿\"` (same behaviour).\n\n### Added\n- `scripts/test_plugin_folder.py`: the plugin folder holds only allowed paths, no tests, no file over 256 KiB, no `git push`/`git commit`, no remote `<script src>`, and no invisible format characters.","first_commit":"2026-10-13","last_commit":"2026-10-13"},{"version":"v1.13.1","date":"2026-10-13","headline":"","body":"### Fixed\n- Deliberation state (`runs/`, `FEEDBACK.html`, `preview/`) was resolved next to the installed scripts, not in the user's project. For a plugin install the journal lived in the versioned plugin cache, so every update started an empty journal and `priors.py` lost its history, while the orchestrator wrote reports to the project's `.consilium/runs/`. `scripts/utils.py` now resolves `DATA_DIR` to `$CONSILIUM_DATA_DIR` when set, otherwise `.consilium/` in the current working directory; `scripts/vote_degeneracy.py` uses the same rule. The development checkout is unchanged (its cwd is the repo root). Journals left in old plugin cache directories are not migrated: point `CONSILIUM_DATA_DIR` at one, or copy it into a project's `.consilium/`, to keep its history.","first_commit":"2026-10-13","last_commit":"2026-10-13"},{"version":"v1.13.0","date":"2026-10-13","headline":"","body":"### Changed\n- Development now happens in this public repository, renamed from `Consilium_Demo` to `Consilium`. The former private development repository is archived; `homepage`, `repository`, the README install command, the explainer's repository link and `REQMAP_REPO` now name `alxmax/Consilium`, and the Pages site is at `https://alxmax.github.io/Consilium/`.\n- `scripts/check_public_leak.py` now flags references to the archived dev repository by its own slug, instead of every `alxmax/Consilium` slug that is not the old `_Demo` name.\n\n### Removed\n- `benchmark/`: the mode-vs-baseline harness moved to its own repository, [Consilium-Benchmark](https://github.com/alxmax/Consilium-Benchmark), so installing the plugin no longer ships it. It loads this plugin from a sibling checkout (`--plugin-dir`); `scripts/fix_benchmark_pendings.py` stays here because the harness calls it.","first_commit":"2026-10-13","last_commit":"2026-10-13"}]}],"commands":[{"name":"init","group":"author","summary":"First-use bootstrap: scaffold requirements/ and .reqmapignore if missing, draft requirements from existing code and prose, build the lock and map, and print guided next steps. Idempotent — safe to re-run; never clobbers an existing .reqmapignore. --plan emits the extraction plan as JSON and writes no requirement files, for looking before authoring. --watch REF prints draft suggestions for code files changed since REF, and the commit subjects in between, and writes nothing. --propose TEXT prints one requirement draft for a person to confirm, and writes nothing.","arg":null,"flags":[{"flag":"--plan","help":"Emit the extraction plan as JSON instead of writing requirement files."},{"flag":"--out","help":"With --plan: write the plan JSON here ('-' or omitted = stdout)."},{"flag":"--md-glob","help":"With --plan: also scan these non-code globs for capabilities (repeatable)."},{"flag":"--wipe","help":"Hard-reset: delete all non-generated requirements and strip membership tags from source files before re-extracting."},{"flag":"--minimal","help":"Skip planning, release, MCP and site scaffolding."},{"flag":"--no-site","help":"Skip the final site step (scaffolding docs/architecture.html)."},{"flag":"--watch","help":"Print draft suggestions for code files changed since this git ref, and the commit subjects in between. Writes nothing and exits 0."},{"flag":"--propose","help":"Print one requirement draft from this description. status stays draft. Writes nothing."},{"flag":"--propose-files","help":"With --propose: comma-separated paths the draft is about."}]},{"name":"gate","group":"read","summary":"The commit/CI verdict. Bare, it verifies that every code tag resolves to a real requirement, that every confirmed requirement has at least one implements: member, and that drift has not been introduced since the last sync, then checks requirement readability and map freshness. Exits non-zero on link-sync errors only. Never writes anything. Three mode flags report on the verdict's own subject instead of running it: --audit for the whole problem report, --risk for what to do next, --show for one requirement's dossier. Every other question is `ask`.","arg":null,"flags":[{"flag":"--audit","help":"Print every pass that discovers a problem as one report: the gate, corpus risk, duplicate contracts and tag coverage. The exit code still comes from the gate alone."},{"flag":"--risk","help":"Print the corpus risk snapshot and the actionable signals, most urgent first."},{"flag":"--show","help":"Print one requirement's dossier: intent, contract, dependencies both ways, code members with file:line, open questions and risk signals."},{"flag":"--all","help":"With --risk: expand every bucket instead of the top few."},{"flag":"--untagged","help":"With --risk: report membership-tag coverage per directory."},{"flag":"--badge","help":"With --risk: print the coherence score as a badge string."},{"flag":"--strict","help":"Promote drift and test-link integrity warnings to errors. Useful in CI when all requirements are confirmed."},{"flag":"--json","help":"Emit structured JSON output instead of human-readable text."},{"flag":"--since","help":"Scope the gate to requirements whose member files changed since this git ref (e.g. 'main', 'HEAD~1')."},{"flag":"--no-lint","help":"Skip the requirement readability check."},{"flag":"--no-map-check","help":"Skip the committed-map freshness check."},{"flag":"--full","help":"Run every gate rule and print every readability warning. Bare, the gate runs only the rules that say a link, the drift baseline or the committed map is broken, and prints readability errors only."}]},{"name":"ask","group":"read","summary":"Ask the corpus a question without running the verdict. Read-only, never writes, and its exit code is the question's, never the gate's: --search ranks requirements by relevance, --dupes ranks overlapping contracts, --design reviews the code against the OOP pillars, --review emits the machine-readable review plan. Exactly one mode per call. Since v8.0.0, `gate` refuses these flags and names `ask`.","arg":null,"flags":[{"flag":"--search","help":"Rank requirements by lexical relevance to a free-text query."},{"flag":"--dupes","help":"Rank requirement pairs whose contracts overlap, most similar first."},{"flag":"--design","help":"Advisory design review of the code: encapsulation, abstraction, inheritance and polymorphism candidates plus file length and line width, grouped by pillar. Read-only, exit 0, never the gate."},{"flag":"--review","help":"Emit the deterministic review plan as JSON: for one requirement, or with no id for the whole corpus."},{"flag":"--i18n","help":"Removed in v8.2.0 (ADR-0047): accepted and ignored, refused from v9.0.0."},{"flag":"--top","help":"With --search or --dupes: how many results to print."},{"flag":"--threshold","help":"With --dupes: override the similarity threshold."},{"flag":"--json","help":"Emit structured JSON output instead of human-readable text."}]},{"name":"sync","group":"build","summary":"The write path. Rescan code members, advance the drift baseline, and regenerate the map, the findings file and the generated integration artifacts in one step. Run after editing requirement files or tagging new code members. --accept-drift is required when a confirmed or implemented contract changed.","arg":null,"flags":[{"flag":"--retire","help":"Take these requirements out of service instead of confirming them. Accepts one id or many; a batch retires in an order computed from the graph, under one working-tree check. Prints the blast radius; writes nothing without --apply."},{"flag":"--release","help":"Cut a release instead of syncing: the next version planned in _planning.json above what is already declared, or the vX.Y.Z named here. Prints the plan - version files to bump, the CHANGELOG entry, the milestone the plan drops - and writes nothing without --apply. With --json it also reports the declared version, whether its tag exists and its notes, which is what a release workflow reads."},{"flag":"--delete","help":"With --retire: also remove the block, its lock entries and its membership tags. Never a function body."},{"flag":"--apply","help":"With --retire or --release: actually write the change. Without it, the run is a dry report."},{"flag":"--force","help":"With --retire: proceed even though dependents still point at this requirement, or the working tree is dirty. Dependents that are already deprecated, and those retired in the same call, never block."},{"flag":"--findings","help":"Also regenerate the aggregated open-questions file."},{"flag":"--attach","help":"HTML page to refresh the site's engine-owned regions in (scaffolds it if absent). Without it, `sync` refreshes docs/architecture.html when that exists."},{"flag":"--accept-drift","help":"Explicitly advance the baseline when a confirmed or implemented contract changed. Required when those contracts differ from the lock; sync exits non-zero without it. Takes an optional reason, recorded in requirements/_driftlog.json so the waiver and its justification land in the diff."},{"flag":"--strict","help":"Promote drift and test-link integrity from warn to error."},{"flag":"--json","help":"With --retire or --release: emit the plan as JSON."}]},{"name":"clarify","group":"author","summary":"Ask what a requirement has not answered yet: vague terms with no threshold, numbers with no unit, clauses with no case, a missing failure path. Read-only, always exit 0, never a gate rule. --decompose is the write half of the same question: it splits a requirement into code-rung children along the bold group labels in its Description (--apply writes), or scaffolds one draft per over-long clause when it has none. Run it before implementing, so the ambiguity is resolved in the requirement instead of guessed in code.","arg":"AREA-NAME-NNN","flags":[{"flag":"--decompose","help":"Split a requirement into code-rung children along the bold group labels its author wrote in the Description; --apply writes them and never edits the parent.
