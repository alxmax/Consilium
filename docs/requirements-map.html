one of `3-0`, `2-1`, `2-0`, `1-1-1`, `0-0-0` — from three personality sub-agents' chosen-IDs.","The `sequential` scheme is the authoritative single-context aggregation path: it applies a priority-ordered veto cascade (`glossary_fail` -> `irreversibility_flag` -> `escalate` -> `rework` -> `adapt_short`/`extend` -> `aggregate`) over raw voice output dicts rather than numeric scores.","`aggregator.py` reads input from stdin, or from the file named by `--input` (default: stdin), as a JSON object with a `candidates` array and optional `weights`, `veto_threshold`, `personalities` keys; the exact schema varies by scheme.","`aggregator.py` writes a JSON object to stdout with `scheme`, `chosen`, and `ranking`, plus scheme-specific fields drawn from `vetoed`, `vote_pattern`, `dissent`, `retry_suggested`, `low_separation`, `veto_uncertain`.","`aggregator.py` exits 0 on success and exits non-zero (a raised `ValueError`) on invalid input.","`conservative_override` with `auto_relax=False`, when all candidates are vetoed, returns `{\"chosen\": null, \"reason\": \"all candidates vetoed by conservator or rejected by Control\", \"vetoed\": [...]}` with no `retry_suggested` field.","`conservative_override` also excludes a candidate Control did not clear — `valid: false`, or a `control` score of 0 or less (the encoding `build_report.py` gives an invalid or never-evaluated candidate) — and lists it in `vetoed` with `reason: \"control_invalid\"`. When no candidate passed Control the result sets `escalation_required` and no `retry_suggested`, since relaxing the risk threshold cannot help.","The `sequential` scheme runs an admissibility check on the Generator's `preferred` before AGGREGATE: no Control verdict (`not_evaluated`), a verdict that is not `valid: true` (`invalid`), or `net_concern` above `0.8` (`vetoed`, strict) yields `REWORK` with `reason: \"preferred_inadmissible\"`, `chosen: null`, `inadmissible_reasons` and the `admissible_alternatives`. An optional `waiver` `{id, reason}` (non-empty reason, naming the preferred id) lets the pick proceed and is recorded in `admissibility.waived`. `scale_down` skips Control by design and is exempt. Every successful `sequential` and `conservative_override` result carries `admissibility: {checked: true}`.","The `sequential` scheme's input schema is three top-level keys — `generator`, `control`, `conservator` — holding raw voice output dicts; the function reads only the raw-dict keys (`glossary_fail`, `disagreements`, `scores[]`, `preferred`, `abstain`). No mixed numeric-score input is defined; passing numeric scores alongside raw dicts is undefined behavior.","All seven sequential routing outcomes (BLOCK/glossary_fail, BLOCK/irreversibility_no_consent, ESCALATE, REWORK, ADAPT_SHORT, ADAPT_EXTENDED, AGGREGATE) are tested in `scripts/test_round2.py`."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a candidates list where every candidate's Conservator score exceeds `veto_threshold` and `auto_relax=True`, when `conservative_override` runs, then the output contains `chosen: null` and a non-empty `retry_suggested` block.\n- **CASE-2** — Given two candidates with identical generator and control scores but different Conservator risk, when `conservative_override` ranks them, then the candidate with lower risk ranks first.\n- **CASE-3** — Given `vote_pattern='2-1'` with three personalities where two of them choose the same candidate, when `team_vote` runs, then `chosen` equals the majority candidate and `dissent` is non-empty.\n- **CASE-4** — Given sequential input where `control_out['glossary_fail']` is `True`, when the `sequential` scheme runs, then the output has `result: BLOCK` and `reason: glossary_fail`, regardless of other signals.\n- **CASE-5** — Given three or more simultaneous triggers, when the `sequential` scheme runs, then the output has `result: ESCALATE` with a `triggers` list of length >= 3.\n- **CASE-6** — Given a sequential input whose preferred candidate has `valid: false`, no Control verdict, or `net_concern` above 0.8, when `sequential` runs, then the result is `REWORK` with `chosen: null`; with a matching `waiver` the result is `AGGREGATE` and `admissibility.waived` records the reason.\n- **CASE-7** — Given a candidate with the best generator and safety scores but a `control` score of 0, when `conservative_override` runs, then it is not chosen and appears in `vetoed` with `reason: \"control_invalid\"`.","input":"","output":"","desc":"","depends_on":["CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-REPORT-001","CONSILIUM-MODE-SEQUENTIAL-001","SKILL-RUN-CONSILIUM-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/modes/aggregator_schemes.md:56"},{"role":"implements","loc":"consilium/scripts/aggregator.py:34"},{"role":"tested-by","loc":"scripts/test_round2.py:7"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"vague-term","severity":"advisory","basis":"wording","where":"clause 4","quote":"The `risk_adjusted_utility` scheme applies a smooth sigmoid penalty instead of a hard veto, so candidates clustered near the threshold rank gracefully.","question":"What is the measurable threshold behind \"gracefully\"?","suggest":"Replace it with a number and a unit, or with the observable condition it stands for."},{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"7 clause(s) have no case: there are 14 clauses and 7 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-AUDIT-COUNTER-001","layer":"feature","level":"code","status":"deprecated","area":"CONSILIUM","title":"Silent parallel audit counter","intent":"Tracks sequential deliberation runs and determines when a silent parallel cross-check is due, implementing the adaptive-cadence claim from SKILL.md §\"Silent parallel audit\".","contract":["Shall increment a persistent counter (`--increment`) after each sequential deliberation step 6 completes.","Shall report whether the current run is due for a silent parallel cross-check (`--check`), returning `{\"should_audit\": bool, \"sequential_count\": int, \"frequency\": int, ...}`.","Shall accept a divergence result (`--record-divergence 0|1`) and update the rolling 5-audit window; adapt frequency: if ≥2 divergences in the window and frequency=20, set frequency=5; if 0 divergences in a full window of 5 audits and frequency=5, restore to frequency=20.","`--check` shall return `should_audit: false` in headless contexts (`CLAUDE_HEADLESS=1`) even if the run is numerically due.","Prior-deliberation passthrough runs shall NOT increment the counter (they bypass both pipelines).","State shall be stored in `.consilium/audit_state.json` (gitignored).","The rolling window of 5 audits is intentionally fixed (not configurable) to maintain calibration stability across the follow-up audit cycle (SKILL.md §\"Silent parallel audit\")."],"verify":["None — contract matches docstring and SKILL.md §\"Silent parallel audit\" exactly."],"notes":[],"current_impl":["scripts/audit_counter.py"],"accept":"- Given a fresh state, after 20 `--increment` calls, `--check` returns `should_audit: true`.\n- Given `should_audit: true` and `--record-divergence 1` twice (plus 3 zeros), frequency stays at 20 (needs ≥2 in window); given two more divergences, frequency flips to 5.\n- Given `CLAUDE_HEADLESS=1`, `--check` returns `should_audit: false` regardless of count.\n- Given `--status`, output contains `sequential_count`, `frequency`, `audit_count`, and `recent_divergences`.","input":"","output":"","desc":"","depends_on":["CONSILIUM-UTILS-001"],"used_by":[],"satisfies":[],"satisfied_by":[],"members":[],"test_exempt":null,"milestone":null,"priority":"","risks":[],"clarify":[]},{"id":"CONSILIUM-AUDIT-FEEDBACK-001","layer":"feature","level":"code","status":"draft","area":"CONSILIUM","title":"Orphan run detection and PEND backfill","intent":"Finds `.consilium/runs/*.json` files that have no matching row in `FEEDBACK.html` (orphans created when step 6 log is skipped) and optionally backfills them with default PEND rows so `priors.py` can surface them.","contract":["Without flags, `audit_feedback.py` lists orphan runs (runs with no FEEDBACK.html row) and exits 0.","With `--backfill`, `audit_feedback.py` appends one PEND row per orphan to `FEEDBACK.html`, using the same note-derivation as `log_feedback.py`.","`--backfill` reads and writes FEEDBACK.html and the sidecar under `feedback_lock`, so it cannot drop a row a concurrent `log_feedback.py` appends.","`audit_feedback.py` never overwrites an existing row — a run is considered matched if any row shares the same date AND chosen_approach prefix.","With `--dry-run`, `audit_feedback.py` prints the rows that would be appended without writing.","Backfill outcome is always PEND (never retroactively OK); the user closes them via the standard PEND→OK/BAD prompt at the next step 0."],"verify":["None — contract matches docstring and SKILL.md Step 0 prose exactly."],"notes":[],"current_impl":["consilium/scripts/audit_feedback.py"],"accept":"- Given a run file with no FEEDBACK row, `audit_feedback.py` lists it; `--backfill` appends a PEND row; re-run lists nothing (idempotent).\n- Given a run file with an existing row, `--backfill` does not duplicate it.\n- Given `--dry-run`, no write occurs to FEEDBACK.html.","input":"","output":"","desc":"","depends_on":["CONSILIUM-FEEDBACK-001","CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-LEARNING-001"],"satisfies":["ARCH-CONSILIUM-LEARNING-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/audit_feedback.py:30"}],"test_exempt":"integration-only — depends on live FEEDBACK.html + runs/; acceptance-tested via --dry-run and manual backfill","milestone":null,"priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"3 clause(s) have no case: there are 6 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-BUILD-REPORT-001","layer":"feature","level":"code","status":"draft","area":"CONSILIUM","title":"build_report","intent":"Assembles the canonical deliberation report shape from intermediate voice/aggregation outputs.","contract":["`build_report.py` assembles the canonical deliberation report shape from an input JSON bundle containing `success_criterion`, `verification`, `generator`, `control`, `conservator`, `aggregate`, and `confidence`.","Missing any of those required keys exits with code 1.","`build_report.py` reads the bundle from stdin, or from the file named by `--input` (default: stdin).","`--input` and stdin are mutually exclusive by argparse design: `FileType` defaults to stdin, and providing `--input` opens the file instead. No conflict resolution is needed.","`build_report.py` extracts `voice_scores` for the chosen candidate from the Control verdict and the Conservator score lists.","`build_report.py` derives a `why_not` summary for each non-chosen alternative from Control issues and Conservator risk: an invalid control verdict lists its issue categories; a valid verdict with issues uses the first issue's detail; a Conservator `net_concern >= 0.5` appends `risk=N.NN`.","When neither source yields text, `why_not` falls back to `\"ranked below chosen\"`, or to `\"all candidates vetoed\"` when `chosen` is null.","`build_report.py` stamps `consilium_version` and `consilium_ref` from the version module into the telemetry block of every non-skipped report it emits.","A non-skipped report whose telemetry lacks an integer `dispatch_count`, or has no measured latency (a `latency_ms` above 0 at the top level or on any voice), is marked `telemetry_incomplete: true` with `telemetry_gaps` naming what is missing (`dispatch_count`, `latency_ms`). It is marked, not rejected, so older runs and hand-built bundles stay readable.","Skipped reports (trivial-direct, prior-deliberation passthrough) go through a separate code path that requires only `skip_reason` and `signals`.","`pipeline_executed` is absent on skipped reports; `validate_report.py` skips that field check entirely when `skipped: true`. Full-pipeline reports always set `pipeline_executed: true`.","`validate_report.py` gates every report before the orchestrator writes it to `.consilium/runs/`.","`build_report.py` writes to stdout a canonical JSON report with fields `success_criterion`, `verification`, `chosen_approach`, `reasoning`, `alternatives`, `voice_scores`, `confidence`, `pipeline_executed`, `deliberation_log`, `telemetry`, and optional Trias fields (`team`, `personalities`, `vote_pattern`, `dissent`, `abstained`, `personality_choices`).","`build_report.py` exits 0 on success, exits 1 on a missing required field, and exits 2 on malformed JSON input."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a well-formed full bundle, when `build_report.py` runs, then the output contains `pipeline_executed: true` and a `deliberation_log` array with entries for the `generator`, `control`, `conservator`, and `aggregate` steps.\n- **CASE-2** — Given a skipped bundle (`skipped: true`) with a valid `skip_reason`, when `build_report.py` runs, then the output contains `chosen_approach: skipped`, `pipeline_executed` absent or false, and `deliberation_log: []`.\n- **CASE-3** — Given a bundle where the chosen candidate's control verdict has `valid=false` with issues, when `build_report.py` runs, then `voice_scores.control` is below 1.0 and the alternatives list a `why_not` string derived from those issues.\n- **CASE-4** — Given any valid bundle, when `build_report.py` runs, then the telemetry block contains a non-empty `consilium_version` and a `consilium_ref` that is either the committed HEAD sha or `\"\"` on a dirty/unknown tree (the version-module contract — see CONSILIUM-VERSION-001), both stamped by the version module.\n- **CASE-5** — Given a bundle missing `success_criterion`, when `build_report.py` runs, then it exits with code 1 and prints an error to stderr without writing any JSON to stdout.\n- **CASE-5** — Given a full bundle whose telemetry has no `dispatch_count` and no measured latency, when `build_report.py` runs, then the report carries `telemetry_incomplete: true` and `telemetry_gaps: [\"dispatch_count\", \"latency_ms\"]`; with both present the keys are absent.","input":"","output":"","desc":"","depends_on":["CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-REPORT-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/build_report.py:46"},{"role":"tested-by","loc":"scripts/test_build_report.py:11"},{"role":"tested-by","loc":"scripts/test_version.py:104"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"8 clause(s) have no case: there are 14 clauses and 6 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-CHECK-DOC-DRIFT-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"check_doc_drift","intent":"Enforces parity between authoritative behavior (SKILL.md, confidence.py) and the docs/diagrams.","contract":["`check_doc_drift.py` enforces parity between the authoritative behavior (`SKILL.md`, `consilium/scripts/confidence.py`) and the human-readable documentation (`modes/*.md`, `docs/architecture/src/*.jsx`).","This prevents the class of silent drift found in the design audit of 2026-05-28, where four discrepancies had accumulated undetected.","`check_doc_drift.py` runs seven independent check families.","The first family is text-based regex invariants: required/forbidden patterns in specific files.","The second family is Trias confidence parity, comparing `confidence.py`'s `VOTE_PATTERN_CONFIDENCE` dict (parsed via AST) against the `TRIAS_OUTCOMES` table in `trias.jsx` (parsed via regex).","The third family is legacy MODE alias removal milestone enforcement: dated removal comments accompany deprecated aliases in `validate_report.py`.","The fourth family is test-suite coverage: every `scripts/test_*.py` file appears in both `ci.yml` and the run-consilium driver.","The fifth family, CI_CHECKS completeness, requires every non-test `ci.yml` step to be represented in the architecture explainer's `CI_CHECKS` card list, matched by exact script basename; it was added 2026-07-06 after a Trias self-audit found the explainer's own \"what CI runs\" section had silently fallen behind `ci.yml` itself.","The sixth family, Trias personality-name parity, requires `consilium/scripts/personalities.py`'s `PERSONALITIES` names to match the explainer's `trias.jsx`/`modes.jsx` and the `make_full_architecture.py` poster generator; it was added 2026-07-06 after the v3 lens rename (PR #482) was found to have never touched those three files.","The seventh family, implement-pipeline spec alignment, requires `modes/implement_pipeline.md`'s `subagents`/`cost_multiplier` frontmatter to be stated explicitly in the \"Code integration pipeline\" explainer section's `GATE_ITEMS`; it was added 2026-07-06 after that section was found to be the only mode/flag whose headline sub-agent count and cost multiplier weren't shown anywhere in its own text.","The CI_CHECKS completeness, personality-name parity, and implement-pipeline alignment families are specified in [[CONSILIUM-CHECK-DOC-DRIFT-EXPLAINER-001]].","`check_doc_drift.py` is intended to run before any commit that touches `modes/`, `docs/architecture/src/`, `consilium/scripts/confidence.py`, `consilium/scripts/personalities.py`, `.github/workflows/ci.yml`, or `scripts/test_*.py`.","`check_doc_drift.py` reads `modes/trias.md` for the `trias_parallel_dispatch` and `trias_parallelism_runtime_audit` invariants.","`check_doc_drift.py` reads `modes/sequential.md` for the `sequential_scale_down_skips_control` and `sequential_generator_first` invariants.","`check_doc_drift.py` reads `docs/architecture/src/modes.jsx` for the `trias_tally_caption_confidence` and `explainer_modes_voices_generator_first` invariants, and for the Trias spec-alignment worst-case check.","`check_doc_drift.py` reads `docs/architecture/src/trias.jsx` for the `TRIAS_OUTCOMES` confidence parity check.","`check_doc_drift.py` reads `docs/architecture/src/extras.jsx` for the Trias spec-alignment check (the CostScatter TRI entry and the CostBars trias row).","`check_doc_drift.py` reads `SKILL.md` for the `skill_templates_have_pipeline_executed` invariant.","`check_doc_drift.py` reads `consilium/scripts/build_report.py` for the `build_report_emits_pipeline_executed` invariant.","`check_doc_drift.py` AST-parses `consilium/scripts/confidence.py` for the `VOTE_PATTERN_CONFIDENCE` dict values.","`check_doc_drift.py` reads `consilium/scripts/validate_report.py` for the legacy MODE alias removal milestone check.","`check_doc_drift.py` reads `.github/workflows/ci.yml` and `.claude/skills/run-consilium/driver.py` for the test-suite coverage check.","`check_doc_drift.py` globs `scripts/test_*.py` to enumerate all test suites requiring coverage.","`check_doc_drift.py` parses `.github/workflows/ci.yml` and `docs/architecture/src/extras.jsx` for the `ci_checks_completeness` check.","`check_doc_drift.py` AST-parses `consilium/scripts/personalities.py` for the `PERSONALITIES` list (name SSOT), used by the `trias_personality_name_parity` check.","`check_doc_drift.py` regex-scans `docs/architecture/src/trias.jsx`, `docs/architecture/src/modes.jsx`, and `scripts/make_full_architecture.py` for Trias personality names, comparing them against `personalities.py`.","`check_doc_drift.py` regex-parses `modes/implement_pipeline.md` for the `subagents`/`cost_multiplier` frontmatter (SSOT), used by the `implement_pipeline_spec_alignment` check.","`check_doc_drift.py` scans `docs/architecture/src/extras.jsx`'s `GATE_ITEMS` array (ImplementSection) for the matching sub-agent-count / cost-multiplier strings.","`check_doc_drift.py` prints `doc-drift OK: all invariants hold` to stdout when all checks pass.","On failure, `check_doc_drift.py` prints a numbered list of violated invariants to stderr, each with its pattern, source, and rationale.","`check_doc_drift.py` exits 0 when all invariants pass, exits 1 when one or more are violated, and exits 2 when a required input file is missing.","Test-suite coverage uses plain substring match on the filename only (e.g., `test_round2.py`); a commented-out line that still contains the filename string passes the check — the script does not distinguish commented-out from active.","The legacy MODE alias removal milestone date is ISO `YYYY-MM-DD` and appears within 200 characters of the alias literal in `validate_report.py`; any comment syntax is accepted as long as the date string is present, and future dates are accepted — the check only skips once the alias has been removed from the file entirely.","When multiple invariants are violated, all violations are collected across all seven check families before any output; the script prints every violation (numbered) to stderr then exits 1 — it never stops at the first failure."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given all invariant patterns hold and `confidence.py`'s `VOTE_PATTERN_CONFIDENCE` matches `trias.jsx`'s `TRIAS_OUTCOMES` for patterns `3-0`/`2-1`/`2-0`, when `check_doc_drift.py` runs, then it exits 0 and prints the OK message.\n- **CASE-2** — Given the scale_down wording in `modes/sequential.md` regresses to \"Skip Generator AND Control\", when `check_doc_drift.py` runs, then the `sequential_scale_down_skips_control` invariant fails and the script exits 1.\n- **CASE-3** — Given `confidence.py`'s `VOTE_PATTERN_CONFIDENCE['2-1']` is changed to a value that differs from the `conf` field of the `2-1` row in `trias.jsx`'s `TRIAS_OUTCOMES`, when `check_doc_drift.py` runs, then the trias confidence parity check reports a failure.\n- **CASE-4** — Given a new `scripts/test_*.py` file added without a corresponding entry in `ci.yml`, when `check_doc_drift.py` runs, then the `test_suite_coverage` check fails and the script exits 1.\n- **CASE-5** — Given a required file listed in an invariant's `file` key is missing from disk, when `check_doc_drift.py` runs, then it exits 2 immediately.","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfies":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"scripts/check_doc_drift.py:26"},{"role":"tested-by","loc":"scripts/test_check_doc_drift.py:11"}],"test_exempt":"reads live source files and runs git — integration-only gate","milestone":"v1.1","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"28 clause(s) have no case: there are 33 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-CHECK-DOC-DRIFT-EXPLAINER-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"check_doc_drift — explainer parity checks","intent":"The three `check_doc_drift.py` check families that keep the architecture explainer (`docs/architecture/src/*.jsx`) in step with its sources of truth. All three are pure functions of file text, so they are unit-tested directly; the parent [[CONSILIUM-CHECK-DOC-DRIFT-001]] owns the integration-only families and the script's exit-code contract.","contract":["**CI_CHECKS completeness** (`check_ci_checks_completeness`): every named non-test `ci.yml` step is represented by a card in the explainer's `CI_CHECKS` list (`extras.jsx`), or by a named `ALLOWED_OUT_OF_SCOPE_CI_STEPS` entry.","The completeness check matches on the invoked script's exact basename (e.g. `reqmap.py`), not the full run-line. Two steps that share one script under different flags therefore resolve to one card.","`scripts/test_*.py` steps are always skipped, because the \"Unit suites\" card covers them generically. A step with no `scripts/*.py` or `docs/architecture/build.py` reference needs an `ALLOWED_OUT_OF_SCOPE_CI_STEPS` entry, or the check fails.","**Trias personality-name parity** (`check_trias_personality_name_parity`): the `PERSONALITIES` names in `consilium/scripts/personalities.py` (the single source of truth) match `trias.jsx`'s `LENSES`, `modes.jsx`'s personalities array and `make_full_architecture.py`'s `personalities_row`.","The name comparison is case-insensitive, since `personalities.py` uses lowercase and the explainer uses Title Case. Each of the three sources is compared separately, so a drift in one is reported for that file alone.","**Implement-pipeline spec alignment** (`check_implement_pipeline_spec_alignment`): the `subagents` and `cost_multiplier` frontmatter of `modes/implement_pipeline.md` both appear in `extras.jsx`'s `GATE_ITEMS` (the ImplementSection).","The alignment check formats the multiplier through `check_trias_spec_alignment`'s explicit `_COST_FMT` float→string map, never `f'{v}×'`. A missing count and a missing multiplier are reported as two independent failures."],"verify":["None - contract moved verbatim from CONSILIUM-CHECK-DOC-DRIFT-001, which the owner had confirmed."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a named `ci.yml` step invoking a script with no `CI_CHECKS` card and no `ALLOWED_OUT_OF_SCOPE_CI_STEPS` entry, when `check_ci_checks_completeness` runs, then it reports a failure naming the step and the script.\n- **CASE-2** — Given two `ci.yml` steps invoking the same script under different flags and one card naming that script, when `check_ci_checks_completeness` runs, then it reports no failure.\n- **CASE-3** — Given `trias.jsx`'s `LENSES`, `modes.jsx`'s personalities array or `make_full_architecture.py`'s `personalities_row` regressed to a retired name (e.g. `Pioneer`), when `check_trias_personality_name_parity` runs, then it reports a failure naming the offending file.\n- **CASE-4** — Given `extras.jsx`'s `GATE_ITEMS` missing the sub-agent-count or the cost-multiplier string, when `check_implement_pipeline_spec_alignment` runs, then it reports the matching failure(s). Given `modes/implement_pipeline.md` missing either frontmatter field, the script exits 2.","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfies":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"scripts/check_doc_drift.py:469"},{"role":"implements","loc":"scripts/check_doc_drift.py:899"},{"role":"implements","loc":"scripts/check_doc_drift.py:1144"},{"role":"tested-by","loc":"scripts/test_check_doc_drift.py:12"}],"test_exempt":null,"milestone":"v1.1","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"3 clause(s) have no case: there are 7 clauses and 4 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-CHECK-PUBLIC-LEAK-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"check_public_leak","intent":"Fails CI if any git-tracked file references the private repo or a local developer path.","contract":["`check_public_leak.py` scans all files tracked by `git ls-files` in the current working directory; it takes no CLI flags and runs unconditionally.","`check_public_leak.py` guards the public repository against accidentally referencing the archived private development repository, or leaking local developer paths.","`check_public_leak.py` scans every git-tracked text file for two compiled regex patterns: a reference to the archived private dev repo (its owner/name slug; the public repo's own slug is allowed), and an absolute local path under the author's working tree.","The exact patterns live in the source; this doc deliberately does not quote them, because doing so would itself trip the guard.","Binary and image file extensions are skipped.","The guard file itself is excluded from its own scan.","The check is wired into CI and fails with exit 1, printing the offending `file:line: description: match` tuples to stderr, making private-repo references un-shippable rather than a silent leak.","`check_public_leak.py` prints `public-leak guard: clean` to stdout on success.","On failure, it prints `file:line: description` strings to stderr.","`check_public_leak.py` exits 0 on clean, and 1 on any pattern match.","The `PATTERNS` constant and its inline comments are the sole specification for the regex patterns; there is no secondary config or spec file.","The skip list (`SKIP_SUFFIX`) is a heuristic hardcoded tuple of 11 extensions; a binary file committed with a `.txt` extension is not skipped — it is read with `errors=\"ignore\"` and scanned like any text file.","When run outside a git repository (`git ls-files` fails), the script raises an unhandled `subprocess.CalledProcessError` and exits 1 with a Python traceback to stderr — the same exit code as a leak find, but distinguishable by the traceback."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a repo with no private-repo or local-path references, when `check_public_leak.py` runs, then it exits 0 and prints `clean`.\n- **CASE-2** — Given a tracked file containing a private-repo reference, when `check_public_leak.py` runs, then it exits 1 with the file and line number printed to stderr.\n- **CASE-3** — Given a tracked file containing an absolute local developer path, when `check_public_leak.py` runs, then it exits 1 with the offending location reported.\n- **CASE-4** — Given binary and image files (`.png`, `.woff`) that match the patterns byte-for-byte, when `check_public_leak.py` runs, then those files are skipped.\n- **CASE-5** — Given the guard script itself (`check_public_leak.py`), when it scans the repo, then it excludes itself from the scan and never self-reports.","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfies":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"scripts/check_public_leak.py:15"},{"role":"tested-by","loc":"scripts/test_public_leak.py:12"}],"test_exempt":null,"milestone":"v1.2","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"8 clause(s) have no case: there are 13 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-CHECK-VERSIONS-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"check_versions","intent":"Fails CI if `plugin.json` and `marketplace.json` semver drift apart, or if the vendored engine's MAP_ENGINE_VERSION (`scripts/reqmap_engine/__init__.py`) is not a valid dated engine version.","contract":["`check_versions.py` is the single point that asserts the plugin's semver stays aligned across `consilium/.claude-plugin/plugin.json` and `.claude-plugin/marketplace.json`, since Claude Code reads both as static data and neither manifest can import the other to stay in sync automatically; drift fails the build instead of shipping silently.","`check_versions.py` mirrors `requirement-manager`'s `scripts/check_versions.py` (same mechanism, adopted 2026-07-06 after `marketplace.json` was found to have no `version` field at all while `plugin.json` had already drifted from an orphan `v1.4.0` git tag).","`MAP_ENGINE_VERSION` (in `scripts/reqmap_engine/__init__.py`) is checked independently: it is a staleness-compare date stamp for the requirement-map engine, not a semver, and it is never compared against the plugin version.","`plugin.json`'s `version` field is the canonical source; every `version` occurrence in `marketplace.json` (top-level and each `plugins[]` entry) equals it exactly, by string equality with no semver-range logic.","A non-dict entry in `marketplace.json`'s `plugins[]` array is reported as a readable diagnostic (exit 1), never an unhandled `AttributeError`.","`MAP_ENGINE_VERSION` matches `YYYY-MM-DD` optionally followed by `.N` (N a positive integer, same-day revision suffix); the regex anchor is line-start, so a docstring/comment mention preceding the real assignment cannot be matched instead.","`--fix` rewrites only `marketplace.json` (never `plugin.json`, which stays the hand-edited canonical source), and is a no-op (exit 0, no write) when already aligned.","`check_versions.py` reads `plugin.json`'s `version` field (the canonical semver source), `marketplace.json`'s top-level `version` and each `plugins[].version`, and `scripts/reqmap_engine/__init__.py`'s `MAP_ENGINE_VERSION` constant.","`check_versions.py` prints `OK  semver aligned at '<version>' across N location(s); engine MAP_ENGINE_VERSION = '<date>'` to stdout on success.","On drift, it prints `FAIL  version drift detected:` plus a per-location diff to stdout.","`check_versions.py` exits 0 when aligned, and exits 1 on drift.","`check_versions.py` exits 2 when a manifest or field is missing or unreadable."],"verify":["None — resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given aligned manifests (plugin, marketplace, and engine all valid), when `check_versions.py` runs, then it exits 0 (tested in `scripts/test_check_versions.py`).\n- **CASE-2** — Given a `marketplace.json` top-level or per-plugin-entry version mismatch, when `check_versions.py` runs, then it exits 1.\n- **CASE-3** — Given a missing `plugin.json` `version` field, when `check_versions.py` runs, then it exits 2.\n- **CASE-4** — Given a non-dict `plugins[]` entry, when `check_versions.py` runs, then it exits 1 without raising.\n- **CASE-5** — Given a `MAP_ENGINE_VERSION` docstring mention before the real assignment, when `check_versions.py` runs, then that mention is ignored by the anchored regex.\n- **CASE-6** — Given same-day revision suffixes (`.1`, `.2`, ...), when `check_versions.py` validates them, then they pass; `.0` and non-numeric suffixes do not.\n- **CASE-7** — Given `--fix` run against a drifted `marketplace.json`, when it propagates `plugin.json`'s version into both `marketplace.json` locations, then a subsequent unflagged run passes.","input":"","output":"","desc":"","depends_on":[],"used_by":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfies":["ARCH-CONSILIUM-REPO-GATES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"scripts/check_versions.py:30"},{"role":"tested-by","loc":"scripts/test_check_versions.py:8"}],"test_exempt":null,"milestone":"v1.4.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"5 clause(s) have no case: there are 12 clauses and 7 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-CONFIDENCE-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"confidence","intent":"Derives a calibrated confidence score from inter-voice agreement + runner-up separation (or Trias vote pattern).","contract":["`confidence.py` reads input from stdin, or from the file named by `--input` (default: stdin).","For score-based mode, the input is a JSON object with `candidates` (a list of `{id, scores: {generator, control, conservator}}`) and `chosen` (a string or null).","For Trias mode, the input is a JSON object with `vote_pattern` (e.g. `3-0`, `2-1`) and optional `dissent` and `abstained` lists, instead of `candidates`/`chosen`.","`confidence.py` reads `modes/*.md` frontmatter at import time to populate per-mode confidence floors from the `confidence_floor` key.","`confidence.py` derives a calibrated confidence score for a deliberation result from two complementary signals: inter-voice agreement on the chosen candidate, and separation from the runner-up candidate.","Agreement is measured as 1 minus the population stdev of the three voices after flipping Conservator from risk to safety, normalized against the theoretical maximum stdev.","Separation is the difference in mean utility between the chosen candidate and the runner-up; when there is only one candidate (no runner-up), separation defaults to `1.0`.","The two signals are blended as `0.7 * agreement + 0.3 * separation`, then clamped to `[0.05, 0.99]`.","For Trias mode, `confidence.py` bypasses voice-score arithmetic entirely and derives confidence from the democratic vote pattern via a hardcoded lookup table, `VOTE_PATTERN_CONFIDENCE`.","In Trias mode, `confidence.py` applies Sentinel-specific penalties: -0.10 when the conservative personality dissents, -0.15 when it abstains.","The dissent and abstain penalties apply only when the Sentinel personality is the dissenter/abstainer; Essentialist and Verifier dissent/abstain carry no penalty.","Sentinel (conservative-leaning, K=0.40) is the sole risk-anchor voice, and its absence from the majority signals a materially higher risk that the base vote-pattern score does not capture.","The `check_mode_floor` helper lets callers determine whether the derived confidence falls below the mode-specific floor loaded from `modes/*.md` frontmatter.","`check_mode_floor` exempts structurally decisive Trias vote patterns — `3-0`, `2-1`, `2-0` — from the WEAK flag.","The `2-0` exemption is intentional: `2-0` means one personality had all candidates vetoed (a veto, not a deadlock), and a winner still emerged, so the run is structurally decisive.","The lower base confidence for `2-0` (0.70 vs 0.75 for `2-1`) already encodes the stronger risk signal; flagging it WEAK on top would double-penalize the run.","`confidence.py` writes to stdout a JSON object with three fields: `confidence` (float or null), `agreement` (float), `separation` (float or null).","The stdout object may also carry optional `source` and `notes` fields.","When `chosen` is null or absent from `candidates`, the output is JSON with `confidence: null` and a `reason` string.","`confidence.py` exits 0 on success and exits 1 on an invalid input shape."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a chosen candidate with `generator=0.8`, `control=0.9`, `conservator=0.1` (high utility, low risk, high agreement) and no runner-up, when `confidence.py` runs, then the output confidence is close to 0.99 (agreement near 1.0, separation defaults to 1.0).\n- **CASE-2** — Given `chosen: null` in the input, when `confidence.py` runs, then the output is `{confidence: null, reason: \"...\"}` and the script exits 0.\n- **CASE-3** — Given `vote_pattern='2-1'` with a dissent list containing the Sentinel personality, when `confidence.py` runs, then the output confidence equals `VOTE_PATTERN_CONFIDENCE['2-1']` minus the `SENTINEL_DISSENT_PENALTY` (0.10), rounded to 3 decimal places.\n- **CASE-4** — Given `vote_pattern='3-0'`, when `check_mode_floor` runs with `mode='trias'`, then it returns `below_floor=false` regardless of the numeric floor, because `3-0` is in the decisive exempt set.\n- **CASE-5** — Given a candidates list where one candidate is missing the `scores` key, when `confidence.py` runs, then it exits 1 and prints a descriptive error to stderr before producing any output.","input":"","output":"","desc":"","depends_on":["CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-REPORT-001","SKILL-RUN-CONSILIUM-001"],"satisfies":["ARCH-CONSILIUM-REPORT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/modes/confidence.md:60"},{"role":"implements","loc":"consilium/scripts/confidence.py:57"},{"role":"tested-by","loc":"scripts/test_confidence.py:11"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"15 clause(s) have no case: there are 20 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-CONFIDENCE-CALIBRATION-001","layer":"feature","level":"code","status":"draft","area":"CONSILIUM","title":"confidence_calibration","intent":"Decides from logged outcomes whether high confidence actually predicts success, which is the evidence that lets Trias's post-vote Skeptic become confidence-gated (Variant C) instead of unconditional (Variant A).","contract":["`confidence_calibration.py` reads `.consilium/FEEDBACK.html` through `feedback.py`'s parser.","`confidence_calibration.py` keeps only rows that are resolved (`OK` as success, `BAD` as failure), carry the `[confirmed]` marker (outcomes assigned at log time without evidence would calibrate confidence against its own output) and have a `conf=<x>` value in their note. `OVR` is a user override, not an observed failure, so it is never scored.","Rows left out are counted, not dropped silently: the result carries `excluded` with `unconfirmed`, `overridden`, `untagged` and `unresolved` counts, and a corpus with no confirmed rows yields `INSUFFICIENT_DATA` with `resolved = 0`.","A row whose confidence lies outside 0.0–1.0, or whose outcome is still pending, is left out of every count.","The script splits the kept rows at `--gate` (default 0.7) into a low band and a high band and computes each band's OK-rate.","The verdict is `INSUFFICIENT_DATA` when there are fewer than 20 resolved rows, fewer than 10 failures, or fewer than 5 rows in either band. Each defaults to a flag.","Otherwise the verdict is `SHIP_C` when the high band beats the low band by at least `--margin` (default 0.15) and reaches `--high-floor` (default 0.75), and `FALLBACK_A` in every other case.","The script prints a per-bin table, or JSON under `--json`, and never writes a file."],"verify":["None - resolved 2026-09-27: the verdict is advisory. `modes/trias.md` now says switching the Trias default from A to C is a maintainer's edit made once this script returns `SHIP_C`; no code reads the verdict at dispatch time."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given entries mixing confirmed and unconfirmed resolved rows, overrides, pending and untagged rows, when `calibration_records` runs, then only the confirmed OK/BAD rows with a `conf=` value are returned.\n- **CASE-2** — Given records where the high band is clearly more successful than the low band, when `decide` runs, then the verdict is `SHIP_C`.\n- **CASE-3** — Given records where both bands succeed at the same rate, when `decide` runs, then the verdict is `FALLBACK_A`.\n- **CASE-4** — Given fewer resolved records than `min_resolved`, or no failures at all, when `decide` runs, then the verdict is `INSUFFICIENT_DATA`.","input":"","output":"","desc":"","depends_on":["CONSILIUM-FEEDBACK-001"],"used_by":["ARCH-CONSILIUM-LEARNING-001"],"satisfies":["ARCH-CONSILIUM-LEARNING-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/confidence_calibration.py:29"},{"role":"tested-by","loc":"scripts/test_confidence_calibration.py:10"}],"test_exempt":null,"milestone":"v1.1","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"4 clause(s) have no case: there are 8 clauses and 4 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-FEEDBACK-001","layer":"bus","level":"code","status":"draft","area":"CONSILIUM","title":"feedback","intent":"Canonical FEEDBACK.html parser + a human-readable stats report over logged outcomes.","contract":["`parse_feedback` parses `.consilium/FEEDBACK.html`, supporting three HTML row layouts for backward compatibility: attribute-based (`data-field`), and two legacy positional cell-count variants.","Layout precedence is strict: attribute-based (`data-field`) is tried first; positional fallback applies only when no `data-field` attributes are found, matched by exact cell count in order 8-cell (Trias) -> 7-cell (previous) -> 6-cell (legacy) -> skip.","Rows with an unrecognized `outcome` field are dropped entirely, excluded from both the total count and all outcome stats.","`parse_feedback` returns an empty list without error when `.consilium/FEEDBACK.html` does not exist.","The success-rate denominator is `OK + BAD + OVR` only; `PEND` and `PEND_HEADLESS` are excluded from the rate calculation.","`parse_feedback` is a shared utility imported by `priors.py`, `log_feedback.py`, `efficiency.py`, and deprecated scripts.","As a CLI tool, `feedback.py` prints to stdout: total logged uses, per-outcome counts, the success rate over `[confirmed]` OK/BAD rows only (with how many unconfirmed OK/BAD rows were excluded), recent overrides, and (with `--runs`) a breakdown of runs-on-disk by aggregation scheme.","Exit code is 0 always."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given `.consilium/FEEDBACK.html` does not exist, when `parse_feedback` is called, then it returns an empty list without error.\n- **CASE-2** — Given FEEDBACK.html containing all three row layouts (8-cell Trias, 7-cell previous, 6-cell legacy) and attribute-based `data-field` rows, when `parse_feedback` runs, then it correctly parses all of them.\n- **CASE-3** — Given a row whose `outcome` field is not one of `OK`, `BAD`, `OVR`, `PEND`, `PEND_HEADLESS`, when `parse_feedback` runs, then the row is silently skipped.\n- **CASE-4** — Given `--recent N` is passed, when the report is generated, then only the last N entries are included in the report stats.\n- **CASE-5** — Given `--runs` is passed, when the report is generated, then it includes a per-aggregation-scheme breakdown from `.consilium/runs/*.json`, tolerating both legacy `aggregation.scheme` and current `deliberation_log[step=aggregate].scheme` shapes.","input":"","output":"","desc":"","depends_on":["CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-LEARNING-001","CONSILIUM-AUDIT-FEEDBACK-001","CONSILIUM-CONFIDENCE-CALIBRATION-001","CONSILIUM-LOG-FEEDBACK-001","CONSILIUM-MARK-OUTCOME-001","CONSILIUM-MEMORY-001","CONSILIUM-PRIORS-001"],"satisfies":["ARCH-CONSILIUM-LEARNING-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/feedback.py:12"},{"role":"tested-by","loc":"scripts/test_feedback_html.py:7"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"3 clause(s) have no case: there are 8 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-IMPLEMENT-CODER-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"implement-coder","intent":"WHY: Isolates implementation from test-writing so the two roles can run in parallel without file conflicts and so the Red→Green gate has a clean stub to test against. The Coder owns all implementation paths and never touches test files.","contract":["The Coder writes the minimum code satisfying `chosen_approach + success_criterion`, using only the Write tool; the Coder does not write test files (disjoint-path rule — `test_*` paths belong to the Test Writer).","Coder output is strict JSON containing `files_written[]` (each entry has `path`, `purpose`, `symbols[]`) and `maps_to_criterion` (one sentence describing how the written code satisfies the success criterion).","If `chosen_approach.sketch` is insufficient to implement without guessing a missing decision, the Coder sets `blocked: true` with a non-null `blocked_reason` describing the specific missing decision; the Coder does not fabricate intent.","Any file that the Coder would touch outside the paths specified by `chosen_approach` / `files_touched` is reported in `scope_escapes[]`, and the Coder does not edit that file.","Malformed or non-JSON output is a hard failure; the implement-subagent retries the dispatch once, then aborts."],"verify":["None — all questions resolved."],"notes":[],"current_impl":["prompts/implement/coder.md","consilium/scripts/validate_implement_output.py"],"accept":"AC-1\n  Given a well-formed chosen_approach and success_criterion\n  When  the Coder completes\n  Then  output parses as JSON with non-empty files_written, non-empty maps_to_criterion, and blocked = false\n\nAC-2\n  Given a chosen_approach with an incomplete sketch (insufficient to implement without guessing)\n  When  the Coder processes the input\n  Then  blocked = true and blocked_reason is a non-null, non-empty string; no files are written\n\nAC-3\n  Given a task that would require touching a path outside files_touched\n  When  the Coder detects the scope escape\n  Then  the out-of-scope path appears in scope_escapes[], the Coder stops before writing it, and the path does not appear in files_written","input":"","output":"","desc":"","depends_on":["CONSILIUM-IMPLEMENT-PIPELINE-001"],"used_by":["ARCH-CONSILIUM-IMPLEMENT-001"],"satisfies":["ARCH-CONSILIUM-IMPLEMENT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/prompts/implement/coder.md:54"},{"role":"implements","loc":"consilium/scripts/validate_implement_output.py:31"},{"role":"tested-by","loc":"scripts/test_implement_pipeline.py:7"},{"role":"tested-by","loc":"scripts/test_validate_implement_output.py:7"}],"test_exempt":null,"milestone":"v1.1","priority":"","risks":[],"clauses":3,"covered":3,"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"2 clause(s) have no case: there are 5 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-IMPLEMENT-PIPELINE-001","layer":"feature","level":"code","status":"draft","area":"CONSILIUM","title":"implement_pipeline","intent":"Turns a deliberation report into an implementation dispatch plan; optionally verifies the red->green gate.","contract":["In planning mode, `implement_pipeline.py` turns a completed deliberation report into a structured implementation dispatch plan: Coder -> Test Writer || Reviewer.","Planning mode extracts `chosen_approach`, `success_criterion`, and `verification` from the report.","Planning mode resolves `chosen_approach` to the full candidate object `{id, summary, sketch, rationale}` from the generator step of `deliberation_log` when present; otherwise it falls back to the bare id with `chosen_resolved: false`. This ensures the Coder receives the sketch its input contract promises.","Planning mode maps the three roles (Coder, Test Writer, Reviewer) to their prompt files and emits a JSON plan for the orchestrating agent to consume.","The script is a planner, not a dispatcher: `agents/consilium-implement-subagent.md` performs the actual sub-agent calls.","In gate-verification mode (`--verify-gate`), the script runs the real test suite, expecting GREEN (exit 0).","Gate-verification mode then runs the suite in a temporary copy of the working directory whose target files have stub bodies — a heuristic line-scanner that inserts `raise NotImplementedError` after each `def`/`async def`, at the body's own indent — to confirm the suite fails RED.","The stub heuristic appends the stub marker as a new line after the `def`/`async def` header; it does not replace an existing `pass` or `...` body, and nested functions each receive their own stub insertion.","Gate-verification mode never writes to the original target files: the stubs exist only in the temporary copy, so an exception, SIGTERM or hard kill cannot leave a target stubbed. Targets must be under the working directory; otherwise the gate fails with an `error`.","A RED counts only when the stubbed `.py` targets compile and the suite output shows the stub's exception (`red_reason: behavioral`). A passing suite (`suite_passed`), a failure without that evidence (`no_stub_evidence`: collection error, missing tool), an invalid mutant or a test command that cannot start all fail the gate.","The script exits 1 for `do_nothing`/`skipped` chosen approaches, and 2 for malformed input.","Exit code 1 is shared between `do_nothing`/`skipped` (no pipeline) and gate failure; the caller reads stdout to distinguish the two cases — this collapse is intentional and documented in the script's module docstring.","stdout in plan mode is a human-readable plan summary followed by `{\"plan\": ...}` JSON; stdout in gate mode is `{\"red_ok\": bool, \"red_reason\": str, \"green_ok\": bool, \"gate_passed\": bool}` JSON, or `{\"error\": str, \"gate_passed\": false}` when no run could be made; the suite's own output goes to stderr.","Exit code is 0 on success, dry-run, or gate passed; 1 on no-pipeline or gate failure; 2 on bad input.","The plan JSON schema (`spec`, `sequence`, `roles`, `rules`) is defined entirely by `build_plan()` in this script; the subagent handoff contract lives in `agents/consilium-implement-subagent.md` and is not part of this requirement."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a report with a non-empty `chosen_approach`, when `build_plan` runs, then it returns a dict with `spec`, `sequence`, `roles`, `rules` keys, each role lists whether its prompt file exists, and `spec.chosen_approach` is the full generator candidate object with `chosen_resolved: true` when resolvable from `deliberation_log`, else the bare id with `chosen_resolved: false`.\n- **CASE-2** — Given `chosen_approach` is `do_nothing` or `skipped`, when the script runs, then it prints a message and exits 1.\n- **CASE-3** — Given `--verify-gate` mode, when the script runs, then `gate_passed` is `true` only if the real suite passes (exit 0) and the stubbed suite fails (exit non-0).\n- **CASE-4** — Given `--verify-gate` mode, when the test command raises or the process is killed during the RED run, then the original target files are byte-identical to before the run.\n- **CASE-5** — Given `--verify-gate` without `--test-cmd` or `--target`, when the script runs, then it exits 2 with an error message to stderr.","input":"","output":"","desc":"","depends_on":["CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-IMPLEMENT-001","CONSILIUM-IMPLEMENT-CODER-001","CONSILIUM-IMPLEMENT-SUBAGENT-001","CONSILIUM-IMPLEMENT-TEST-WRITER-001","CONSILIUM-INFER-PIPELINE-001"],"satisfies":["ARCH-CONSILIUM-IMPLEMENT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/modes/implement_pipeline.md:89"},{"role":"implements","loc":"consilium/scripts/implement_pipeline.py:45"},{"role":"tested-by","loc":"scripts/test_implement_pipeline.py:6"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"10 clause(s) have no case: there are 15 clauses and 5 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-IMPLEMENT-SUBAGENT-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"consilium-implement-subagent","intent":"WHY: Post-deliberation implementation vehicle that translates a GO Consilium report into written code + tests. Keeps implementation work out of the orchestrator context, enforces disjoint-path ownership between Coder and Test Writer, and gates output with Red→Green test verification.","contract":["The system provides a `consilium-implement-subagent` agent that, given a GO Consilium deliberation report, executes the Coder → (Test Writer ∥ Reviewer) pipeline and returns a JSON file manifest — NOT a `.consilium/runs/` deliberation report.","Pipeline sequence: (1) Coder writes implementation files; (2) Test Writer and Reviewer are dispatched in parallel on the written code; (3) Red→Green gate verifies tests are RED against a stub and GREEN against the real implementation.","The subagent enforces disjoint-path ownership: Coder writes implementation files; Test Writer writes `test_*` files only; Reviewer writes nothing.","If the Coder or Test Writer returns malformed or non-JSON output, the subagent retries that dispatch once.","On a second failure, the subagent aborts and returns `{\"error\": \"subagent_json_invalid\", \"role\": \"<coder|test_writer>\"}`.","The subagent never proceeds on an empty or fabricated manifest.","The subagent does not re-run the deliberation; `chosen_approach` from the input report is the fixed spec (resolved by `build_plan` to the full candidate object when the generator step is present in `deliberation_log`; optional Coder fan-out targets are derived from the chosen candidate's `sketch` — reports carry no `files_touched[]` field).","Output contract: strict JSON with `files_written`, `test_files_written`, `gate` (red_ok, green_ok, gate_passed), `gate_rejected`, `review`, `blocked`, `blocked_reason`."],"verify":["None — all questions resolved."],"notes":[],"current_impl":["agents/consilium-implement-subagent.md"],"accept":"AC-1\n  Given a GO report with non-empty chosen_approach and success_criterion\n  When  the subagent runs\n  Then  the final message parses as JSON matching the output contract, files_written exist on disk, test_files_written are test_* only, and no runs/<file>.json was created\n\nAC-2\n  Given a GO report where chosen_approach is do_nothing or skipped\n  When  the subagent processes the input\n  Then  it exits early (dry-run indicates skip) without writing any files\n\nAC-3\n  Given a Coder or Test Writer that returns malformed JSON\n  When  the retry fires and also fails\n  Then  the subagent returns the error JSON and does not proceed to the gate or manifest assembly","input":"","output":"","desc":"","depends_on":["CONSILIUM-IMPLEMENT-PIPELINE-001","CONSILIUM-SUBAGENT-001"],"used_by":["ARCH-CONSILIUM-IMPLEMENT-001"],"satisfies":["ARCH-CONSILIUM-IMPLEMENT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/agents/consilium-implement-subagent.md:169"}],"test_exempt":"agent spec document — behavioral contract validated by Step 7 auto-dispatch integration and implement-subagent smoke tests","milestone":"v1.1","priority":"","risks":[],"clarify":[{"rule":"ambiguous-actor","severity":"advisory","basis":"wording","where":"clause 1","quote":"The system provides a `consilium-implement-subagent` agent that, given a GO Consilium deliberation report, executes the Coder → (Test Writer ∥ Reviewer) pipeline and returns a JSON file manifest — NOT a `.consilium/runs/` deliberation report.","question":"Who performs this -- which command or component?","suggest":"Name the subject the title names, so the clause reads on its own."},{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"5 clause(s) have no case: there are 8 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-IMPLEMENT-TEST-WRITER-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"implement-test-writer","intent":"WHY: Separates test authorship from implementation to enable parallel execution and to enforce the Red→Green gate independently. The Test Writer owns test_* files exclusively; implementation files are never touched by this role.","contract":["The Test Writer writes `test_*` files only (disjoint-path rule); the Test Writer never writes or edits implementation files.","Every test emitted satisfies the Red→Green gate: `fails_on_empty_impl` is true for each test — the test fails against a `raise NotImplementedError` stub and passes against the real implementation. A test that passes against the stub is not pinning behavior, and is rejected.","Test Writer output is strict JSON containing `test_files_written[]` (each entry has `path` and `covers`), `tests[]` (each entry has `name`, `targets_symbol`, `behavior_pinned`, `fails_on_empty_impl`, `why`), and `uncoverable[]`.","Malformed or non-JSON output is a hard failure; the implement-subagent retries once, then aborts."],"verify":["None — all questions resolved."],"notes":[],"current_impl":["prompts/implement/test_writer.md","consilium/scripts/validate_implement_output.py"],"accept":"AC-1\n  Given a well-formed success_criterion and files_written from the Coder\n  When  the Test Writer completes\n  Then  output parses as JSON, test_files_written is non-empty (every path starts with test_), and every test in tests[] has fails_on_empty_impl = true\n\nAC-2\n  Given a test emitted by the Test Writer\n  When  the implement-subagent runs the Red→Green gate\n  Then  the test is RED against a stub implementation and GREEN against the real one; any test that is green under the stub appears in gate_rejected\n\nAC-3  <\!-- verifiable by: inspection -\->\n  Given a behavior that cannot be covered by automated tests\n  When  the Test Writer identifies it\n  Then  it appears in uncoverable[] with a reason and no test is emitted for it","input":"","output":"","desc":"","depends_on":["CONSILIUM-IMPLEMENT-PIPELINE-001"],"used_by":["ARCH-CONSILIUM-IMPLEMENT-001"],"satisfies":["ARCH-CONSILIUM-IMPLEMENT-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/prompts/implement/test_writer.md:60"},{"role":"implements","loc":"consilium/scripts/validate_implement_output.py:32"},{"role":"tested-by","loc":"scripts/test_implement_pipeline.py:8"},{"role":"tested-by","loc":"scripts/test_validate_implement_output.py:8"}],"test_exempt":null,"milestone":"v1.1","priority":"","risks":[],"clauses":2,"covered":2,"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"1 clause(s) have no case: there are 4 clauses and 3 while still producing the full 3-5 candidate spread — larger candidates are ranked lower, never censored.","When applied to Conservator, the lens affects only magnitude calibration and meta_recommendation; it does not deflate the `net_concern` numerical formula or its component scores because a candidate \"deletes more\".","The lens is the generator-heavy Trias personality (weights generator 0.49 / control 0.30 / conservator 0.21) and is one of the three fixed personalities the Trias team dispatches."],"verify":["None - all questions resolved."],"notes":[],"current_impl":["prompts/voices/essentialist_lens.md"],"accept":"AC-1\n  Given  a set of candidates evaluated under Trias, one minimal/deletion-based and one additive, otherwise comparable\n  When   the Essentialist lens is prepended to a core voice\n  Then   the voice's chosen or most-favored candidate is the minimal/deletion-based option\n\nAC-2\n  Given  the Essentialist lens applied to the Generator voice\n  When   the Generator produces its candidate spread\n  Then   the spread still contains 3-5 candidates including a do_nothing/minimal option, with larger candidates present but ranked lower\n\nAC-3\n  Given  two candidates with identical Conservator component scores, where one candidate deletes more code than the other\n  When   the Essentialist lens is prepended to the Conservator voice\n  Then   both candidates receive the same `net_concern`: the lens changes only magnitude calibration and `meta_recommendation`, and the formula is not deflated","input":"","output":"","desc":"","depends_on":["CONSILIUM-PERSONALITIES-001"],"used_by":["ARCH-CONSILIUM-VOICES-001","CONSILIUM-MODE-LENS-001","CONSILIUM-MODE-TRIAS-001"],"satisfies":["ARCH-CONSILIUM-VOICES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/prompts/voices/essentialist_lens.md:37"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.1","priority":"","risk e lens is the conservator-heavy Trias personality (weights generator 0.30 / control 0.30 / conservator 0.40) and is one of the three fixed personalities the Trias team dispatches."],"verify":["None - all questions resolved."],"notes":[],"current_impl":["prompts/voices/sentinel_lens.md"],"accept":"AC-1\n  Given  two otherwise comparable candidates, one carrying a plausible silent-failure mode and one failing loudly\n  When   the Sentinel lens is prepended to a core voice\n  Then   the voice ranks the loud-failure candidate above the silent-failure one, and the silent-failure mode is surfaced explicitly\n\nAC-2\n  Given  the Sentinel lens applied to the Generator voice\n  When   the Generator produces its candidate spread\n  Then   the spread still contains 3-5 candidates including higher-upside options, each with its adverse scenario recorded in the risks/trade-off fields\n\nAC-3\n  Given  two candidates with identical Conservator component scores, where one candidate is described with a vivid adverse-scenario narrative\n  When   the Sentinel lens is prepended to the Conservator voice\n  Then   both candidates receive the same `net_concern`: the lens changes only magnitude calibration and `meta_recommendation`, and the formula is not inflated","input":"","output":"","desc":"","depends_on":["CONSILIUM-PERSONALITIES-001"],"used_by":["ARCH-CONSILIUM-VOICES-001","CONSILIUM-MODE-TRIAS-001"],"satisfies":["ARCH-CONSILIUM-VOICES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/prompts/voices/sentinel_lens.md:39"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.1","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"2 clause(s) have no case: there are 5 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."}]},{"id":"CONSILIUM-LENS-VERIFIER-001","layer":"feature","level":"code","status":"confirmed","area":"CONSILIUM","title":"verifier lens","intent":"WHY: control-heavy member of the Trias personality team — biases all three voices toward operational clarity: vague claims must be replaced with verifiable criteria, and candidates with checkable success signals are preferred over comparable ones whose success is a matter of opinion.","contract":["The Verifier lens causes the voice it overlays to replace vague quality terms with testable criteria, naming per candidate the signal distinguishing working from silently-not-working.","The lens preserves each voice's standard structural role; it shifts perception and priority without suppressing the role's core output.","When applied to Control, demanding testability does not stall the verdict: an unverifiable claim lowers confidence and becomes a named condition — it is not an automatic BLOCK, and no unbounded evidence may be demanded before ruling.","When applied to Conservator, the lens affects only magnitude calibration and meta_recommendation; it does not shift the `net_concern` numerical formula because a claim is merely well-phrased.","The lens is the control-heavy Trias personality (weights generator 0.30 / control 0.40 / conservator 0.30) and is one of the three fixed personalities the Trias team dispatches."],"verify":["None - all questions resolved."],"notes":[],"current_impl":["prompts/voices/verifier_lens.md"],"accept":"AC-1\n  Given  two otherwise comparable candidates, one with a checkable success criterion and one whose benefit is stated in vague terms\n  When   the Verifier lens is prepended to a core voice\n  Then   the voice's chosen or most-favored candidate is the one with the checkable criterion\n\nAC-2\n  Given  the Verifier lens applied to the Control voice and a chosen candidate carrying an unverifiable claim\n  When   Control produces its verdict\n  Then   the verdict is still issued, with the unverifiable claim surfaced as a named condition or confidence reduction rather than an automatic BLOCK\n\nAC-3\n  Given  two candidates with identical Conservator component scores, where one candidate's claims are more precisely phrased than the other's\n  When   the Verifier lens is prepended to the Conservator voice\n  Then   both candidates receive the same `net_concern`: the lens changes only magnitude calibration and `meta_recommendation`, and the formula is not shifted","input":"","output":"","desc":"","depends_on":["CONSILIUM-PERSONALITIES-001"],"used_by":["ARCH-CONSILIUM-VOICES-001","CONSILIUM-MODE-LENS-001","CONSILIUM-MODE-TRIAS-001"],"satisfies":["ARCH-CONSILIUM-VOICES-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/prompts/voices/verifier_lens.md:51"}],"test_exempt":"prompt/mode document — acceptance validated by deliberation integration runs, not unit tests","milestone":"v1.1","priority":"","risks":[],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"2 clause(s) have no case: there are 5 clauses and 3 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement already carries its cases."},{"rule":"no-failure-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"What happens on the failure path -- missing input, invalid value, nothing to do?","suggest":"Add one case for the way this can go wrong; it is the case implementations skip."}]},{"id":"CONSILIUM-LOG-FEEDBACK-001","layer":"feature","level":"code","status":"draft","area":"CONSILIUM","title":"log_feedback","intent":"Atomically appends (or upgrades) a FEEDBACK.html row from a deliberation report.","contract":["`log_feedback.py` atomically appends a feedback entry to FEEDBACK.html from a deliberation report JSON, removing the manual friction of Step 6 outcome logging.","`log_feedback.py` derives `date` (today), `context` (first 60 chars of `success_criterion`), `chosen` (from `chosen_approach`), an auto-generated `note` (candidate count, veto count, confidence, mode), and records the caller-supplied `outcome`.","Before appending, it checks for duplicates using a 16-character SHA-256 fingerprint keyed on `date|chosen|context|run_id`.","If the existing row has the same `run_path` but a different outcome (e.g., PEND->OK), the row is upgraded in place rather than duplicated.","The sidecar `.run_path_map.json` is updated on every real write so `efficiency.py` and `audit_feedback.py` can later join outcomes to telemetry by run path.","`--weak` adds the `[weak]` marker to the note for a run below its mode confidence floor; the row's outcome is unchanged (`PEND`), because WEAK is advisory quality metadata, not an observed outcome. `--outcome WEAK` is rejected.","`--outcome OK` requires `--confirmed` (the verification passed or the user confirmed the result), which adds the `[confirmed]` marker; it also enforces a 0.70 confidence threshold gate, requiring `--force-override` to bypass.","stdout is a `date | context | chosen | outcome | note` summary line (or `skipped (duplicate): ...` on exit 3).","`.consilium/FEEDBACK.html` is updated atomically with the new or upgraded row; `.consilium/runs/.run_path_map.json` is updated with the new fingerprint->run_path entry.","Exit code is 0 on success, 1 on validation error or confidence gate rejection, 2 on malformed JSON or missing required args, 3 on duplicate entry skipped.","When `run_id` is absent, the fingerprint falls back to a microsecond-precision timestamp (`datetime.now().strftime(\"%f\")`) as the 4th field, not a 3-field key. This prevents same-day collisions but makes the fingerprint non-deterministic.","Two recomputed fingerprints for the same legacy row differ, so old no-run_id rows can never be matched by fingerprint lookup — they fall back to `run_path=None`.","The confidence gate reads `report.get(\"confidence\")` — the top-level key only. When a report carries both a top-level `confidence` and a nested `confidence.confidence` dict, the top-level value is used and the nested form is silently ignored.","The whole append or upgrade — parse the rows, write the row, write the sidecar — runs under `feedback_lock` (an exclusive cross-process lock on `FEEDBACK.html.lock`), so concurrent callers (appends and outcome upgrades alike) each start from the previous caller's result and no row is lost. A caller that cannot get the lock within 30 s fails with `TimeoutError`.","The row is written before its sidecar entry. A call interrupted between the two leaves a row with no sidecar entry; a retry with the same `--run-path` adopts that row (same `date|chosen|context`, claimed by no sidecar entry) instead of appending a duplicate, and saves the missing sidecar entry."],"verify":["None - all questions resolved."],"notes":[],"current_impl":[],"accept":"- **CASE-1** — Given a report with a valid `success_criterion` and `chosen_approach`, when `log_feedback.py` runs, then it produces a new `<tr>` row in FEEDBACK.html with the correct date, truncated context, and derived note.\n- **CASE-2** — Given the same report is appended twice with the same `--run-path` and the same `--outcome`, when the second call runs, then it exits 3 and does not add a duplicate row.\n- **CASE-3** — Given the same report is appended twice with the same `--run-path` but a different outcome (e.g. PEND then OK), when the second call runs, then it upgrades the existing row in place and exits 0.\n- **CASE-4** — Given `--outcome OK` with a report whose `confidence` is below 0.70, when the script runs without `--force-override`, then it exits 1 with an error message.\n- **CASE-4b** — Given `--outcome OK` without `--confirmed`, when the script runs, then it exits 1 and writes nothing.\n- **CASE-5** — Given `--outcome OVR` without `--override-target`, when the script runs, then it exits 2 with an error message to stderr.\n- **CASE-6** — Given several `log_feedback.py` processes run at once (distinct appends plus an outcome upgrade of an existing row), when they all finish, then every appended row is present and the upgrade is applied.\n- **CASE-7** — Given the sidecar write fails after the row was written, when the same call is retried, then FEEDBACK.html still holds exactly one such row and the sidecar maps the run path.\n- **CASE-8** — Given a below-floor result from `check_mode_floor`, when `log_feedback.py --weak` runs, then FEEDBACK.html holds one row with outcome `PEND` and a `[weak]` note marker, and `feedback.py` reads it back.","input":"","output":"","desc":"","depends_on":["CONSILIUM-FEEDBACK-001","CONSILIUM-RENDER-FEEDBACK-HTML-001","CONSILIUM-UTILS-001"],"used_by":["ARCH-CONSILIUM-LEARNING-001"],"satisfies":["ARCH-CONSILIUM-LEARNING-001"],"satisfied_by":[],"members":[{"role":"implements","loc":"consilium/scripts/log_feedback.py:48"},{"role":"tested-by","loc":"scripts/test_log_feedback.py:10"}],"test_exempt":null,"milestone":"v1.0","priority":"","risks":[{"signal":"unreviewed","advice":"Draft/baseline, not yet validated: review the contract, wire its `tested-by` tests, then promote to `confirmed`. Until then it is tracked, not enforced."}],"clarify":[{"rule":"clause-without-case","severity":"advisory","basis":"wording","where":"Cases","quote":"","question":"6 clause(s) have no case: there are 15 clauses and 9 cases. This check counts, it does not read, so it cannot say WHICH — that is the part only you can do.","suggest":"Walk the clauses and find the one no case proves. Add a case for it, fold it into an existing case, or move it out of the binding list if another requirement
